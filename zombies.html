<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ZOMBIE STREET</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/audio.js"></script>
  <script>
    // If audio.js ever fails to load, every TanaAudio call becomes a harmless no-op.
    window.TanaAudio = window.TanaAudio || new Proxy({}, { get: () => () => null });
  </script>
  <style>
    /* ── Touch-control tuning — tweak these ── */
    :root {
      --ctrl-bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); /* button cluster + joystick rest spot, from the bottom */
      --ctrl-side:   16px;   /* inset from the left/right edge (safe-area is added on top) */
      --hud-h:       44px;   /* top strip the floating joystick ignores (HUD + mute button) */
      --joy-zone-w:  45%;    /* touches starting in this left share of the screen drive the joystick */
      --joy-base:    170px;
      --joy-knob:    64px;
      --fire-size:   104px;
      --weapon-size: 64px;
      --buy-size:    64px;   /* vending BUY button, left of the fire button */
      --ctrl-gap:    10px;   /* gap between the weapon and fire buttons */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; overflow: hidden; }

    body {
      background: #05050a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      color: #e0e0e0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* ── GAME CONTAINER — fills the full viewport edge to edge ── */
    #game-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #05050a;
    }

    /* ── Rotate prompt (portrait mobile only) ── */
    #rotate-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: #05050a;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #rotate-icon { font-size: 48px; animation: spin 2s ease-in-out infinite; }
    @keyframes spin {
      0%,100% { transform: rotate(0deg); }
      50%      { transform: rotate(90deg); }
    }
    #rotate-msg { font-size: 10px; color: #e94560; letter-spacing: 3px; }
    #rotate-sub { font-size: 6px; color: #333355; letter-spacing: 1px; }
    @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    canvas {
      display: block;
      position: absolute;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Retro pixelation transition — the reverse of room 1's exit dissolve.
       Covers the game on load and animates away as the scene resolves
       into focus. */
    #transitionCanvas {
      z-index: 90;
      opacity: 0;
      pointer-events: none;
    }

    /* CRT scanlines — same texture as room 1 */
    #game-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px
      );
      pointer-events: none;
      z-index: 50;
    }

    /* ────────────────────────────────────────
       TOUCH CONTROLS  (body-level fixed overlay)
    ──────────────────────────────────────── */
    #touch-ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 15;
    }
    @media (hover: none) and (pointer: coarse) {
      #touch-ui { display: block; }
    }

    /* Floating joystick: #joystick-zone is just the invisible touch catcher
       (left share of the screen, below the HUD). #joystick-base is the
       visible ring — it jumps under the thumb on touch and eases back to
       #joystick-rest (the default bottom-left spot) on release. */
    #joystick-zone {
      position: absolute;
      left: 0; top: var(--hud-h); bottom: 0;
      width: var(--joy-zone-w);
      pointer-events: all;
      touch-action: none;
    }
    #joystick-rest {
      position: absolute;
      bottom: var(--ctrl-bottom);
      left:   calc(env(safe-area-inset-left, 0px) + var(--ctrl-side));
      width: var(--joy-base); height: var(--joy-base);
      visibility: hidden;
      pointer-events: none;
    }
    #joystick-base {
      position: absolute;
      left: 0; top: 0;                   /* set from JS */
      width: var(--joy-base); height: var(--joy-base);
      border-radius: 50%;
      background: rgba(233,69,96,0.08);
      border: 2px solid rgba(233,69,96,0.35);
      box-shadow: 0 0 18px rgba(233,69,96,0.18);
      opacity: 0.35;                     /* faint while idle */
      pointer-events: none;
      transition: left 0.15s ease-out, top 0.15s ease-out, opacity 0.15s ease-out;
    }
    #joystick-base.active {
      opacity: 1;
      transition: opacity 0.08s linear;  /* position jumps, only the fade animates */
    }
    #joystick-knob {
      position: absolute;
      width: var(--joy-knob); height: var(--joy-knob);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e94560, #5c1a28);
      border: 2px solid rgba(233,69,96,0.9);
      box-shadow: 0 0 14px rgba(233,69,96,0.5);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }
    #joystick-base.active #joystick-knob { transition: none; }

    /* fire button — bottom-right of viewport (mirrors room 1's interact
       button pattern, relabeled with a crosshair for hold-to-fire) */
    #fire-btn {
      position: absolute;
      bottom: var(--ctrl-bottom);
      right:  calc(env(safe-area-inset-right, 0px) + var(--ctrl-side));
      width: var(--fire-size); height: var(--fire-size);
      border-radius: 50%;
      background: rgba(233,69,96,0.09);
      border: 2px solid rgba(233,69,96,0.5);
      display: flex; align-items: center; justify-content: center;
      pointer-events: all; touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, box-shadow 0.08s;
      font-size: 40px; color: #e94560;
    }
    #fire-btn.pressed {
      background: rgba(233,69,96,0.32);
      box-shadow: 0 0 22px rgba(233,69,96,0.55);
    }

    /* weapon-switch button — same bottom-right cluster as fire-btn, sits
       just above it. Tap cycles to the next unlocked weapon; shows its
       short label so the player can see what's equipped without
       checking the HUD. */
    #weapon-btn {
      position: absolute;
      bottom: calc(var(--ctrl-bottom) + var(--fire-size) + var(--ctrl-gap));
      right:  calc(env(safe-area-inset-right, 0px) + var(--ctrl-side) + (var(--fire-size) - var(--weapon-size)) / 2);
      width: var(--weapon-size); height: var(--weapon-size);
      border-radius: 50%;
      background: rgba(249,199,79,0.09);
      border: 2px solid rgba(249,199,79,0.5);
      display: flex; align-items: center; justify-content: center;
      pointer-events: all; touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, box-shadow 0.08s;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px; color: #f9c74f;
      text-align: center;
    }
    #weapon-btn.pressed {
      background: rgba(249,199,79,0.32);
      box-shadow: 0 0 22px rgba(249,199,79,0.55);
    }

    /* vending BUY button — same look as weapon-btn, sits just left of fire.
       Only displayed while the player is within VEND_RANGE of the machine. */
    #buy-btn {
      position: absolute;
      bottom: calc(var(--ctrl-bottom) + (var(--fire-size) - var(--buy-size)) / 2);
      right:  calc(env(safe-area-inset-right, 0px) + var(--ctrl-side) + var(--fire-size) + var(--ctrl-gap));
      width: var(--buy-size); height: var(--buy-size);
      border-radius: 50%;
      background: rgba(78,204,163,0.10);
      border: 2px solid rgba(78,204,163,0.6);
      display: none; align-items: center; justify-content: center;
      pointer-events: all; touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, box-shadow 0.08s, opacity 0.15s;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px; color: #4ecca3;
      text-align: center;
    }
    #buy-btn.show { display: flex; }
    #buy-btn.cant { opacity: 0.45; }
    #buy-btn.pressed {
      background: rgba(78,204,163,0.32);
      box-shadow: 0 0 22px rgba(78,204,163,0.55);
    }

    /* ────────────────────────────────────────
       GAME OVER — score submission + leaderboard
    ──────────────────────────────────────── */
    #gameover-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(5,5,10,0.92);
      display: none; align-items: center; justify-content: center;
      padding: max(env(safe-area-inset-top,0px),20px)
               max(env(safe-area-inset-right,0px),20px)
               max(env(safe-area-inset-bottom,0px),20px)
               max(env(safe-area-inset-left,0px),20px);
    }
    #gameover-overlay.active { display: flex; }
    #gameover-box {
      width: min(360px, 100%);
      max-height: calc(100svh - 40px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #0c0710;
      border: 2px solid #e94560;
      box-shadow: 0 0 40px rgba(233,69,96,0.35);
      padding: 22px 22px 18px;
      text-align: center;
    }
    #gameover-title {
      font-size: 18px; color: #e94560; letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(233,69,96,0.7);
      margin-bottom: 16px;
    }
    #gameover-stats { font-size: 9px; color: #b0b8d0; line-height: 2.4; margin-bottom: 16px; }
    #gameover-stats b { color: #f9c74f; }

    #go-name-wrap { margin-bottom: 12px; }
    #go-name-input {
      width: 100%;
      background: #080818; border: 1px solid #4ecca3; color: #4ecca3;
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 9px 10px; outline: none; text-align: center;
    }
    #go-name-input::placeholder { color: #1a3a2a; }

    #go-name-static { font-size: 9px; color: #4ecca3; margin-bottom: 12px; }

    #go-submit-btn, #go-playagain-btn {
      width: 100%;
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 10px; cursor: pointer;
      background: rgba(78,204,163,0.08); border: 1px solid #4ecca3; color: #4ecca3;
      transition: background 0.1s;
    }
    #go-submit-btn:hover, #go-playagain-btn:hover { background: rgba(78,204,163,0.22); }
    #go-submit-btn:disabled { opacity: 0.4; cursor: default; }

    #go-submit-status { font-size: 7px; color: #f9c74f; margin: 8px 0; min-height: 10px; }

    #go-leaderboard { margin: 16px 0; border-top: 1px solid #2a1420; padding-top: 12px; }
    #go-leaderboard-title { font-size: 9px; color: #e94560; margin-bottom: 8px; letter-spacing: 1px; }
    #go-leaderboard-list { list-style: none; font-size: 7.5px; color: #b0b8d0; text-align: left; }
    #go-leaderboard-list li {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 4px 2px; border-bottom: 1px solid #1a1020;
    }
    #go-leaderboard-list li span:first-child { color: #f9c74f; flex-shrink: 0; }
    #go-leaderboard-empty { font-size: 7px; color: #4a4a5a; }

    #go-playagain-btn { margin-top: 4px; border-color: #e94560; color: #e94560; background: rgba(233,69,96,0.08); }
    #go-playagain-btn:hover { background: rgba(233,69,96,0.22); }

    /* ── Master mute toggle (same look as room 1's; sits under the HUD line) ── */
    #mute-toggle {
      position: fixed;
      top: 32px; right: 8px;
      width: 24px; height: 24px;
      background: rgba(5,5,10,0.72);
      border: 1px solid #f9c74f;
      color: #f9c74f;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      cursor: pointer;
      z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 0; outline: none;
      box-shadow: 0 0 10px rgba(249,199,79,0.20);
    }
    #mute-toggle:hover { background: rgba(249,199,79,0.18); }
    #mute-toggle.muted { color: #555; border-color: #333; box-shadow: none; }
    #mute-toggle.muted span { text-decoration: line-through; }
  </style>
</head>
<body>

<div id="game-container">

  <div id="rotate-screen">
    <div id="rotate-icon">⟳</div>
    <div id="rotate-msg">ROTATE DEVICE</div>
    <div id="rotate-sub">this game is landscape only</div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <canvas id="transitionCanvas"></canvas>

</div>

<div id="touch-ui">
  <div id="joystick-zone"></div>
  <div id="joystick-rest"></div>
  <div id="joystick-base"><div id="joystick-knob"></div></div>
  <div id="buy-btn">BUY</div>
  <div id="weapon-btn">PST</div>
  <div id="fire-btn">⊕</div>
</div>

<button id="mute-toggle" type="button" aria-label="Mute all sound" title="Mute all sound (M)"><span>♪</span></button>

<div id="gameover-overlay">
  <div id="gameover-box">
    <div id="gameover-title">GAME OVER</div>
    <div id="gameover-stats">
      <span id="go-gross-row">SCORE: <b id="go-gross">0</b><br></span>
      <span id="go-spent-row" style="display:none">SPENT: <b id="go-spent" style="color:#e94560">0</b><br></span>
      <span id="go-bonus-row" style="display:none">NO-HEAL BONUS: <b id="go-bonus" style="color:#4ecca3">0</b><br></span>
      FINAL: <b id="go-score">0</b><br>
      WAVE REACHED: <b id="go-wave">1</b>
    </div>

    <div id="go-name-wrap" style="display:none">
      <input id="go-name-input" maxlength="12" placeholder="YOUR NAME" autocomplete="off">
    </div>
    <div id="go-name-static" style="display:none"></div>

    <button id="go-submit-btn">SUBMIT SCORE</button>
    <div id="go-submit-status"></div>

    <div id="go-leaderboard">
      <div id="go-leaderboard-title">▸ TOP 10</div>
      <ol id="go-leaderboard-list"></ol>
    </div>

    <button id="go-playagain-btn">PLAY AGAIN</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────
//  ZOMBIE STREET — Room 2 foundation
//  Same vanilla Canvas architecture as index.html (room 1): world size
//  auto-derived from the background image, fixed camera-window
//  resolution panned across it, sceneObjects + wouldCollide() for
//  static geometry, Y-sorted rendering, responsive resizeGame().
//
//  No zombies, combat, or wave logic yet — this pass only builds the
//  walkable street and gets the player moving around in it.
// ─────────────────────────────────────────────────────────

// These get overwritten by bgImg.onload — do not change manually
let WORLD_W = 3200;   // placeholder — replaced once plt2.png loads
let WORLD_H = 1600;   // placeholder

// Fixed camera-window resolution — IDENTICAL to index.html's VIEW_W/VIEW_H.
// The camera pans this same fixed window across the much larger world
// instead of scaling the window up.
const VIEW_W = 1537;
const VIEW_H = 768;

let SCREEN_W = VIEW_W;
let SCREEN_H = VIEW_H;

// ── Player geometry — hardcoded to the actual on-screen pixel size
//    index.html renders the player at (NOT a % of this room's much
//    taller background, which would render ~2x too large). ──
const PW          = 92;
const PH          = 123;
const FEET_OY     = Math.round(PH * 0.77);   // 95
const FEET_H      = Math.round(PH * 0.23);   // 28
const FEET_MARGIN = Math.round(PW * 0.28);   // 26
const SPEED       = 4.5;
const JOY_SPEED    = 4.5;

// World-bounds margin — keeps the player from walking off the map edge.
// (Room 1 uses ROOM_L/R + FLOOR_TOP/BTM for an interior floor plan; this
// is the open-street equivalent — the walkable area is the whole map
// minus a small edge margin, with buildings as the actual obstacles.)
const WORLD_MARGIN = 20;

// ── Night tint — shared helper, reused later for zombies + weapon sheets.
//    Composites a translucent navy multiply-tint over a sprite's own
//    silhouette so day-lit art reads as night-lit without new art. ──
const NIGHT_TINT_COLOR    = '#141c3a';
const NIGHT_TINT_STRENGTH = 0.5;   // 0..1

// ─────────────────────────────────────────────────────────
//  ZOMBIE TIERS — plain constants, hand-tune freely.
//  A is weakest/slowest, C is strongest/fastest. Contact damage isn't
//  applied yet (no player HP this pass) but is defined now so combat
//  can read it directly later.
// ─────────────────────────────────────────────────────────
const ZOMBIE_TIERS = {
  A: { hp: 20, speed: 1.5, damage: 5,  color: '#3a4a34', sheet: 'assets/zombieA.png' },
  B: { hp: 45, speed: 2.0, damage: 10, color: '#4a3a52', sheet: 'assets/zombieB.png' },
  C: { hp: 90, speed: 2.6, damage: 18, color: '#5c2020', sheet: 'assets/zombieC.png' },
};

// Wave at which each tougher tier first becomes eligible to spawn.
const WAVE_TIER_B_START = 3;
const WAVE_TIER_C_START = 6;

// Once unlocked, a tier's share of spawns grows this much per wave
// beyond its unlock wave, capped so tier A never fully disappears.
const TIER_WEIGHT_GROWTH = 0.15;
const TIER_WEIGHT_MAX    = 0.6;

// ── Difficulty scaling — formula-driven, not a hand-written table. ──
const ZOMBIE_COUNT_BASE    = 4;   // zombies in wave 1
const ZOMBIE_COUNT_GROWTH  = 2;   // additional zombies per wave
const ZOMBIE_COUNT_MAX     = 40;  // hard cap regardless of wave number

const ZOMBIE_HP_MULT_GROWTH    = 0.08;  // +8% HP per wave beyond 1
const ZOMBIE_HP_MULT_MAX       = 2.5;
const ZOMBIE_SPEED_MULT_GROWTH = 0.02;  // +2% speed per wave beyond 1
const ZOMBIE_SPEED_MULT_MAX    = 1.6;

// Hand overrides for the first few waves — anything not listed here
// falls through to the ZOMBIE_COUNT_* formula above.
const WAVE_COUNT_OVERRIDES = {
  1: 4,
  2: 6,
};

const SPAWN_INTERVAL = 900;   // ms between individual zombie spawns during a wave

const WAVE_INTRO_DURATION = 2200; // ms the "WAVE N" banner is shown
const WAVE_CLEAR_DURATION = 2500; // ms countdown after the last zombie is gone

// Extra settle time after the intro pixelation transition finishes, before
// the wave/spawn system (and its banner) actually begins — gives any
// still-loading player/zombie/weapon art a moment to arrive. The player
// can still move around freely during this buffer; only waves are held.
const GAME_START_BUFFER_MS = 2000;
// wave_start.mp3's big hit sits this far into the file — it's scheduled so
// the hit lands exactly when the wave starts spawning (see scheduleWaveStartSfx).
const WAVE_START_HIT_SEC = 4.75;

// Anti-stuck: if a zombie has barely moved for this long despite trying,
// it's wedged in a concave corner the axis-slide alone can't escape —
// give it a small perpendicular shove to break free.
const STUCK_CHECK_INTERVAL = 2000; // ms window to judge "hasn't moved"
const STUCK_MIN_DISTANCE   = 6;    // px moved within the window to NOT be stuck
const STUCK_NUDGE          = 14;   // px, perpendicular shove magnitude

// A knocked-back zombie (see applyZombieKnockback) is "staggered" for this
// long — its push velocity drives movement instead of the normal
// chase-toward-player logic, decaying linearly to zero across the window.
const KNOCKBACK_STAGGER_DURATION = 380; // ms

// ─────────────────────────────────────────────────────────
//  WEAPONS — plain per-weapon constants, hand-tune freely.
//  coneDeg is the FULL angle of the hitscan cone (centered on the aim
//  angle). With 8 aim directions 45° apart, a single-target weapon's
//  cone must stay well under 45° or two adjacent directions would hit
//  the same target — the shotgun is the deliberate exception: it's
//  wide enough to overlap neighboring directions and can multi-hit.
// ─────────────────────────────────────────────────────────
const WEAPON_ORDER = ['pistol', 'uzi', 'shotgun', 'draco', 'hose']; // unlock progression order (hose comes from the secret hydrant, not a wave)

// ─────────────────────────────────────────────────────────
//  SECRET HYDRANT — hydrant_2 can be shot to pieces; it then spouts a
//  water jet and drops the WATER HOSE pickup (once per run).
// ─────────────────────────────────────────────────────────
const SECRET_HP            = 2000;
const SECRET_FLASH_MS      = 70;     // white flash on hit
const SECRET_SHAKE_PX      = 2;      // draw-position shake, decays (visual only)
const SECRET_SHAKE_MS      = 120;
const SECRET_BAR_W         = 36;     // tiny hp bar above it
const SECRET_BAR_H         = 3;
const SECRET_BAR_HOLD_MS   = 1200;   // fully visible this long after the last hit...
const SECRET_BAR_FADE_MS   = 300;    // ...then fades out over this
const SECRET_HIT_RADIUS    = 30;     // px — how "fat" the hydrant is for the aim cone
const SECRET_PICKUP_OFFSET = { x: 85, y: -12 }; // hose pickup, from the hydrant's ground point
const SECRET_PICKUP_RADIUS = 46;     // px from the player's feet to grab it
const SECRET_JET           = { everyMs: 30, speed: [0.22, 0.40], life: [450, 800], gravity: 0.0005, spread: 0.30 };
const SECRET_BURST_COUNT   = 50;     // water burst when it breaks

// ─────────────────────────────────────────────────────────
//  HOSE — the water hose weapon. Hold fire to spray; every zombie in the
//  cone is pushed (continuous force) and damaged (every HOSE_TICK_MS).
// ─────────────────────────────────────────────────────────
const HOSE_CONE_DEG        = 50;    // as wide as the shotgun
const HOSE_RANGE           = 650;   // about twice the shotgun's reach
const HOSE_TICK_MS         = 150;   // damage/push applied every tick while held
const HOSE_DAMAGE_NEAR     = 2;     // max damage per tick, close range
const HOSE_DAMAGE_FAR      = 1;     // damage per tick in the far half of the range
const HOSE_PUSH_NEAR       = 7;     // px per frame push at point-blank
const HOSE_PUSH_MIN_FRAC   = 0.15;  // push at max range = 15% of near push
const HOSE_TANK_MAX        = 100;
const HOSE_DRAIN_PER_SEC   = 22;    // ~4.5 s of continuous spray from full
const HOSE_REFILL_PER_SEC  = 12;    // refills only while not spraying
const HOSE_REFILL_DELAY_MS = 600;   // pause after spraying before refill starts
// extras
const HOSE_SPUTTER_RECOVER = 25;    // after running dry, can't spray again until the tank is above this
const HOSE_RESIST          = { A: 1.0, B: 0.7, C: 0.4 }; // per-tier push resistance
const HOSE_BEAM_FADE_MS    = 100;   // beam fades in/out over this
const HOSE_BEAM_ALPHA_NEAR = 0.38;  // beam opacity at the nozzle (fades to 0 at the end)

// ── 8-way aim directions — independent of the 4-way walk-facing above.
//    Index order matches a clockwise sweep starting at "right" so
//    Math.round(angle / 45°) maps directly onto it (see angleToAimDir). ──
const AIM_DIRS = [
  { dx: 1, dy: 0 }, { dx: 1, dy: 1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 1 },
  { dx: -1, dy: 0 }, { dx: -1, dy: -1 }, { dx: 0, dy: -1 }, { dx: 1, dy: -1 },
].map(d => {
  const len = Math.hypot(d.dx, d.dy);
  return { dx: d.dx / len, dy: d.dy / len };
});

function angleToAimDir(ix, iy) {
  const angle = Math.atan2(iy, ix);
  let idx = Math.round(angle / (Math.PI / 4));
  return ((idx % 8) + 8) % 8;
}

  const fx = player.x + PW / 2, fy = player.y + FEET_OY + FEET_H / 2;
  const nx = Math.max(c.x, Math.min(fx, c.x + c.w));
  const ny = Math.max(c.y, Math.min(fy, c.y + c.h));
  return Math.hypot(fx - nx, fy - ny);
}
function vendInRange() { return !!vendingObj && !gameOver && vendDistance() <= VEND_RANGE; }
function vendCanBuy()  { return score >= vendPrice && player.hp < PLAYER_MAX_HP; }

function tryVend() {
  if (gameOver || vendBuy || !vendInRange()) return false;
  const now = performance.now();
  if (!vendCanBuy()) {
    vendLabelErrUntil = now + VEND_ERR_FLASH_MS;
    TanaAudio.play('ui_click', { rate: 0.6 }); // low "error tick"
    return false;
  }
  vendBuy = { start: now, price: vendPrice };
  TanaAudio.play('ui_click');
  return true;
}

// Damage mid-purchase cancels it — nothing is charged until completion.
function cancelVend() {
  if (!vendBuy) return;
  vendBuy = null;
  TanaAudio.play('ui_close');
}

function updateVending(now) {
  if (!vendBuy || now - vendBuy.start < VEND_BUY_TIME) return;
  const price = vendBuy.price;
  vendBuy = null;
  if (score < price || player.hp >= PLAYER_MAX_HP) return; // changed under us — no charge
  score -= price;
  totalSpent += price;
  potionsBoughtThisRun++;
  const healed = Math.min(VEND_HEAL_AMOUNT, PLAYER_MAX_HP - player.hp);
  player.hp += healed;
  recalcVendPrice();
  floatTexts.push({ kind: 'hud',    text: '-' + price,        color: '#ff5a6e', born: now });
  floatTexts.push({ kind: 'player', text: '+' + healed + ' HP', color: '#4ecca3', born: now });
  TanaAudio.play('score_coins');
}

function playerFeetRect(px, py) {
  return {
    x: (px ?? player.x) + FEET_MARGIN,
    y: (py ?? player.y) + FEET_OY,
    w: PW - FEET_MARGIN * 2,
    h: FEET_H,
  };
}
function playerBaseY() { return player.y + FEET_OY + FEET_H; }

// ─────────────────────────────────────────────────────────
//  COLLISION — same rectsOverlap/wouldCollide pattern as room 1
// ─────────────────────────────────────────────────────────
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x
      && a.y < b.y + b.h && a.y + a.h > b.y;
}

// `self` identifies which entity is doing the moving (the `player` object,
// or a zombie object) so that entity is excluded from the entity-solidity
// checks below — otherwise nothing could ever move, since it would always
// be "colliding" with its own feet rect. Omit `self` (e.g. from
// pickSpawnPoint, which isn't moving anything) to check against everyone.
function wouldCollide(px, py, self) {
  const feet = playerFeetRect(px, py);

  for (const obj of sceneObjects) {
    if (!obj.collision) continue;
    if (rectsOverlap(feet, obj.collision)) return true;
  }

  if (feet.x < WORLD_MARGIN) return true;
  if (feet.x + feet.w > WORLD_W - WORLD_MARGIN) return true;
  if (feet.y < WORLD_MARGIN) return true;
  if (feet.y + feet.h > WORLD_H - WORLD_MARGIN) return true;

  // The player and every zombie are solid too — the player can't walk
  // through a zombie, and zombies can't stack on the player or each other.
  if (self !== player && rectsOverlap(feet, playerFeetRect())) return true;
  for (const z of zombies) {
    if (z === self) continue;
    if (rectsOverlap(feet, playerFeetRect(z.x, z.y))) return true;
  }

  return false;
}

// ─────────────────────────────────────────────────────────
//  ZOMBIES
//  Zombies share the player's exact frame/feet geometry (PW/PH/FEET_*),
//  so wouldCollide(px,py) — built around playerFeetRect(px,py) — works
//  unchanged for them too; every call below passes explicit coordinates.
// ─────────────────────────────────────────────────────────
const zombies = [];

// Random point along a world edge, retried until it clears every
// sceneObjects collision rect (i.e. isn't inside a building). Falls back
// to a known-open spot if repeatedly unlucky.
function pickSpawnPoint() {
  for (let attempt = 0; attempt < 20; attempt++) {
    const edge = Math.floor(Math.random() * 4); // 0 top, 1 bottom, 2 left, 3 right
    let x, y;
    if (edge === 0)      { x = WORLD_MARGIN + Math.random() * (WORLD_W - 2 * WORLD_MARGIN); y = WORLD_MARGIN; }
    else if (edge === 1) { x = WORLD_MARGIN + Math.random() * (WORLD_W - 2 * WORLD_MARGIN); y = WORLD_H - WORLD_MARGIN - PH; }
    else if (edge === 2) { x = WORLD_MARGIN; y = WORLD_MARGIN + Math.random() * (WORLD_H - 2 * WORLD_MARGIN); }
    else                 { x = WORLD_W - WORLD_MARGIN - PW; y = WORLD_MARGIN + Math.random() * (WORLD_H - 2 * WORLD_MARGIN); }

    if (!wouldCollide(x, y)) return { x, y };
  }
  return { x: WORLD_W / 2 - PW / 2, y: WORLD_MARGIN }; // known-open middle of the top edge
}

// Weighted tier pick — A always eligible, B/C phase in from their unlock
// wave and grow louder each wave after that, capped so A never vanishes.
function pickTier(wave) {
  const wA = 1;
  const wB = wave >= WAVE_TIER_B_START ? Math.min(TIER_WEIGHT_MAX, TIER_WEIGHT_GROWTH * (wave - WAVE_TIER_B_START + 1)) : 0;
  const wC = wave >= WAVE_TIER_C_START ? Math.min(TIER_WEIGHT_MAX, TIER_WEIGHT_GROWTH * (wave - WAVE_TIER_C_START + 1)) : 0;
  const r = Math.random() * (wA + wB + wC);
  if (r < wA) return 'A';
  if (r < wA + wB) return 'B';
  return 'C';
}

function spawnZombie(tier, wave) {
  const base = ZOMBIE_TIERS[tier];
  const hpMult    = Math.min(ZOMBIE_HP_MULT_MAX,    1 + ZOMBIE_HP_MULT_GROWTH    * (wave - 1));
  const speedMult = Math.min(ZOMBIE_SPEED_MULT_MAX, 1 + ZOMBIE_SPEED_MULT_GROWTH * (wave - 1));
  const spawn = pickSpawnPoint();
  const hp = base.hp * hpMult;
  return {
    tier,
    x: spawn.x, y: spawn.y,
    hp, maxHp: hp,
    speed: base.speed * speedMult,
    damage: base.damage,
    facing: 'down',
    animFrame: 0, animTick: 0,
    _stuckX: spawn.x, _stuckY: spawn.y, _stuckSince: performance.now(),
    // Knockback stagger state — set by applyZombieKnockback(), consumed
    // and decayed at the top of updateZombie().
    staggeredUntil: 0, knockbackDirX: 0, knockbackDirY: 0, knockbackSpeed: 0,
    // Visual-only hit reaction state (see HIT_FX / spawnHitFx).
    lastHitAt: 0, flashUntil: 0, shakeStart: 0,
  };
}

function zombieBaseY(z) { return z.y + FEET_OY + FEET_H; }

function updateZombie(z, dt) {
  const now = performance.now();

  // Knocked back (shotgun hit) — the push drives movement instead of the
  // normal chase-toward-player logic entirely, decaying linearly to zero
  // across the stagger window so it reads as an actual hit instead of an
  // instant jump the chase AI immediately closes back up. Chase resumes
  // once the window ends, continuing from wherever the knockback actually
  // left the zombie.
  if (z.staggeredUntil && now < z.staggeredUntil) {
    const remainingFrac = (z.staggeredUntil - now) / KNOCKBACK_STAGGER_DURATION;
    const speed = z.knockbackSpeed * remainingFrac;
    const kvx = z.knockbackDirX * speed * dt;
    const kvy = z.knockbackDirY * speed * dt;
    // Same axis-separated, wouldCollide-respecting movement as normal
    // chasing — a knocked-back zombie still stops at a building's edge,
    // another zombie's edge, or the player's edge.
    if (!wouldCollide(z.x + kvx, z.y, z)) z.x += kvx;
    if (!wouldCollide(z.x, z.y + kvy, z)) z.y += kvy;

    z.animTick += dt;
    if (z.animTick >= 14) { z.animTick = 0; z.animFrame ^= 1; }
    return;
  }

  const dx = player.x - z.x, dy = player.y - z.y;
  const dist = Math.hypot(dx, dy) || 1;
  const vx = (dx / dist) * z.speed * dt;
  const vy = (dy / dist) * z.speed * dt;

  if (Math.abs(dx) > Math.abs(dy)) z.facing = dx > 0 ? 'right' : 'left';
  else                             z.facing = dy > 0 ? 'down'  : 'up';

  // Axis-separated movement — same slide-along-the-wall behavior as the
  // player, with no real pathfinding. `z` is excluded from the entity
  // checks so it never collides with itself; buildings, the player, and
  // every OTHER zombie are all solid to it.
  if (!wouldCollide(z.x + vx, z.y, z)) z.x += vx;
  if (!wouldCollide(z.x, z.y + vy, z)) z.y += vy;

  // Anti-stuck: wedged against geometry (a concave building corner) OR
  // now against a dense cluster of other zombies pressing toward the same
  // player — shove it perpendicular to its approach direction to break
  // free. Try both perpendicular directions (a packed cluster can easily
  // have the randomly-chosen one blocked too) before giving up for this
  // check window.
  const movedSinceCheck = Math.hypot(z.x - z._stuckX, z.y - z._stuckY);
  if (movedSinceCheck > STUCK_MIN_DISTANCE) {
    z._stuckX = z.x; z._stuckY = z.y; z._stuckSince = now;
  } else if (now - z._stuckSince > STUCK_CHECK_INTERVAL) {
    const firstSign = Math.random() < 0.5 ? 1 : -1;
    for (const sign of [firstSign, -firstSign]) {
      const nx = (-dy / dist) * STUCK_NUDGE * sign;
      const ny = (dx / dist) * STUCK_NUDGE * sign;
      const canX = !wouldCollide(z.x + nx, z.y, z);
      const canY = !wouldCollide(z.x, z.y + ny, z);
      if (!canX && !canY) continue; // this direction is fully blocked too — try the other
      if (canX) z.x += nx;
      if (canY) z.y += ny;
      break;
    }
    z._stuckX = z.x; z._stuckY = z.y; z._stuckSince = now;
  }

  z.animTick += dt;
  if (z.animTick >= 14) { z.animTick = 0; z.animFrame ^= 1; }
}

// `water` (hose ticks): non-lethal hits skip the blood/decal/flash/shake/sound
// and only update the number + hp bar — the hose has its own splash FX.
function damageZombie(z, dmg, shotAngle, water) {
  z.hp -= dmg;
  if (z.hp > 0) {
    // Slight delay so the hit lands after the gunshot instead of under it.
    if (!water) TanaAudio.play('zombie_hit', { delay: 0.06 });
    // Non-lethal hit — blood spray, decal, flash, shake, number (visual only).
    spawnHitFx(z, dmg, shotAngle, false, water);
    return;
  }
  const idx = zombies.indexOf(z);
  if (idx === -1) return; // already removed (e.g. a shotgun blast hit it twice)
  zombies.splice(idx, 1);
  TanaAudio.play('zombie_death');
  TanaAudio.play('score_tick');
  addScore(SCORE_PER_KILL[z.tier] || 0);
  addEffect({
    type: 'death',
    x: z.x + PW / 2, y: z.y + FEET_OY + FEET_H / 2,
    duration: DEATH_FX_DURATION,
  });
  spawnHitFx(z, dmg, shotAngle, true, water);
  onKillFeedback();
}

// ─────────────────────────────────────────────────────────
//  HIT FX state + spawners (visual only — see HIT_FX)
//  Particles/decals/numbers are world-space and animate off timestamps
//  (closed-form motion), so they keep playing through hitstop.
// ─────────────────────────────────────────────────────────
const bloodParticles = []; // { x0, y0, vx, vy, size, born, life, color }
const bloodDecals    = []; // { x, y, born, blobs: [{ox, oy, s}] , kill }
const damageNumbers  = []; // { z, value, born, lastHit, popAt, kill, popAmt }
let hitstopUntil = 0, lastHitstopAt = -1e9;
let screenShake  = { amp: 0, start: 0, ms: 0 };
let lastShot     = { angle: 0, at: -1e9 }; // for the player recoil nudge

function _rr(range) { return range[0] + Math.random() * (range[1] - range[0]); }
function _ri(range) { return Math.floor(_rr([range[0], range[1] + 1])); }

function zombieBodyCenter(z) { return { x: z.x + PW / 2, y: z.y + PH * 0.45 }; }

function spawnHitFx(z, dmg, shotAngle, killed, water) {
  const now = performance.now();
  const dry = !!water && !killed; // hose tick that didn't kill: numbers + hp bar only
  const ang = shotAngle != null ? shotAngle : Math.random() * Math.PI * 2;
  const c = zombieBodyCenter(z);

  // Blood spray
  const n = dry ? 0 : _ri(killed ? HIT_FX.particleCountKill : HIT_FX.particleCount);
  const spread = HIT_FX.particleSpreadDeg * Math.PI / 180;
  for (let i = 0; i < n; i++) {
    const a = ang + (Math.random() * 2 - 1) * spread;
    const sp = _rr(HIT_FX.particleSpeed);
    bloodParticles.push({
      x0: c.x + (Math.random() * 2 - 1) * HIT_FX.particleJitter,
      y0: c.y + (Math.random() * 2 - 1) * HIT_FX.particleJitter,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      size: _ri(HIT_FX.particleSize),
      born: now, life: _rr(HIT_FX.particleLife),
      color: HIT_FX.particleColors[Math.floor(Math.random() * HIT_FX.particleColors.length)],
    });
  }
  while (bloodParticles.length > HIT_FX.particleMax) bloodParticles.shift();

  // Ground decal under the zombie's feet
  if (!dry) {
  const cfg = killed ? HIT_FX.decalKill : HIT_FX.decalHit;
  const scatter = killed ? HIT_FX.decalKillSpread : HIT_FX.decalHitSpread;
  const blobs = [];
  for (let i = 0, nb = _ri(cfg.blobs); i < nb; i++) {
    blobs.push({
      ox: Math.round((Math.random() * 2 - 1) * scatter),
      oy: Math.round((Math.random() * 2 - 1) * scatter * 0.5),
      s: _ri(cfg.size),
    });
  }
  bloodDecals.push({
    x: z.x + PW / 2 + (Math.random() * 2 - 1) * HIT_FX.decalOffset,
    y: z.y + FEET_OY + FEET_H / 2 + (Math.random() * 2 - 1) * HIT_FX.decalOffset * 0.5,
    born: now, blobs, kill: killed,
  });
  while (bloodDecals.length > HIT_FX.decalMax) bloodDecals.shift();
  }

  // Flash + sprite shake (also drives the hp bar)
  z.lastHitAt  = now;
  if (!dry) {
    z.flashUntil = now + HIT_FX.flashMs;
    z.shakeStart = now;
  }

  // Damage number — merge rapid hits on the same zombie
  let num = null;
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    const d = damageNumbers[i];
    if (d.z === z && now - d.lastHit <= HIT_FX.numMergeMs) { num = d; break; }
  }
  if (num) {
    num.value += dmg;
    num.lastHit = now;
    num.popAt = now; num.popAmt = HIT_FX.numPop;
    if (killed) num.kill = true;
  } else {
    damageNumbers.push({ z, value: dmg, born: now, lastHit: now, popAt: now, popAmt: HIT_FX.numPop * 0.5, kill: killed });
  }
}

// ─────────────────────────────────────────────────────────
//  SECRET HYDRANT + WATER HOSE — state, logic, drawing
// ─────────────────────────────────────────────────────────
let secretHydrant   = null;   // the hydrant_2 scene object (set once the scene is built)
let secretHp        = SECRET_HP;
let secretBroken    = false;
let secretLastHit   = 0, secretFlashUntil = 0, secretShakeStart = 0;
let secretJetClock  = 0;
let hosePickup      = null;   // { x, y } while waiting to be grabbed
let hoseObtained    = false;  // once per run
const hose = { tank: HOSE_TANK_MAX, sputter: false, lastSprayAt: -1e9, lastTick: 0, lastSputterFx: 0, voice: null };
let hoseBeam = { alpha: 0, angle: 0, x: 0, y: 0, facing: 'down' };

function spawnWaterParticle(x, y, ang, speed, life, g) {
  bloodParticles.push({
    x0: x, y0: y,
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
    size: _ri(HIT_FX.particleSize),
    born: performance.now(), life,
    color: HOSE_WATER_COLORS[Math.floor(Math.random() * HOSE_WATER_COLORS.length)],
    g,
  });
  while (bloodParticles.length > HIT_FX.particleMax) bloodParticles.shift();
}

function secretTop() { return { x: secretHydrant.x + secretHydrant.w / 2, y: secretHydrant.y + 38 }; }

function damageSecretHydrant(dmg) {
  if (!secretHydrant || secretBroken) return;
  const now = performance.now();
  secretHp = Math.max(0, secretHp - dmg);
  secretLastHit = now; secretFlashUntil = now + SECRET_FLASH_MS; secretShakeStart = now;
  TanaAudio.play('zombie_hit', { rate: 0.6 }); // dull "clank"
  if (secretHp <= 0) breakSecretHydrant();
}

function breakSecretHydrant() {
  secretBroken = true;
  const t = secretTop();
  for (let i = 0; i < SECRET_BURST_COUNT; i++) {
    spawnWaterParticle(t.x, t.y, -Math.PI / 2 + (Math.random() * 2 - 1) * 1.1,
      _rr([0.15, 0.50]), _rr([500, 950]), 0.0006);
  }
  TanaAudio.play('zombie_death', { rate: 0.5 });
  addScreenShake(3, 150);
  if (!hoseObtained && !hosePickup) {
    hosePickup = { x: secretHydrant.groundX + SECRET_PICKUP_OFFSET.x, y: secretHydrant.groundY + SECRET_PICKUP_OFFSET.y };
  }
}

// The broken hydrant keeps spouting a small looping jet (procedural).
function updateSecretFx(now) {
  if (!secretHydrant || !secretBroken) return;
  const t = secretTop();
  if (wx(t.x) < -60 || wx(t.x) > VIEW_W + 60 || wy(t.y) < -200 || wy(t.y) > VIEW_H + 60) { secretJetClock = now; return; }
  if (now - secretJetClock > 200) secretJetClock = now;
  while (now - secretJetClock >= SECRET_JET.everyMs) {
    secretJetClock += SECRET_JET.everyMs;
    spawnWaterParticle(t.x, t.y, -Math.PI / 2 + (Math.random() * 2 - 1) * SECRET_JET.spread,
      _rr(SECRET_JET.speed), _rr(SECRET_JET.life), SECRET_JET.gravity);
  }
}

function checkHosePickup() {
  if (!hosePickup || gameOver) return;
  const fx = player.x + PW / 2, fy = player.y + FEET_OY + FEET_H / 2;
  if (Math.hypot(fx - hosePickup.x, fy - hosePickup.y) > SECRET_PICKUP_RADIUS) return;
  hosePickup = null;
  hoseObtained = true;
  unlockedWeapons.add('hose');
  currentWeapon = 'hose';
  lastFireTime = 0;
  hose.tank = HOSE_TANK_MAX; hose.sputter = false;
  weaponUnlockNotice = { label: WEAPONS.hose.label, start: performance.now() };
  TanaAudio.play('weapon_unlock');
}

// Continuous weapon driver — runs every update(). Tank refill/drain, the
// per-frame push, the per-tick damage, particles, beam fade, and the loop.
function updateHose(dt, now) {
  const dtSec = dt * 16.667 / 1000;
  const equipped = currentWeapon === 'hose' && unlockedWeapons.has('hose');
  const want = equipped && fireHeld && !vendBuy && !gameOver;
  if (hose.sputter && hose.tank > HOSE_SPUTTER_RECOVER) hose.sputter = false;
  const spraying = want && !hose.sputter && hose.tank > 0;

  const dir = AIM_DIRS[player.aimDir];
  const angle = Math.atan2(dir.dy, dir.dx);
  const half = (HOSE_CONE_DEG * Math.PI / 180) / 2;
  const vis = TRACER_VISUAL_ORIGIN[player.facing];
  const mx = player.x + PW * vis.x, my = player.y + PH * vis.y;

  if (spraying) {
    hose.tank -= HOSE_DRAIN_PER_SEC * dtSec;
    hose.lastSprayAt = now;
    if (hose.tank <= 0) { hose.tank = 0; hose.sputter = true; }

    // Nozzle: continuous water out of the tip, across the cone.
    let n = HOSE_NOZZLE_PER_FRAME * dt;
    n = Math.floor(n) + (Math.random() < n - Math.floor(n) ? 1 : 0);
    for (let i = 0; i < n; i++) {
      spawnWaterParticle(mx, my, angle + (Math.random() * 2 - 1) * half * 0.85,
        _rr(HOSE_NOZZLE_SPEED), _rr(HOSE_NOZZLE_LIFE), 0.0002);
    }
    applyHose(angle, half, dt, now);
  } else {
    // Out of water: a few weak drips, no effect.
    if (want && hose.sputter && now - hose.lastSputterFx > 90) {
      hose.lastSputterFx = now;
      spawnWaterParticle(mx, my, angle + (Math.random() * 2 - 1) * half, _rr([0.12, 0.25]), _rr([250, 400]), 0.0008);
    }
    if (now - hose.lastSprayAt >= HOSE_REFILL_DELAY_MS) {
      hose.tank = Math.min(HOSE_TANK_MAX, hose.tank + HOSE_REFILL_PER_SEC * dtSec);
    }
  }

  // Looping sound (silent if hose.mp3 is missing — startLoop returns null).
  if (spraying && !hose.voice) hose.voice = TanaAudio.startLoop('hose');
  else if (!spraying && hose.voice) { hose.voice.stop(80); hose.voice = null; }

  // Beam fade in/out
  const step = dt * 16.667 / HOSE_BEAM_FADE_MS;
  hoseBeam.alpha = Math.max(0, Math.min(1, hoseBeam.alpha + (spraying ? step : -step)));
  if (spraying) { hoseBeam.angle = angle; hoseBeam.x = mx; hoseBeam.y = my; hoseBeam.facing = player.facing; }
}

// Every zombie in the cone: continuous push every frame (collision-aware, so
// they slide along buildings), damage + splash every HOSE_TICK_MS.
function applyHose(angle, half, dt, now) {
  const ox = player.x + PW / 2, oy = player.y + FEET_OY + FEET_H / 2;
  const tick = now - hose.lastTick >= HOSE_TICK_MS;
  if (tick) hose.lastTick = now;
  const ux = Math.cos(angle), uy = Math.sin(angle);

  for (const z of zombies.slice()) {
    const zx = z.x + PW / 2, zy = z.y + FEET_OY + FEET_H / 2;
    const ddx = zx - ox, ddy = zy - oy;
    const dist = Math.hypot(ddx, ddy);
    if (dist < 1 || dist > HOSE_RANGE) continue;
    let diff = Math.abs(Math.atan2(ddy, ddx) - angle);
    if (diff > Math.PI) diff = 2 * Math.PI - diff;
    if (diff > half) continue;

    // Push: lerp(1, MIN_FRAC, dist / RANGE) × near push × tier resistance.
    const push = HOSE_PUSH_NEAR * (1 + (HOSE_PUSH_MIN_FRAC - 1) * Math.min(1, dist / HOSE_RANGE))
               * (HOSE_RESIST[z.tier] != null ? HOSE_RESIST[z.tier] : 1) * dt;
    const px = ux * push, py = uy * push;
    if (!wouldCollide(z.x + px, z.y, z)) z.x += px;
    if (!wouldCollide(z.x, z.y + py, z)) z.y += py;

    if (!tick) continue;
    // Splash on the zombie being hit.
    const c = zombieBodyCenter(z);
    for (let i = 0; i < HOSE_SPLASH_PER_TICK; i++) {
      spawnWaterParticle(c.x, c.y, angle + (Math.random() * 2 - 1) * 1.0, _rr([0.08, 0.2]), _rr([250, 400]), 0.0005);
    }
    damageZombie(z, dist <= HOSE_RANGE / 2 ? HOSE_DAMAGE_NEAR : HOSE_DAMAGE_FAR, angle, true);
  }
}

// ── Drawing ──
function drawSecretHydrant(obj, sx, sy) {
  const now = performance.now();
  let shx = 0, shy = 0;
  const age = now - secretShakeStart;
  if (secretShakeStart && age < SECRET_SHAKE_MS) {
    const a = SECRET_SHAKE_PX * (1 - age / SECRET_SHAKE_MS);
    shx = Math.round((Math.random() * 2 - 1) * a);
    shy = Math.round((Math.random() * 2 - 1) * a);
  }
  const iw = obj.img.naturalWidth, ih = obj.img.naturalHeight;
  if (now < secretFlashUntil) drawFlashTinted(obj.img, 0, 0, iw, ih, sx + shx, sy + shy, obj.w, obj.h, 'rgba(255,255,255,0.85)');
  else ctx.drawImage(obj.img, sx + shx, sy + shy, obj.w, obj.h);

  // Tiny hp bar — fades in on a hit, out SECRET_BAR_HOLD_MS (+fade) after the last one.
  if (!secretBroken && secretLastHit) {
    const since = now - secretLastHit;
    const fadeOut = (since - SECRET_BAR_HOLD_MS) / SECRET_BAR_FADE_MS;
    if (fadeOut < 1) {
      const alpha = Math.min(1, since / 100) * (fadeOut <= 0 ? 1 : 1 - fadeOut);
      const bx = Math.round(sx + obj.w / 2 - SECRET_BAR_W / 2), by = Math.round(sy - 6);
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.fillStyle = HIT_FX.hpBarBg;
      ctx.fillRect(bx - 1, by - 1, SECRET_BAR_W + 2, SECRET_BAR_H + 2);
      ctx.fillStyle = '#4aa3ff';
      ctx.fillRect(bx, by, Math.round(SECRET_BAR_W * secretHp / SECRET_HP), SECRET_BAR_H);
      ctx.restore();
    }
  }
}

function drawHosePickup() {
  if (!hosePickup) return;
  const now = performance.now();
  const sx = wx(hosePickup.x), sy = wy(hosePickup.y);
  const bob = Math.sin(now / 280) * 3;
  ctx.save();
  // ground shadow + glow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(sx, sy + 16, 16, 4, 0, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createRadialGradient(sx, sy + bob, 2, sx, sy + bob, 36);
  g.addColorStop(0, 'rgba(120,200,255,0.40)'); g.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(sx, sy + bob, 36, 0, Math.PI * 2); ctx.fill();
  // coiled hose reel + nozzle
  ctx.lineWidth = 5; ctx.strokeStyle = '#4aa3ff';
  ctx.beginPath(); ctx.arc(sx, sy + bob, 12, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = '#bfe8ff';
  ctx.beginPath(); ctx.arc(sx, sy + bob, 6, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#9aa6b8'; ctx.fillRect(sx + 10, sy + bob - 4, 14, 7);
  ctx.fillStyle = '#e94560'; ctx.fillRect(sx + 22, sy + bob - 5, 4, 9);
  ctx.font = '7px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#bfe8ff'; ctx.fillText('HOSE', sx, sy + bob - 26);
  ctx.restore();
}

// Bluish cone with a gradient (bright at the nozzle) and flowing bands +
// dashed streaks moving outward, so it reads as moving water.
function drawHoseBeam() {
  if (hoseBeam.alpha <= 0.01) return;
  const now = performance.now();
  const sx = wx(hoseBeam.x), sy = wy(hoseBeam.y);
  const half = (HOSE_CONE_DEG * Math.PI / 180) / 2, R = HOSE_RANGE, a = hoseBeam.angle;
  ctx.save();
  ctx.globalAlpha = hoseBeam.alpha;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.arc(sx, sy, R, a - half, a + half);
  ctx.closePath();
  const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
  grad.addColorStop(0,   `rgba(170,225,255,${HOSE_BEAM_ALPHA_NEAR})`);
  grad.addColorStop(0.5, `rgba(120,195,255,${(HOSE_BEAM_ALPHA_NEAR * 0.42).toFixed(3)})`);
  grad.addColorStop(1,   'rgba(90,170,255,0)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.clip();

  // flowing bands (arcs sliding outward)
  ctx.lineCap = 'butt';
  const flow = (now * HOSE_FLOW_SPEED) % HOSE_BAND_SPACING;
  for (let r = flow; r < R; r += HOSE_BAND_SPACING) {
    const k = 1 - r / R;
    ctx.strokeStyle = `rgba(210,240,255,${(0.20 * k).toFixed(3)})`;
    ctx.lineWidth = 2 + 4 * k;
    ctx.beginPath(); ctx.arc(sx, sy, r, a - half, a + half); ctx.stroke();
  }
  // dashed streaks racing along the beam
  ctx.setLineDash([16, 30]);
  ctx.lineDashOffset = -(now * 0.5);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(235,248,255,0.22)';
  for (let i = -2; i <= 2; i++) {
    const ra = a + i * (half / 2.4) + Math.sin(now / 160 + i) * 0.02;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(ra) * R, sy + Math.sin(ra) * R); ctx.stroke();
  }
  ctx.restore();
}

// Hitstop / screen shake / vibrate on a killing blow.
function onKillFeedback() {
  const now = performance.now();
  if (now - lastHitstopAt >= HIT_FX.hitstopMinGapMs) {
    lastHitstopAt = now;
    hitstopUntil  = now + HIT_FX.hitstopMs;
  }
  addScreenShake(HIT_FX.killShake.amp, HIT_FX.killShake.ms);
  try { if (navigator.vibrate) navigator.vibrate(HIT_FX.vibrateMs); } catch (_) {}
}

function addScreenShake(amp, ms) {
  const now = performance.now();
  const cur = screenShake.amp * Math.max(0, 1 - (now - screenShake.start) / (screenShake.ms || 1));
  if (amp >= cur) screenShake = { amp, start: now, ms };
}

function currentShakeOffset() {
  const k = 1 - (performance.now() - screenShake.start) / (screenShake.ms || 1);
  if (k <= 0 || !screenShake.amp) return { x: 0, y: 0 };
  const a = screenShake.amp * k;
  return { x: Math.round((Math.random() * 2 - 1) * a), y: Math.round((Math.random() * 2 - 1) * a) };
}

// Pushes a zombie away from (sourceX, sourceY) — e.g. the shotgun's blast
// origin — by arming a decaying knockback velocity that updateZombie()
// drives movement from for KNOCKBACK_STAGGER_DURATION, instead of an
// instant position jump. An instant jump reads as nothing: the very next
// tick, updateZombie() just recomputes the direction to the player fresh
// and resumes chasing at full speed, closing the gap right back up. A
// brief window where the push itself overrides the chase is what actually
// makes the hit visible.
//
// stack=true (uzi/draco): if the zombie is already mid-push, the new impulse
// is ADDED to its remaining push velocity instead of replacing it, capped at
// KNOCKBACK_STACK_CAP, so sustained fire keeps driving it back.
function applyZombieKnockback(z, sourceX, sourceY, amount, stack) {
  if (!amount) return;
  // sourceX/sourceY (fireWeapon's originX/originY) are feet-centered, so
  // measure the zombie the same way — matches how fireWeapon() itself
  // measured it for the cone/distance check — rather than its raw
  // top-left x/y, which would skew the push angle.
  const zcx = z.x + PW / 2, zcy = z.y + FEET_OY + FEET_H / 2;
  const dx = zcx - sourceX, dy = zcy - sourceY;
  const dist = Math.hypot(dx, dy) || 1;

  // Peak per-frame speed chosen so a linear decay to zero across the
  // stagger window covers roughly `amount` px total (the area under that
  // decay ramp is 0.5 * peakSpeed * frameCount) — same tunable per-tier
  // amount as before, just spent over time instead of in one jump.
  const frameCount = KNOCKBACK_STAGGER_DURATION / 16.667;
  const now = performance.now();
  let vx = (dx / dist) * ((2 * amount) / frameCount);
  let vy = (dy / dist) * ((2 * amount) / frameCount);

  if (stack && z.staggeredUntil && now < z.staggeredUntil) {
    // Add whatever push is still left from earlier hits.
    const remaining = z.knockbackSpeed * ((z.staggeredUntil - now) / KNOCKBACK_STAGGER_DURATION);
    vx += z.knockbackDirX * remaining;
    vy += z.knockbackDirY * remaining;
    const maxSpeed = (2 * KNOCKBACK_STACK_CAP) / frameCount;
    const mag = Math.hypot(vx, vy);
    if (mag > maxSpeed) { vx *= maxSpeed / mag; vy *= maxSpeed / mag; }
  }

  const speed = Math.hypot(vx, vy) || 1;
  z.knockbackDirX  = vx / speed;
  z.knockbackDirY  = vy / speed;
  z.knockbackSpeed = speed;
  z.staggeredUntil = now + KNOCKBACK_STAGGER_DURATION;
}

// ─────────────────────────────────────────────────────────
//  PLAYER HP — zombie contact damage + knockback + i-frames
// ─────────────────────────────────────────────────────────

// Checked once per frame after zombies move — touching any zombie while
// not currently invulnerable costs HP, knocks the player back a little,
// and starts a brief invulnerability window so a whole swarm can't melt
// the player in one frame.
//
// Now that zombies (and the player) are solid in wouldCollide(), movement
// stops the player and a zombie just short of true overlap — each frame,
// the step that *would* overlap gets rejected, leaving a small step-sized
// gap rather than flush contact. Inflating the touch-check by that much
// finds contact at the point they're touching-but-solid, same as before
// they could still freely overlap.
const CONTACT_TOUCH_BUFFER = 12; // px

function checkZombieContact(now) {
  if (gameOver || now < player.invulnUntil) return;
  const pFeetTouch = inflateRect(playerFeetRect(), CONTACT_TOUCH_BUFFER);
  for (const z of zombies) {
    const zFeet = playerFeetRect(z.x, z.y); // zombies share the player's feet geometry
    if (!rectsOverlap(pFeetTouch, zFeet)) continue;
    applyPlayerDamage(z.damage, z);
    return; // one hit per frame even if several zombies are touching
  }
}

function inflateRect(r, amt) {
  return { x: r.x - amt, y: r.y - amt, w: r.w + amt * 2, h: r.h + amt * 2 };
}

function applyPlayerDamage(dmg, source) {
  cancelVend();
  TanaAudio.play('player_hurt');
  player.hp = Math.max(0, player.hp - dmg);
  player.invulnUntil = performance.now() + PLAYER_INVULN_DURATION;

  const dx = player.x - source.x, dy = player.y - source.y;
  const dist = Math.hypot(dx, dy) || 1;
  const kx = (dx / dist) * PLAYER_KNOCKBACK;
  const ky = (dy / dist) * PLAYER_KNOCKBACK;
  if (!wouldCollide(player.x + kx, player.y, player)) player.x += kx;
  if (!wouldCollide(player.x, player.y + ky, player)) player.y += ky;

  if (player.hp <= 0) triggerGameOver();
}

// ─────────────────────────────────────────────────────────
//  COMBAT — transient FX (procedural, no art assets)
// ─────────────────────────────────────────────────────────
const effects = [];

function addEffect(e) {
  e.start = performance.now();
  effects.push(e);
}

function pruneEffects() {
  const now = performance.now();
  for (let i = effects.length - 1; i >= 0; i--) {
    if (now - effects[i].start > effects[i].duration) effects.splice(i, 1);
  }
}

// ─────────────────────────────────────────────────────────
//  COMBAT — aiming + firing
// ─────────────────────────────────────────────────────────

// Player's raw movement input, read fresh each frame in update() — aim
// direction is derived from this, independent of collision-adjusted
// actual movement, so aiming still works even when pressed into a wall.
function updateAim(ix, iy) {
  if (ix !== 0 || iy !== 0) player.aimDir = angleToAimDir(ix, iy);
}

function tryFire(now) {
  const w = WEAPONS[currentWeapon];
  if (now - lastFireTime < w.fireRate) return;
  lastFireTime = now;
  fireWeapon(w);
}

function fireWeapon(w) {
  TanaAudio.play(currentWeapon); // 'pistol' | 'uzi' | 'shotgun' | 'draco' — one per trigger pull
  const dir = AIM_DIRS[player.aimDir];
  const angle = Math.atan2(dir.dy, dir.dx);
  const halfCone = (w.coneDeg * Math.PI / 180) / 2;
  const originX = player.x + PW / 2;
  const originY = player.y + FEET_OY + FEET_H / 2;

  const hits = [];
  for (const z of zombies) {
    const zx = z.x + PW / 2, zy = z.y + FEET_OY + FEET_H / 2;
    const ddx = zx - originX, ddy = zy - originY;
    const dist = Math.hypot(ddx, ddy);
    if (dist < 1 || dist > w.range) continue;
    let diff = Math.abs(Math.atan2(ddy, ddx) - angle);
    if (diff > Math.PI) diff = 2 * Math.PI - diff;
    if (diff <= halfCone) hits.push({ z, dist });
  }
  // The secret hydrant is a (very tough) target: it competes with zombies
  // for "nearest" like any other, and the shotgun's falloff applies to it.
  if (secretHydrant && !secretBroken) {
    const c = secretHydrant.collision;
    const hdx = c.x + c.w / 2 - originX, hdy = c.y + c.h / 2 - originY;
    const hd = Math.hypot(hdx, hdy);
    if (hd >= 1 && hd <= w.range) {
      let diff = Math.abs(Math.atan2(hdy, hdx) - angle);
      if (diff > Math.PI) diff = 2 * Math.PI - diff;
      if (diff <= halfCone + Math.atan2(SECRET_HIT_RADIUS, hd)) hits.push({ hydrant: true, dist: hd });
    }
  }
  hits.sort((a, b) => a.dist - b.dist);

  if (hits.length) {
    if (w.multiHit) {
      for (const h of hits) {
        if (h.hydrant) {
          const hm = w.distFalloffMin != null ? 1 + (w.distFalloffMin - 1) * Math.min(1, h.dist / w.range) : 1;
          damageSecretHydrant(w.damage * hm);
          continue;
        }
        // Distance falloff (shotgun): closer zombies take more damage and
        // knockback — lerp(1.0, distFalloffMin, dist / range).
        const mult = w.distFalloffMin != null
          ? 1 + (w.distFalloffMin - 1) * Math.min(1, h.dist / w.range)
          : 1;
        damageZombie(h.z, w.damage * mult,
          Math.atan2(h.z.y + PH * 0.45 - originY, h.z.x + PW / 2 - originX));
        // Per-tier pushback — skip a zombie the hit just killed, since
        // damageZombie() already removed it.
        if (w.knockback && h.z.hp > 0) {
          applyZombieKnockback(h.z, originX, originY, (w.knockback[h.z.tier] || 0) * mult, w.knockbackStack);
        }
      }
    } else if (hits[0].hydrant) {
      damageSecretHydrant(w.damage);
    } else {
      const target = hits[0].z;
      damageZombie(target, w.damage,
        Math.atan2(target.y + PH * 0.45 - originY, target.x + PW / 2 - originX));
      if (w.knockback && target.hp > 0) {
        applyZombieKnockback(target, originX, originY, w.knockback[target.tier] || 0, w.knockbackStack);
      }
    }
  }

  // Tracer reaches the nearest hit target, or the weapon's full range on a
  // miss — visible either way so a miss still reads as feedback. Its draw
  // origin is chest-height (visual only), separate from originX/originY
  // above which stay feet-anchored for hit detection.
  const tracerDist = hits.length ? hits[0].dist : w.range;
  const visOff = TRACER_VISUAL_ORIGIN[player.facing];

  // Weight (visual only): muzzle flash sprite at the tracer origin, recoil
  // nudge of the player sprite, and a screen kick on the heavy guns.
  addEffect({
    type: 'muzzle',
    x: player.x + PW * visOff.x, y: player.y + PH * visOff.y, angle,
    big: !!w.multiHit,
    facing: player.facing,
    duration: HIT_FX.muzzleMs,
  });
  lastShot = { angle, at: performance.now() };
  const shotShake = HIT_FX.shotShake[currentWeapon];
  if (shotShake) addScreenShake(shotShake.amp, shotShake.ms);
  addEffect({
    type: 'tracer',
    x: player.x + PW * visOff.x, y: player.y + PH * visOff.y, angle, dist: tracerDist,
    range: w.range,
    coneDeg: w.coneDeg, // the shotgun's light wedge spans the cone that was actually checked
    multiHit: w.multiHit, // only multi-hit weapons (the shotgun) draw the wedge instead of a line
    hit: hits.length > 0,
    // Single-target hit: the tracer ends inside this zombie's body and is
    // depth-sorted just behind it (see render()). Kept by reference so the
    // line follows the zombie for the ~100ms it's visible.
    target: (hits.length && !w.multiHit && hits[0].z) ? hits[0].z : null,
    // Facing at the moment of firing — not re-checked later, since the
    // player could turn while the tracer is still fading — used in
    // render() to draw this behind the player when they were facing away.
    facing: player.facing,
    duration: TRACER_FX_DURATION,
  });
}

function checkWeaponUnlocks(clearedWave) {
  for (const key of WEAPON_ORDER) {
    const unlockWave = WEAPON_UNLOCK_WAVE[key];
    if (unlockWave != null && clearedWave === unlockWave && !unlockedWeapons.has(key)) {
      unlockedWeapons.add(key);
      currentWeapon = key;
      weaponUnlockNotice = { label: WEAPONS[key].label, start: performance.now() };
      TanaAudio.play('weapon_unlock');
    }
  }
}

// Manual weapon switch (desktop Q key / mobile weapon-btn) — cycles to the
// next weapon in WEAPON_ORDER that's actually unlocked, wrapping back to
// the first. A no-op with only one weapon unlocked.
function switchToNextWeapon() {
  const unlocked = WEAPON_ORDER.filter(k => unlockedWeapons.has(k));
  if (unlocked.length <= 1) return false;
  const idx = unlocked.indexOf(currentWeapon);
  currentWeapon = unlocked[(idx + 1) % unlocked.length];
  // Don't let a fast weapon's cooldown carry over into an instant first
  // shot with a slower one.
  lastFireTime = 0;
  TanaAudio.play('weapon_switch');
  return true;
}

// ─────────────────────────────────────────────────────────
//  WAVE STATE MACHINE
//  WAVE_INTRO (banner) → WAVE_ACTIVE (spawns trickle in, zombies roam)
//  → WAVE_CLEAR (countdown once the wave's zombies are all gone) → next.
//  Zombie kills now normally drive the ACTIVE→CLEAR transition; the 'K'
//  debug key still force-clears a wave instantly for testing.
//
//  gameStarted stays false until the intro pixelation has finished AND a
//  further GAME_START_BUFFER_MS has passed — update() and drawHUD() skip
//  updateWave()/drawWaveBanner() entirely until then, so neither is ever
//  implicitly timed off the stale waveStateSince=0 default from before
//  startWave() has run for real. The player can still move around freely
//  in the meantime; only the wave/spawn/banner system is held back.
// ─────────────────────────────────────────────────────────
let gameStarted      = false;
let waveNumber       = 1;
let waveState        = 'INTRO';
let waveStateSince   = 0;
let waveTotalCount   = 0;
let waveSpawnedCount = 0;
let lastSpawnTime    = 0;

// ── Wave sound: wave_start.mp3's hit lands exactly when spawning begins ──
// spawnStartMs is the performance.now() timestamp at which the wave's
// INTRO banner ends and zombies start spawning. The file is started
// WAVE_START_HIT_SEC before that; if that moment has already passed (wave 1,
// restarts) it starts immediately, offset by how late we are.
let waveStartVoice = null;
function scheduleWaveStartSfx(spawnStartMs) {
  if (waveStartVoice) waveStartVoice.stop();
  const startInMs = (spawnStartMs - WAVE_START_HIT_SEC * 1000) - performance.now();
  waveStartVoice = startInMs >= 0
    ? TanaAudio.play('wave_start', { delay: startInMs / 1000 })
    : TanaAudio.play('wave_start', { offset: -startInMs / 1000 });
}

// "+50" wave-clear bonus popup — drawn by drawWaveBanner().
let scorePopup = null; // { text, start }
const SCORE_POPUP_DURATION = 1400;

function waveZombieCount(wave) {
  if (WAVE_COUNT_OVERRIDES[wave] != null) return WAVE_COUNT_OVERRIDES[wave];
  return Math.min(ZOMBIE_COUNT_MAX, Math.round(ZOMBIE_COUNT_BASE + ZOMBIE_COUNT_GROWTH * (wave - 1)));
}

function startWave(n) {
  waveNumber       = n;
  waveState        = 'INTRO';
  waveStateSince   = performance.now();
  waveTotalCount   = waveZombieCount(n);
  waveSpawnedCount = 0;
  lastSpawnTime    = 0;
}

function updateWave() {
  const now = performance.now();

  if (waveState === 'INTRO') {
    if (now - waveStateSince >= WAVE_INTRO_DURATION) {
      waveState = 'ACTIVE';
      waveStateSince = now;
    }
  } else if (waveState === 'ACTIVE') {
    if (waveSpawnedCount < waveTotalCount && now - lastSpawnTime >= SPAWN_INTERVAL) {
      zombies.push(spawnZombie(pickTier(waveNumber), waveNumber));
      waveSpawnedCount++;
      lastSpawnTime = now;
    }
    if (waveSpawnedCount >= waveTotalCount && zombies.length === 0) {
      waveState = 'CLEAR';
      waveStateSince = now;
      addScore(SCORE_WAVE_CLEAR_BONUS);
      // Vending price for the next wave is based on what this wave earned.
      scoreEarnedLastWave = waveScoreEarned;
      waveScoreEarned = 0;
      recalcVendPrice();
      scorePopup = { text: '+' + SCORE_WAVE_CLEAR_BONUS, start: now };
      TanaAudio.play('wave_clear');
      TanaAudio.play('score_coins');
      checkWeaponUnlocks(waveNumber);
      // Next wave spawns after the clear countdown + intro banner.
      scheduleWaveStartSfx(now + WAVE_CLEAR_DURATION + WAVE_INTRO_DURATION);
    }
  } else if (waveState === 'CLEAR') {
    if (now - waveStateSince >= WAVE_CLEAR_DURATION) {
      startWave(waveNumber + 1);
    }
  }
}

    makeTrafficLight('trafficlight_3', trafficLightImgs.upright,    1978, 153, 372, 437, 590,  { x: 2222, y: 517,  w: 49, h: 73 }),
    makeTrafficLight('trafficlight_4', trafficLightImgs.downright,  2140, 817, 170, 457, 1274, { x: 2180, y: 1200, w: 52, h: 74 }),
  );

  if (secretHydrant) { secretHydrant.secret = true; secretHydrant.groundX = 2453; secretHydrant.groundY = 1231; }

  console.log(`[ZOMBIE STREET] World: ${WORLD_W}×${WORLD_H} | Player: ${PW}×${PH}`);

  // Wait two frames so the loop has actually painted this world/background
  // before snapshotting it for the intro dissolve. The wave system doesn't
  // start the moment the dissolve finishes — startWave(1) (and gameStarted)
  // wait an additional GAME_START_BUFFER_MS so the banner/spawns can't pop
  // in while the scene (and its art) is still settling. The player can
  // still move around freely in the meantime.
  requestAnimationFrame(() => requestAnimationFrame(() => {

      scheduleWaveStartSfx(performance.now() + GAME_START_BUFFER_MS + WAVE_INTRO_DURATION);
      setTimeout(() => {
        gameStarted = true;
        startWave(1);
      }, GAME_START_BUFFER_MS);
    });
  }));
};

//  CAMERA — same clamped-pan formula as room 1
// ─────────────────────────────────────────────────────────
const cam = { x: 0, y: 0 };
let VIEW_H_DYN = VIEW_H;
let CROP_TOP   = 0;

function updateCamera() {
  cam.x = player.x + PW / 2 - VIEW_W / 2;
  cam.x = Math.max(0, Math.min(WORLD_W - VIEW_W, cam.x));

  cam.y = player.y + PH / 2 - VIEW_H / 2;
  const camYMin = -CROP_TOP;
  const camYMax = Math.max(camYMin, WORLD_H - VIEW_H + CROP_TOP);
  cam.y = Math.max(camYMin, Math.min(camYMax, cam.y));
}

function wx(worldX) { return Math.round(worldX - cam.x); }
function wy(worldY) { return Math.round(worldY - cam.y); }
