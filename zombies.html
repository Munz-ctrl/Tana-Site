<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ZOMBIE STREET</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; overflow: hidden; }

    body {
      background: #05050a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      color: #e0e0e0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* ── GAME CONTAINER — fills the full viewport edge to edge ── */
    #game-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #05050a;
    }

    /* ── Rotate prompt (portrait mobile only) ── */
    #rotate-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: #05050a;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #rotate-icon { font-size: 48px; animation: spin 2s ease-in-out infinite; }
    @keyframes spin {
      0%,100% { transform: rotate(0deg); }
      50%      { transform: rotate(90deg); }
    }
    #rotate-msg { font-size: 10px; color: #e94560; letter-spacing: 3px; }
    #rotate-sub { font-size: 6px; color: #333355; letter-spacing: 1px; }
    @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    canvas {
      display: block;
      position: absolute;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Retro pixelation transition — the reverse of room 1's exit dissolve.
       Covers the game on load and animates away as the scene resolves
       into focus. */
    #transitionCanvas {
      z-index: 90;
      opacity: 0;
      pointer-events: none;
    }

    /* CRT scanlines — same texture as room 1 */
    #game-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px
      );
      pointer-events: none;
      z-index: 50;
    }

    /* ────────────────────────────────────────
       TOUCH CONTROLS  (body-level fixed overlay)
    ──────────────────────────────────────── */
    #touch-ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 15;
    }
    @media (hover: none) and (pointer: coarse) {
      #touch-ui { display: block; }
    }

    #joystick-zone {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      left:   calc(env(safe-area-inset-left,   0px) + 14px);
      width: 100px; height: 100px;
      pointer-events: all;
      touch-action: none;
    }
    #joystick-base {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: rgba(233,69,96,0.08);
      border: 2px solid rgba(233,69,96,0.35);
      box-shadow: 0 0 18px rgba(233,69,96,0.18);
    }
    #joystick-knob {
      position: absolute;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e94560, #5c1a28);
      border: 2px solid rgba(233,69,96,0.9);
      box-shadow: 0 0 14px rgba(233,69,96,0.5);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* fire button — bottom-right of viewport (mirrors room 1's interact
       button pattern, relabeled with a crosshair for hold-to-fire) */
    #fire-btn {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
      right:  calc(env(safe-area-inset-right,  0px) + 16px);
      width: 66px; height: 66px;
      border-radius: 50%;
      background: rgba(233,69,96,0.09);
      border: 2px solid rgba(233,69,96,0.5);
      display: flex; align-items: center; justify-content: center;
      pointer-events: all; touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, box-shadow 0.08s;
      font-size: 26px; color: #e94560;
    }
    #fire-btn.pressed {
      background: rgba(233,69,96,0.32);
      box-shadow: 0 0 22px rgba(233,69,96,0.55);
    }

    /* weapon-switch button — same bottom-right cluster as fire-btn, sits
       just above it. Tap cycles to the next unlocked weapon; shows its
       short label so the player can see what's equipped without
       checking the HUD. */
    #weapon-btn {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 22px + 66px + 10px);
      right:  calc(env(safe-area-inset-right,  0px) + 16px);
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(249,199,79,0.09);
      border: 2px solid rgba(249,199,79,0.5);
      display: flex; align-items: center; justify-content: center;
      pointer-events: all; touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, box-shadow 0.08s;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px; color: #f9c74f;
      text-align: center;
    }
    #weapon-btn.pressed {
      background: rgba(249,199,79,0.32);
      box-shadow: 0 0 22px rgba(249,199,79,0.55);
    }

    /* ────────────────────────────────────────
       GAME OVER — score submission + leaderboard
    ──────────────────────────────────────── */
    #gameover-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(5,5,10,0.92);
      display: none; align-items: center; justify-content: center;
      padding: max(env(safe-area-inset-top,0px),20px)
               max(env(safe-area-inset-right,0px),20px)
               max(env(safe-area-inset-bottom,0px),20px)
               max(env(safe-area-inset-left,0px),20px);
    }
    #gameover-overlay.active { display: flex; }
    #gameover-box {
      width: min(360px, 100%);
      max-height: calc(100svh - 40px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #0c0710;
      border: 2px solid #e94560;
      box-shadow: 0 0 40px rgba(233,69,96,0.35);
      padding: 22px 22px 18px;
      text-align: center;
    }
    #gameover-title {
      font-size: 18px; color: #e94560; letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(233,69,96,0.7);
      margin-bottom: 16px;
    }
    #gameover-stats { font-size: 9px; color: #b0b8d0; line-height: 2.4; margin-bottom: 16px; }
    #gameover-stats b { color: #f9c74f; }

    #go-name-wrap { margin-bottom: 12px; }
    #go-name-input {
      width: 100%;
      background: #080818; border: 1px solid #4ecca3; color: #4ecca3;
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 9px 10px; outline: none; text-align: center;
    }
    #go-name-input::placeholder { color: #1a3a2a; }

    #go-name-static { font-size: 9px; color: #4ecca3; margin-bottom: 12px; }

    #go-submit-btn, #go-playagain-btn {
      width: 100%;
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 10px; cursor: pointer;
      background: rgba(78,204,163,0.08); border: 1px solid #4ecca3; color: #4ecca3;
      transition: background 0.1s;
    }
    #go-submit-btn:hover, #go-playagain-btn:hover { background: rgba(78,204,163,0.22); }
    #go-submit-btn:disabled { opacity: 0.4; cursor: default; }

    #go-submit-status { font-size: 7px; color: #f9c74f; margin: 8px 0; min-height: 10px; }

    #go-leaderboard { margin: 16px 0; border-top: 1px solid #2a1420; padding-top: 12px; }
    #go-leaderboard-title { font-size: 9px; color: #e94560; margin-bottom: 8px; letter-spacing: 1px; }
    #go-leaderboard-list { list-style: none; font-size: 7.5px; color: #b0b8d0; text-align: left; }
    #go-leaderboard-list li {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 4px 2px; border-bottom: 1px solid #1a1020;
    }
    #go-leaderboard-list li span:first-child { color: #f9c74f; flex-shrink: 0; }
    #go-leaderboard-empty { font-size: 7px; color: #4a4a5a; }

    #go-playagain-btn { margin-top: 4px; border-color: #e94560; color: #e94560; background: rgba(233,69,96,0.08); }
    #go-playagain-btn:hover { background: rgba(233,69,96,0.22); }
  </style>
</head>
<body>

<div id="game-container">

  <div id="rotate-screen">
    <div id="rotate-icon">⟳</div>
    <div id="rotate-msg">ROTATE DEVICE</div>
    <div id="rotate-sub">this game is landscape only</div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <canvas id="transitionCanvas"></canvas>

</div>

<div id="touch-ui">
  <div id="joystick-zone">
    <div id="joystick-base"></div>
    <div id="joystick-knob"></div>
  </div>
  <div id="weapon-btn">PST</div>
  <div id="fire-btn">⊕</div>
</div>

<div id="gameover-overlay">
  <div id="gameover-box">
    <div id="gameover-title">GAME OVER</div>
    <div id="gameover-stats">
      SCORE: <b id="go-score">0</b><br>
      WAVE REACHED: <b id="go-wave">1</b>
    </div>

    <div id="go-name-wrap" style="display:none">
      <input id="go-name-input" maxlength="12" placeholder="YOUR NAME" autocomplete="off">
    </div>
    <div id="go-name-static" style="display:none"></div>

    <button id="go-submit-btn">SUBMIT SCORE</button>
    <div id="go-submit-status"></div>

    <div id="go-leaderboard">
      <div id="go-leaderboard-title">▸ TOP 10</div>
      <ol id="go-leaderboard-list"></ol>
    </div>

    <button id="go-playagain-btn">PLAY AGAIN</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────
//  ZOMBIE STREET — Room 2 foundation
//  Same vanilla Canvas architecture as index.html (room 1): world size
//  auto-derived from the background image, fixed camera-window
//  resolution panned across it, sceneObjects + wouldCollide() for
//  static geometry, Y-sorted rendering, responsive resizeGame().
//
//  No zombies, combat, or wave logic yet — this pass only builds the
//  walkable street and gets the player moving around in it.
// ─────────────────────────────────────────────────────────

// These get overwritten by bgImg.onload — do not change manually
let WORLD_W = 3200;   // placeholder — replaced once plt2.png loads
let WORLD_H = 1600;   // placeholder

// Fixed camera-window resolution — IDENTICAL to index.html's VIEW_W/VIEW_H.
// The camera pans this same fixed window across the much larger world
// instead of scaling the window up.
const VIEW_W = 1537;
const VIEW_H = 768;

let SCREEN_W = VIEW_W;
let SCREEN_H = VIEW_H;

// ── Player geometry — hardcoded to the actual on-screen pixel size
//    index.html renders the player at (NOT a % of this room's much
//    taller background, which would render ~2x too large). ──
const PW          = 92;
const PH          = 123;
const FEET_OY     = Math.round(PH * 0.77);   // 95
const FEET_H      = Math.round(PH * 0.23);   // 28
const FEET_MARGIN = Math.round(PW * 0.28);   // 26
const SPEED       = 4.5;
const JOY_SPEED    = 4.5;

// World-bounds margin — keeps the player from walking off the map edge.
// (Room 1 uses ROOM_L/R + FLOOR_TOP/BTM for an interior floor plan; this
// is the open-street equivalent — the walkable area is the whole map
// minus a small edge margin, with buildings as the actual obstacles.)
const WORLD_MARGIN = 20;

// ── Night tint — shared helper, reused later for zombies + weapon sheets.
//    Composites a translucent navy multiply-tint over a sprite's own
//    silhouette so day-lit art reads as night-lit without new art. ──
const NIGHT_TINT_COLOR    = '#141c3a';
const NIGHT_TINT_STRENGTH = 0.5;   // 0..1

// ─────────────────────────────────────────────────────────
//  ZOMBIE TIERS — plain constants, hand-tune freely.
//  A is weakest/slowest, C is strongest/fastest. Contact damage isn't
//  applied yet (no player HP this pass) but is defined now so combat
//  can read it directly later.
// ─────────────────────────────────────────────────────────
const ZOMBIE_TIERS = {
  A: { hp: 20, speed: 1.5, damage: 5,  color: '#3a4a34', sheet: 'assets/zombieA.png' },
  B: { hp: 45, speed: 2.0, damage: 10, color: '#4a3a52', sheet: 'assets/zombieB.png' },
  C: { hp: 90, speed: 2.6, damage: 18, color: '#5c2020', sheet: 'assets/zombieC.png' },
};

// Wave at which each tougher tier first becomes eligible to spawn.
const WAVE_TIER_B_START = 3;
const WAVE_TIER_C_START = 6;

// Once unlocked, a tier's share of spawns grows this much per wave
// beyond its unlock wave, capped so tier A never fully disappears.
const TIER_WEIGHT_GROWTH = 0.15;
const TIER_WEIGHT_MAX    = 0.6;

// ── Difficulty scaling — formula-driven, not a hand-written table. ──
const ZOMBIE_COUNT_BASE    = 4;   // zombies in wave 1
const ZOMBIE_COUNT_GROWTH  = 2;   // additional zombies per wave
const ZOMBIE_COUNT_MAX     = 40;  // hard cap regardless of wave number

const ZOMBIE_HP_MULT_GROWTH    = 0.08;  // +8% HP per wave beyond 1
const ZOMBIE_HP_MULT_MAX       = 2.5;
const ZOMBIE_SPEED_MULT_GROWTH = 0.02;  // +2% speed per wave beyond 1
const ZOMBIE_SPEED_MULT_MAX    = 1.6;

// Hand overrides for the first few waves — anything not listed here
// falls through to the ZOMBIE_COUNT_* formula above.
const WAVE_COUNT_OVERRIDES = {
  1: 4,
  2: 6,
};

const SPAWN_INTERVAL = 900;   // ms between individual zombie spawns during a wave

const WAVE_INTRO_DURATION = 2200; // ms the "WAVE N" banner is shown
const WAVE_CLEAR_DURATION = 2500; // ms countdown after the last zombie is gone

// Extra settle time after the intro pixelation transition finishes, before
// the wave/spawn system (and its banner) actually begins — gives any
// still-loading player/zombie/weapon art a moment to arrive. The player
// can still move around freely during this buffer; only waves are held.
const GAME_START_BUFFER_MS = 2000;

// Anti-stuck: if a zombie has barely moved for this long despite trying,
// it's wedged in a concave corner the axis-slide alone can't escape —
// give it a small perpendicular shove to break free.
const STUCK_CHECK_INTERVAL = 2000; // ms window to judge "hasn't moved"
const STUCK_MIN_DISTANCE   = 6;    // px moved within the window to NOT be stuck
const STUCK_NUDGE          = 14;   // px, perpendicular shove magnitude

// ─────────────────────────────────────────────────────────
//  WEAPONS — plain per-weapon constants, hand-tune freely.
//  coneDeg is the FULL angle of the hitscan cone (centered on the aim
//  angle). With 8 aim directions 45° apart, a single-target weapon's
//  cone must stay well under 45° or two adjacent directions would hit
//  the same target — the shotgun is the deliberate exception: it's
//  wide enough to overlap neighboring directions and can multi-hit.
// ─────────────────────────────────────────────────────────
const WEAPON_ORDER = ['pistol', 'smg', 'shotgun']; // unlock progression order
const WEAPONS = {
  pistol:  { label: 'PISTOL',  short: 'PST', damage: 14, fireRate: 380, range: 560, coneDeg: 18, multiHit: false },
  smg:     { label: 'SMG',     short: 'SMG', damage: 6,  fireRate: 90,  range: 480, coneDeg: 22, multiHit: false },
  // knockback is a separate property from multiHit — it just happens that
  // the shotgun is currently the only weapon with either. Per-tier: A/B
  // (weakest/mid) get shoved the most, C (toughest) barely budges.
  shotgun: { label: 'SHOTGUN', short: 'SG', damage: 9,  fireRate: 650, range: 320, coneDeg: 50, multiHit: true,
    knockback: { A: 46, B: 42, C: 14 } },
};

// Wave-clear events that unlock each later weapon (pistol is available
// from the start). Sits next to the wave-scaling constants above since
// both drive off the same wave-clear progression.
const WEAPON_UNLOCK_WAVE = {
  smg:     4,
  shotgun: 8,
};

const WEAPON_UNLOCK_NOTICE_DURATION = 2400; // ms the "WEAPON UNLOCKED" banner shows

// Transient combat FX durations (procedural, no art assets).
const TRACER_FX_DURATION = 110; // ms a shot's tracer/muzzle-flash is visible
const DEATH_FX_DURATION  = 420; // ms a zombie's death burst plays

// Non-lethal hit feedback — the exact same red spoke-burst drawDeathEffect
// already draws for a kill, just smaller and briefer, so a hit that
// doesn't finish the zombie off still reads clearly as a hit.
const HIT_FX_DURATION = 180;  // ms — shorter than the death burst
const HIT_FX_SCALE    = 0.45; // shrinks the whole burst proportionally


// Purely visual — where the tracer/muzzle-flash is drawn FROM, as a
// fraction of PW (x) / PH (y) from the player's top-left corner, per
// facing direction. Separate from originX/originY in fireWeapon(),
// which stay feet-anchored for hit detection — this just moves the
// drawn ray to roughly where the gun sits in each pose.
const TRACER_VISUAL_ORIGIN = {
  down:  { x: 0.50, y: 0.45 },
  up:    { x: 0.50, y: 0.40 },
  left:  { x: 0.15, y: 0.38 },
  right: { x: 0.85, y: 0.38 },
};

// The tracer visual fans this many rays evenly across the firing weapon's
// actual coneDeg (same value fireWeapon() already used for hit detection,
// so the visual width always matches what's really being hit) — same
// mechanism for every weapon. Each ray is drawn dimmer than a single solid
// line would be, so a narrow cone's rays (nearly all overlapping) still
// read as roughly one ray, while a wide cone's rays (spread far apart)
// clearly read as a fan.
const TRACER_RAY_COUNT       = 5;
const TRACER_RAY_ALPHA_SCALE = 0.45;

// ─────────────────────────────────────────────────────────
//  PLAYER HP / SCORING — plain constants, hand-tune freely.
// ─────────────────────────────────────────────────────────
const PLAYER_MAX_HP          = 100;
const PLAYER_INVULN_DURATION = 700; // ms of i-frames after taking a hit
const PLAYER_KNOCKBACK       = 34;  // px shoved away from the zombie on hit

const SCORE_PER_KILL = { A: 10, B: 25, C: 60 }; // more points for tougher tiers
const SCORE_WAVE_CLEAR_BONUS = 50;              // flat bonus per wave cleared

// ── Sprite sheet layout — same grid as index.html ──
//  rows = directions, cols = frames
const FRAME_W  = 256;
const FRAME_H  = 256;
const DIR_ROW  = { down:0, up:1, left:2, right:3 };

// ── 8-way aim directions — independent of the 4-way walk-facing above.
//    Index order matches a clockwise sweep starting at "right" so
//    Math.round(angle / 45°) maps directly onto it (see angleToAimDir). ──
const AIM_DIRS = [
  { dx: 1, dy: 0 }, { dx: 1, dy: 1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 1 },
  { dx: -1, dy: 0 }, { dx: -1, dy: -1 }, { dx: 0, dy: -1 }, { dx: 1, dy: -1 },
].map(d => {
  const len = Math.hypot(d.dx, d.dy);
  return { dx: d.dx / len, dy: d.dy / len };
});

function angleToAimDir(ix, iy) {
  const angle = Math.atan2(iy, ix);
  let idx = Math.round(angle / (Math.PI / 4));
  return ((idx % 8) + 8) % 8;
}

// ─────────────────────────────────────────────────────────
//  CANVAS
// ─────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
canvas.width  = VIEW_W;
canvas.height = VIEW_H;

// ─────────────────────────────────────────────────────────
//  IDENTITY — read the name/skin persisted by room 1
// ─────────────────────────────────────────────────────────
const SKIN_COUNT = 3;
let playerName    = 'ANON';
let hasStoredName = false; // did room 1 actually give us a name, vs. defaulting to ANON
let playerSkin    = 0;
try {
  const storedName = localStorage.getItem('tana-player-name');
  if (storedName) { playerName = storedName; hasStoredName = true; }
  const storedSkin = parseInt(localStorage.getItem('tana-player-skin'), 10);
  if (!isNaN(storedSkin) && storedSkin >= 0 && storedSkin < SKIN_COUNT) playerSkin = storedSkin;
} catch (_) {}

// ─────────────────────────────────────────────────────────
//  SCORING / LEADERBOARD — plain REST insert/select via supabase-js,
//  same project + anon key room 1 uses for presence, but a completely
//  separate concern from its realtime broadcast channel: this is a
//  one-off write to a plain table, not a live channel.
// ─────────────────────────────────────────────────────────
const sb = supabase.createClient(
  'https://bqhltjtktpaoctymmjrc.supabase.co',
  'sb_publishable_75Z_fkmYckjBRFmI2jol6A_Czi0estn'
);

async function submitScore(name, finalScore, waveReached) {
  try {
    const { error } = await sb.from('zombie_scores').insert({
      name: (name || 'ANON').slice(0, 20),
      score: finalScore,
      wave: waveReached,
    });
    if (error) throw error;
    return true;
  } catch (e) {
    console.error('[ZOMBIE STREET] score submit failed:', e);
    return false;
  }
}

async function fetchLeaderboard() {
  try {
    const { data, error } = await sb
      .from('zombie_scores')
      .select('name,score,wave')
      .order('score', { ascending: false })
      .limit(10);
    if (error) throw error;
    return data || [];
  } catch (e) {
    console.error('[ZOMBIE STREET] leaderboard fetch failed:', e);
    return [];
  }
}

// Reserved for a future score-based unlock reward (not scoped yet) — e.g.
// unlocking a cosmetic or weapon skin once the player crosses some score
// threshold. Called after every score change so the hook is already wired
// in; fill in the body later without touching any call site.
function checkScoreUnlock(currentScore) {
  // TODO: score-based unlock reward — not scoped yet.
}

// ─────────────────────────────────────────────────────────
//  ASSET LOADING
// ─────────────────────────────────────────────────────────
function loadImg(src) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = src;
  return img;
}

const bgImg = loadImg('assets/plt2.png');

// Same base (no-weapon) skin sheets as room 1 — the chosen skin index
// picks which one to draw the player with.
const skinImgs = [
  loadImg('assets/spritetestf2.png'),
  loadImg('assets/girlsprite.png'),
  loadImg('assets/mascotsprite.png'),
];

// Zombie sheets — tier A exists today; B/C are loaded the same way but may
// 404 (art not built yet). A failed/incomplete Image still reports
// complete=true with naturalWidth=0, so the same "complete && naturalWidth"
// check used everywhere else safely detects both cases and falls back to a
// placeholder rect — wave testing isn't blocked waiting on that art.
const zombieImgs = {
  A: loadImg(ZOMBIE_TIERS.A.sheet),
  B: loadImg(ZOMBIE_TIERS.B.sheet),
  C: loadImg(ZOMBIE_TIERS.C.sheet),
};

// Per (skin, weapon) player sheets — same 256×256/4-row layout as the base
// skin sheets, 2 columns (idle + walk). Filenames follow {Skin}{Weapon}.png,
// e.g. skinBPistol.png, skinASMG.png — except skin A + pistol, which is
// already built as the exact file skinApistol.png (lowercase, pre-existing).
// Every (skin, weapon) pair is preloaded up front; missing ones just 404
// like zombie B/C above, and drawPlayer() falls back to the base skin sheet.
const SKIN_LETTERS      = ['A', 'B', 'C'];
const WEAPON_FILE_NAMES = { pistol: 'Pistol', smg: 'SMG', shotgun: 'Shotgun' };

function weaponSheetPath(skinIdx, weaponKey) {
  const letter = SKIN_LETTERS[skinIdx] || 'A';
  if (letter === 'A' && weaponKey === 'pistol') return 'assets/skinApistol.png';
  return `assets/skin${letter}${WEAPON_FILE_NAMES[weaponKey]}.png`;
}

const weaponSkinImgs = {};
for (let s = 0; s < SKIN_LETTERS.length; s++) {
  for (const wk of WEAPON_ORDER) {
    weaponSkinImgs[`${s}_${wk}`] = loadImg(weaponSheetPath(s, wk));
  }
}

// ─────────────────────────────────────────────────────────
//  SCENE OBJECTS — populated once WORLD_W/WORLD_H are known
// ─────────────────────────────────────────────────────────
const sceneObjects = [];

// plt2.png already paints the corner buildings into the background art
// itself — these are invisible colliders (same pattern as room 1's
// "wall_mid_left") that line up with that art, not drawn geometry.
function makeBuilding(id, x, y, w, h) {
  return {
    id, x, y, w, h,
    baseY: y + h,
    collision: { x, y, w, h },
    interactable: false,
    img: null,
    draw() {}
  };
}

// ─────────────────────────────────────────────────────────
//  PLAYER
// ─────────────────────────────────────────────────────────
const player = {
  x: WORLD_W / 2 - PW / 2,
  y: WORLD_H / 2 - PH / 2,
  facing: 'down',
  animFrame: 0,
  animTick: 0,
  idleFrame: 0,
  idleTick: 0,
  aimDir: 2, // index into AIM_DIRS — starts facing "down", matches `facing`
  hp: PLAYER_MAX_HP,
  invulnUntil: 0, // performance.now() timestamp — i-frames until this passes
};

// ─────────────────────────────────────────────────────────
//  COMBAT — weapon state
// ─────────────────────────────────────────────────────────
let currentWeapon    = 'pistol';
const unlockedWeapons = new Set(['pistol']);
let lastFireTime      = 0;
let fireHeld          = false;
let weaponUnlockNotice = null; // { label, start } while the banner is shown

// ─────────────────────────────────────────────────────────
//  SCORE / GAME-OVER STATE
// ─────────────────────────────────────────────────────────
let score    = 0;
let gameOver = false;

function addScore(points) {
  score += points;
  checkScoreUnlock(score);
}

function playerFeetRect(px, py) {
  return {
    x: (px ?? player.x) + FEET_MARGIN,
    y: (py ?? player.y) + FEET_OY,
    w: PW - FEET_MARGIN * 2,
    h: FEET_H,
  };
}
function playerBaseY() { return player.y + FEET_OY + FEET_H; }

// ─────────────────────────────────────────────────────────
//  COLLISION — same rectsOverlap/wouldCollide pattern as room 1
// ─────────────────────────────────────────────────────────
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x
      && a.y < b.y + b.h && a.y + a.h > b.y;
}

// `self` identifies which entity is doing the moving (the `player` object,
// or a zombie object) so that entity is excluded from the entity-solidity
// checks below — otherwise nothing could ever move, since it would always
// be "colliding" with its own feet rect. Omit `self` (e.g. from
// pickSpawnPoint, which isn't moving anything) to check against everyone.
function wouldCollide(px, py, self) {
  const feet = playerFeetRect(px, py);

  for (const obj of sceneObjects) {
    if (!obj.collision) continue;
    if (rectsOverlap(feet, obj.collision)) return true;
  }

  if (feet.x < WORLD_MARGIN) return true;
  if (feet.x + feet.w > WORLD_W - WORLD_MARGIN) return true;
  if (feet.y < WORLD_MARGIN) return true;
  if (feet.y + feet.h > WORLD_H - WORLD_MARGIN) return true;

  // The player and every zombie are solid too — the player can't walk
  // through a zombie, and zombies can't stack on the player or each other.
  if (self !== player && rectsOverlap(feet, playerFeetRect())) return true;
  for (const z of zombies) {
    if (z === self) continue;
    if (rectsOverlap(feet, playerFeetRect(z.x, z.y))) return true;
  }

  return false;
}

// ─────────────────────────────────────────────────────────
//  ZOMBIES
//  Zombies share the player's exact frame/feet geometry (PW/PH/FEET_*),
//  so wouldCollide(px,py) — built around playerFeetRect(px,py) — works
//  unchanged for them too; every call below passes explicit coordinates.
// ─────────────────────────────────────────────────────────
const zombies = [];

// Random point along a world edge, retried until it clears every
// sceneObjects collision rect (i.e. isn't inside a building). Falls back
// to a known-open spot if repeatedly unlucky.
function pickSpawnPoint() {
  for (let attempt = 0; attempt < 20; attempt++) {
    const edge = Math.floor(Math.random() * 4); // 0 top, 1 bottom, 2 left, 3 right
    let x, y;
    if (edge === 0)      { x = WORLD_MARGIN + Math.random() * (WORLD_W - 2 * WORLD_MARGIN); y = WORLD_MARGIN; }
    else if (edge === 1) { x = WORLD_MARGIN + Math.random() * (WORLD_W - 2 * WORLD_MARGIN); y = WORLD_H - WORLD_MARGIN - PH; }
    else if (edge === 2) { x = WORLD_MARGIN; y = WORLD_MARGIN + Math.random() * (WORLD_H - 2 * WORLD_MARGIN); }
    else                 { x = WORLD_W - WORLD_MARGIN - PW; y = WORLD_MARGIN + Math.random() * (WORLD_H - 2 * WORLD_MARGIN); }

    if (!wouldCollide(x, y)) return { x, y };
  }
  return { x: WORLD_W / 2 - PW / 2, y: WORLD_MARGIN }; // known-open middle of the top edge
}

// Weighted tier pick — A always eligible, B/C phase in from their unlock
// wave and grow louder each wave after that, capped so A never vanishes.
function pickTier(wave) {
  const wA = 1;
  const wB = wave >= WAVE_TIER_B_START ? Math.min(TIER_WEIGHT_MAX, TIER_WEIGHT_GROWTH * (wave - WAVE_TIER_B_START + 1)) : 0;
  const wC = wave >= WAVE_TIER_C_START ? Math.min(TIER_WEIGHT_MAX, TIER_WEIGHT_GROWTH * (wave - WAVE_TIER_C_START + 1)) : 0;
  const r = Math.random() * (wA + wB + wC);
  if (r < wA) return 'A';
  if (r < wA + wB) return 'B';
  return 'C';
}

function spawnZombie(tier, wave) {
  const base = ZOMBIE_TIERS[tier];
  const hpMult    = Math.min(ZOMBIE_HP_MULT_MAX,    1 + ZOMBIE_HP_MULT_GROWTH    * (wave - 1));
  const speedMult = Math.min(ZOMBIE_SPEED_MULT_MAX, 1 + ZOMBIE_SPEED_MULT_GROWTH * (wave - 1));
  const spawn = pickSpawnPoint();
  const hp = base.hp * hpMult;
  return {
    tier,
    x: spawn.x, y: spawn.y,
    hp, maxHp: hp,
    speed: base.speed * speedMult,
    damage: base.damage,
    facing: 'down',
    animFrame: 0, animTick: 0,
    _stuckX: spawn.x, _stuckY: spawn.y, _stuckSince: performance.now(),
  };
}

function zombieBaseY(z) { return z.y + FEET_OY + FEET_H; }

function updateZombie(z, dt) {
  const dx = player.x - z.x, dy = player.y - z.y;
  const dist = Math.hypot(dx, dy) || 1;
  const vx = (dx / dist) * z.speed * dt;
  const vy = (dy / dist) * z.speed * dt;

  if (Math.abs(dx) > Math.abs(dy)) z.facing = dx > 0 ? 'right' : 'left';
  else                             z.facing = dy > 0 ? 'down'  : 'up';

  // Axis-separated movement — same slide-along-the-wall behavior as the
  // player, with no real pathfinding. `z` is excluded from the entity
  // checks so it never collides with itself; buildings, the player, and
  // every OTHER zombie are all solid to it.
  if (!wouldCollide(z.x + vx, z.y, z)) z.x += vx;
  if (!wouldCollide(z.x, z.y + vy, z)) z.y += vy;

  // Anti-stuck: wedged against geometry (a concave building corner) OR
  // now against a dense cluster of other zombies pressing toward the same
  // player — shove it perpendicular to its approach direction to break
  // free. Try both perpendicular directions (a packed cluster can easily
  // have the randomly-chosen one blocked too) before giving up for this
  // check window.
  const now = performance.now();
  const movedSinceCheck = Math.hypot(z.x - z._stuckX, z.y - z._stuckY);
  if (movedSinceCheck > STUCK_MIN_DISTANCE) {
    z._stuckX = z.x; z._stuckY = z.y; z._stuckSince = now;
  } else if (now - z._stuckSince > STUCK_CHECK_INTERVAL) {
    const firstSign = Math.random() < 0.5 ? 1 : -1;
    for (const sign of [firstSign, -firstSign]) {
      const nx = (-dy / dist) * STUCK_NUDGE * sign;
      const ny = (dx / dist) * STUCK_NUDGE * sign;
      const canX = !wouldCollide(z.x + nx, z.y, z);
      const canY = !wouldCollide(z.x, z.y + ny, z);
      if (!canX && !canY) continue; // this direction is fully blocked too — try the other
      if (canX) z.x += nx;
      if (canY) z.y += ny;
      break;
    }
    z._stuckX = z.x; z._stuckY = z.y; z._stuckSince = now;
  }

  z.animTick += dt;
  if (z.animTick >= 14) { z.animTick = 0; z.animFrame ^= 1; }
}

function damageZombie(z, dmg) {
  z.hp -= dmg;
  if (z.hp > 0) {
    // Non-lethal hit — same burst as a kill, just smaller/briefer, so
    // every hit a shot lands (including each target in a multi-hit
    // shotgun blast) reads clearly as a hit even when it doesn't kill.
    addEffect({
      type: 'death',
      x: z.x + PW / 2, y: z.y + FEET_OY + FEET_H / 2,
      duration: HIT_FX_DURATION,
      scale: HIT_FX_SCALE,
    });
    return;
  }
  const idx = zombies.indexOf(z);
  if (idx === -1) return; // already removed (e.g. a shotgun blast hit it twice)
  zombies.splice(idx, 1);
  addScore(SCORE_PER_KILL[z.tier] || 0);
  addEffect({
    type: 'death',
    x: z.x + PW / 2, y: z.y + FEET_OY + FEET_H / 2,
    duration: DEATH_FX_DURATION,
  });
}

// Pushes a zombie away from (sourceX, sourceY) — e.g. the shotgun's blast
// origin — using the same axis-separated, wouldCollide-respecting movement
// zombies and the player already use elsewhere, so a knocked-back zombie
// stops at a building's edge, another zombie's edge, or the player's edge
// instead of shoving through it.
function applyZombieKnockback(z, sourceX, sourceY, amount) {
  if (!amount) return;
  // sourceX/sourceY (fireWeapon's originX/originY) are feet-centered, so
  // measure the zombie the same way — matches how fireWeapon() itself
  // measured it for the cone/distance check — rather than its raw
  // top-left x/y, which would skew the push angle.
  const zcx = z.x + PW / 2, zcy = z.y + FEET_OY + FEET_H / 2;
  const dx = zcx - sourceX, dy = zcy - sourceY;
  const dist = Math.hypot(dx, dy) || 1;
  const kx = (dx / dist) * amount;
  const ky = (dy / dist) * amount;
  if (!wouldCollide(z.x + kx, z.y, z)) z.x += kx;
  if (!wouldCollide(z.x, z.y + ky, z)) z.y += ky;
}

// ─────────────────────────────────────────────────────────
//  PLAYER HP — zombie contact damage + knockback + i-frames
// ─────────────────────────────────────────────────────────

// Checked once per frame after zombies move — touching any zombie while
// not currently invulnerable costs HP, knocks the player back a little,
// and starts a brief invulnerability window so a whole swarm can't melt
// the player in one frame.
//
// Now that zombies (and the player) are solid in wouldCollide(), movement
// stops the player and a zombie just short of true overlap — each frame,
// the step that *would* overlap gets rejected, leaving a small step-sized
// gap rather than flush contact. Inflating the touch-check by that much
// finds contact at the point they're touching-but-solid, same as before
// they could still freely overlap.
const CONTACT_TOUCH_BUFFER = 12; // px

function checkZombieContact(now) {
  if (gameOver || now < player.invulnUntil) return;
  const pFeetTouch = inflateRect(playerFeetRect(), CONTACT_TOUCH_BUFFER);
  for (const z of zombies) {
    const zFeet = playerFeetRect(z.x, z.y); // zombies share the player's feet geometry
    if (!rectsOverlap(pFeetTouch, zFeet)) continue;
    applyPlayerDamage(z.damage, z);
    return; // one hit per frame even if several zombies are touching
  }
}

function inflateRect(r, amt) {
  return { x: r.x - amt, y: r.y - amt, w: r.w + amt * 2, h: r.h + amt * 2 };
}

function applyPlayerDamage(dmg, source) {
  player.hp = Math.max(0, player.hp - dmg);
  player.invulnUntil = performance.now() + PLAYER_INVULN_DURATION;

  const dx = player.x - source.x, dy = player.y - source.y;
  const dist = Math.hypot(dx, dy) || 1;
  const kx = (dx / dist) * PLAYER_KNOCKBACK;
  const ky = (dy / dist) * PLAYER_KNOCKBACK;
  if (!wouldCollide(player.x + kx, player.y, player)) player.x += kx;
  if (!wouldCollide(player.x, player.y + ky, player)) player.y += ky;

  if (player.hp <= 0) triggerGameOver();
}

// ─────────────────────────────────────────────────────────
//  COMBAT — transient FX (procedural, no art assets)
// ─────────────────────────────────────────────────────────
const effects = [];

function addEffect(e) {
  e.start = performance.now();
  effects.push(e);
}

function pruneEffects() {
  const now = performance.now();
  for (let i = effects.length - 1; i >= 0; i--) {
    if (now - effects[i].start > effects[i].duration) effects.splice(i, 1);
  }
}

// ─────────────────────────────────────────────────────────
//  COMBAT — aiming + firing
// ─────────────────────────────────────────────────────────

// Player's raw movement input, read fresh each frame in update() — aim
// direction is derived from this, independent of collision-adjusted
// actual movement, so aiming still works even when pressed into a wall.
function updateAim(ix, iy) {
  if (ix !== 0 || iy !== 0) player.aimDir = angleToAimDir(ix, iy);
}

function tryFire(now) {
  const w = WEAPONS[currentWeapon];
  if (now - lastFireTime < w.fireRate) return;
  lastFireTime = now;
  fireWeapon(w);
}

function fireWeapon(w) {
  const dir = AIM_DIRS[player.aimDir];
  const angle = Math.atan2(dir.dy, dir.dx);
  const halfCone = (w.coneDeg * Math.PI / 180) / 2;
  const originX = player.x + PW / 2;
  const originY = player.y + FEET_OY + FEET_H / 2;

  const hits = [];
  for (const z of zombies) {
    const zx = z.x + PW / 2, zy = z.y + FEET_OY + FEET_H / 2;
    const ddx = zx - originX, ddy = zy - originY;
    const dist = Math.hypot(ddx, ddy);
    if (dist < 1 || dist > w.range) continue;
    let diff = Math.abs(Math.atan2(ddy, ddx) - angle);
    if (diff > Math.PI) diff = 2 * Math.PI - diff;
    if (diff <= halfCone) hits.push({ z, dist });
  }
  hits.sort((a, b) => a.dist - b.dist);

  if (hits.length) {
    if (w.multiHit) {
      for (const h of hits) {
        damageZombie(h.z, w.damage);
        // Per-tier pushback (shotgun-only right now) — skip a zombie the
        // hit just killed, since damageZombie() already removed it.
        if (w.knockback && h.z.hp > 0) {
          applyZombieKnockback(h.z, originX, originY, w.knockback[h.z.tier] || 0);
        }
      }
    } else {
      damageZombie(hits[0].z, w.damage);
    }
  }

  // Tracer reaches the nearest hit target, or the weapon's full range on a
  // miss — visible either way so a miss still reads as feedback. Its draw
  // origin is chest-height (visual only), separate from originX/originY
  // above which stay feet-anchored for hit detection.
    const tracerDist = hits.length ? hits[0].dist : w.range;
  const visOff = TRACER_VISUAL_ORIGIN[player.facing];
  addEffect({
    type: 'tracer',
    x: player.x + PW * visOff.x, y: player.y + PH * visOff.y, angle, dist: tracerDist,
    coneDeg: w.coneDeg, // so the tracer fans across the same cone that was actually checked
    multiHit: w.multiHit, // only multi-hit weapons (the shotgun) draw the ray fan
    hit: hits.length > 0,
    // Facing at the moment of firing — not re-checked later, since the
    // player could turn while the tracer is still fading — used in
    // render() to draw this behind the player when they were facing away.
    facing: player.facing,
    duration: TRACER_FX_DURATION,
  });
}

function checkWeaponUnlocks(clearedWave) {
  for (const key of WEAPON_ORDER) {
    const unlockWave = WEAPON_UNLOCK_WAVE[key];
    if (unlockWave != null && clearedWave === unlockWave && !unlockedWeapons.has(key)) {
      unlockedWeapons.add(key);
      currentWeapon = key;
      weaponUnlockNotice = { label: WEAPONS[key].label, start: performance.now() };
    }
  }
}

// Manual weapon switch (desktop Q key / mobile weapon-btn) — cycles to the
// next weapon in WEAPON_ORDER that's actually unlocked, wrapping back to
// the first. A no-op with only one weapon unlocked.
function switchToNextWeapon() {
  const unlocked = WEAPON_ORDER.filter(k => unlockedWeapons.has(k));
  if (unlocked.length <= 1) return;
  const idx = unlocked.indexOf(currentWeapon);
  currentWeapon = unlocked[(idx + 1) % unlocked.length];
  // Don't let a fast weapon's cooldown carry over into an instant first
  // shot with a slower one.
  lastFireTime = 0;
}

// ─────────────────────────────────────────────────────────
//  WAVE STATE MACHINE
//  WAVE_INTRO (banner) → WAVE_ACTIVE (spawns trickle in, zombies roam)
//  → WAVE_CLEAR (countdown once the wave's zombies are all gone) → next.
//  Zombie kills now normally drive the ACTIVE→CLEAR transition; the 'K'
//  debug key still force-clears a wave instantly for testing.
//
//  gameStarted stays false until the intro pixelation has finished AND a
//  further GAME_START_BUFFER_MS has passed — update() and drawHUD() skip
//  updateWave()/drawWaveBanner() entirely until then, so neither is ever
//  implicitly timed off the stale waveStateSince=0 default from before
//  startWave() has run for real. The player can still move around freely
//  in the meantime; only the wave/spawn/banner system is held back.
// ─────────────────────────────────────────────────────────
let gameStarted      = false;
let waveNumber       = 1;
let waveState        = 'INTRO';
let waveStateSince   = 0;
let waveTotalCount   = 0;
let waveSpawnedCount = 0;
let lastSpawnTime    = 0;

function waveZombieCount(wave) {
  if (WAVE_COUNT_OVERRIDES[wave] != null) return WAVE_COUNT_OVERRIDES[wave];
  return Math.min(ZOMBIE_COUNT_MAX, Math.round(ZOMBIE_COUNT_BASE + ZOMBIE_COUNT_GROWTH * (wave - 1)));
}

function startWave(n) {
  waveNumber       = n;
  waveState        = 'INTRO';
  waveStateSince   = performance.now();
  waveTotalCount   = waveZombieCount(n);
  waveSpawnedCount = 0;
  lastSpawnTime    = 0;
}

function updateWave() {
  const now = performance.now();

  if (waveState === 'INTRO') {
    if (now - waveStateSince >= WAVE_INTRO_DURATION) {
      waveState = 'ACTIVE';
      waveStateSince = now;
    }
  } else if (waveState === 'ACTIVE') {
    if (waveSpawnedCount < waveTotalCount && now - lastSpawnTime >= SPAWN_INTERVAL) {
      zombies.push(spawnZombie(pickTier(waveNumber), waveNumber));
      waveSpawnedCount++;
      lastSpawnTime = now;
    }
    if (waveSpawnedCount >= waveTotalCount && zombies.length === 0) {
      waveState = 'CLEAR';
      waveStateSince = now;
      addScore(SCORE_WAVE_CLEAR_BONUS);
      checkWeaponUnlocks(waveNumber);
    }
  } else if (waveState === 'CLEAR') {
    if (now - waveStateSince >= WAVE_CLEAR_DURATION) {
      startWave(waveNumber + 1);
    }
  }
}

// ── Auto-size world to image, then lay out the street + buildings ──
bgImg.onload = () => {
  WORLD_W = bgImg.naturalWidth;
  WORLD_H = bgImg.naturalHeight;

  player.x = WORLD_W / 2 - PW / 2;
  player.y = WORLD_H / 2 - PH / 2;

  // Cross-shaped street intersection: plt2.png already paints a building
  // into each corner, fronted by a sidewalk that runs along the street.
  // These insets were measured directly off the art (sampled pixel bands
  // of the actual background image) so the invisible colliders sit at
  // the building line rather than spilling out over the walkable sidewalk.
  const BUILDING_W = 780;  // building footprint depth inward from left/right edge
  const BUILDING_H = 240;  // building footprint depth inward from top/bottom edge

  sceneObjects.length = 0;
  sceneObjects.push(
    makeBuilding('bldg_tl', 0, 0, BUILDING_W, BUILDING_H),
    makeBuilding('bldg_tr', WORLD_W - BUILDING_W, 0, BUILDING_W, BUILDING_H),
    makeBuilding('bldg_bl', 0, WORLD_H - BUILDING_H, BUILDING_W, BUILDING_H),
    makeBuilding('bldg_br', WORLD_W - BUILDING_W, WORLD_H - BUILDING_H, BUILDING_W, BUILDING_H),
  );

  console.log(`[ZOMBIE STREET] World: ${WORLD_W}×${WORLD_H} | Player: ${PW}×${PH}`);

  // Wait two frames so the loop has actually painted this world/background
  // before snapshotting it for the intro dissolve. The wave system doesn't
  // start the moment the dissolve finishes — startWave(1) (and gameStarted)
  // wait an additional GAME_START_BUFFER_MS so the banner/spawns can't pop
  // in while the scene (and its art) is still settling. The player can
  // still move around freely in the meantime.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    playIntroPixelation(() => {
      setTimeout(() => {
        gameStarted = true;
        startWave(1);
      }, GAME_START_BUFFER_MS);
    });
  }));
};

// ─────────────────────────────────────────────────────────
//  CAMERA — same clamped-pan formula as room 1
// ─────────────────────────────────────────────────────────
const cam = { x: 0, y: 0 };
let VIEW_H_DYN = VIEW_H;
let CROP_TOP   = 0;

function updateCamera() {
  cam.x = player.x + PW / 2 - VIEW_W / 2;
  cam.x = Math.max(0, Math.min(WORLD_W - VIEW_W, cam.x));

  cam.y = player.y + PH / 2 - VIEW_H / 2;
  const camYMin = -CROP_TOP;
  const camYMax = Math.max(camYMin, WORLD_H - VIEW_H + CROP_TOP);
  cam.y = Math.max(camYMin, Math.min(camYMax, cam.y));
}

function wx(worldX) { return Math.round(worldX - cam.x); }
function wy(worldY) { return Math.round(worldY - cam.y); }

// ─────────────────────────────────────────────────────────
//  INPUT — keyboard
// ─────────────────────────────────────────────────────────
const keys = {};
let debugOn = false;
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === '`') debugOn = !debugOn;
  // DEBUG — instantly clear the current wave (kills all active zombies and
  // marks the wave fully spawned so WAVE_ACTIVE's normal check advances it
  // to WAVE_CLEAR next tick). Useful for fast-forwarding to test unlocks.
  if (e.key === 'k' || e.key === 'K') {
    zombies.length = 0;
    waveSpawnedCount = waveTotalCount;
  }
  // DEBUG — self-inflicted damage, for exercising the HP/game-over flow
  // without waiting to actually get cornered by a swarm.
  if ((e.key === 'h' || e.key === 'H') && !gameOver) {
    applyPlayerDamage(25, { x: player.x + PW, y: player.y });
  }
  // Manual weapon switch — cycles to the next unlocked weapon.
  if (e.key === 'q' || e.key === 'Q') switchToNextWeapon();
  if (e.key === ' ') fireHeld = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
  if (e.key === ' ') fireHeld = false;
});

canvas.addEventListener('mousedown', e => { if (e.button === 0) fireHeld = true; });

// ─────────────────────────────────────────────────────────
//  INPUT — virtual joystick (same pattern as room 1)
// ─────────────────────────────────────────────────────────
const joy = { dx: 0, dy: 0, active: false };
const JOY_MAX = 30;
const jZone = document.getElementById('joystick-zone');
const jKnob = document.getElementById('joystick-knob');
let jCX = 0, jCY = 0, jTid = null;

function jStart(e) {
  e.preventDefault();
  const t = e.changedTouches[0]; jTid = t.identifier;
  const r = jZone.getBoundingClientRect();
  jCX = r.left + r.width / 2; jCY = r.top + r.height / 2;
  jMove(e);
}
function jMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== jTid) continue;
    let dx = t.clientX - jCX, dy = t.clientY - jCY;
    const d = Math.hypot(dx, dy);
    if (d > JOY_MAX) { dx = dx / d * JOY_MAX; dy = dy / d * JOY_MAX; }
    jKnob.style.left = `calc(50% + ${dx}px)`;
    jKnob.style.top  = `calc(50% + ${dy}px)`;
    jKnob.style.transform = 'translate(-50%,-50%)';
    joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX; joy.active = true;
  }
}
function jEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== jTid) continue;
    jKnob.style.left = jKnob.style.top = '50%';
    jKnob.style.transform = 'translate(-50%,-50%)';
    joy.dx = joy.dy = 0; joy.active = false; jTid = null;
  }
}
jZone.addEventListener('touchstart',  jStart, { passive: false });
jZone.addEventListener('touchmove',   jMove,  { passive: false });
jZone.addEventListener('touchend',    jEnd,   { passive: false });
jZone.addEventListener('touchcancel', jEnd,   { passive: false });

// ─────────────────────────────────────────────────────────
//  UPDATE
// ─────────────────────────────────────────────────────────
function update(dt = 1) {
  if (gameOver) return; // frozen behind the Game Over overlay

  let vx = 0, vy = 0;
  let ix = 0, iy = 0; // raw input direction, undiluted by dt/speed — feeds aim

  if (joy.active) {
    ix = joy.dx; iy = joy.dy;
    const mag = Math.min(1, Math.hypot(joy.dx, joy.dy));
    vx = joy.dx * JOY_SPEED * mag * dt;
    vy = joy.dy * JOY_SPEED * mag * dt;
  } else {
    const up    = keys['w'] || keys['W'] || keys['ArrowUp'];
    const down  = keys['s'] || keys['S'] || keys['ArrowDown'];
    const left  = keys['a'] || keys['A'] || keys['ArrowLeft'];
    const right = keys['d'] || keys['D'] || keys['ArrowRight'];
    ix = (right ? 1 : 0) + (left ? -1 : 0);
    iy = (down  ? 1 : 0) + (up   ? -1 : 0);
    vx = right ? SPEED : left ? -SPEED : 0;
    vy = down  ? SPEED : up   ? -SPEED : 0;
    if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
    vx *= dt; vy *= dt;
  }

  updateAim(ix, iy);

  if (Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1) {
    const ax = Math.abs(vx), ay = Math.abs(vy);
    if      (ax >= ay && vx > 0) player.facing = 'right';
    else if (ax >= ay && vx < 0) player.facing = 'left';
    else if (vy > 0)             player.facing = 'down';
    else                         player.facing = 'up';
  }

  // Axis-separated movement — slides along a building's (or now a
  // zombie's) edge instead of stopping dead when moving diagonally into it.
  if (vx !== 0 && !wouldCollide(player.x + vx, player.y, player)) player.x += vx;
  if (vy !== 0 && !wouldCollide(player.x, player.y + vy, player)) player.y += vy;

  const moving = Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1;
  player.moving = moving;
  if (moving) {
    player.idleFrame = 0;
    player.idleTick  = 0;
    player.animTick += dt;
    if (player.animTick >= 10) { player.animTick = 0; player.animFrame ^= 1; }
  } else {
    player.animFrame = 0;
    player.animTick  = 0;
    player.idleTick += dt;
    if (player.idleTick >= 30) { player.idleTick = 0; player.idleFrame ^= 1; }
  }

  updateCamera();

  if (gameStarted) updateWave();
  for (const z of zombies) updateZombie(z, dt);
  checkZombieContact(performance.now());

  // Firing happens after the zombie-update pass above (a kill splices
  // `zombies` — safe here since that loop has already finished).
  if (fireHeld) tryFire(performance.now());
  pruneEffects();
}

// ─────────────────────────────────────────────────────────
//  NIGHT TINT — shared helper (see constants above)
//  Draws a sprite frame then composites a translucent navy multiply-tint
//  clipped back to the sprite's own alpha so day-lit art reads as
//  night-lit. Reused later for zombies and weapon-specific sheets.
// ─────────────────────────────────────────────────────────
const _tintCanvas = document.createElement('canvas');
_tintCanvas.width  = PW;
_tintCanvas.height = PH;
const _tintCtx = _tintCanvas.getContext('2d');

function drawNightTinted(srcImg, sx0, sy0, sw, sh, dx, dy, dw, dh) {
  _tintCtx.clearRect(0, 0, dw, dh);
  _tintCtx.imageSmoothingEnabled = false;
  _tintCtx.globalCompositeOperation = 'source-over';
  _tintCtx.drawImage(srcImg, sx0, sy0, sw, sh, 0, 0, dw, dh);

  // Multiply-tint the whole box...
  _tintCtx.globalCompositeOperation = 'multiply';
  _tintCtx.globalAlpha = NIGHT_TINT_STRENGTH;
  _tintCtx.fillStyle = NIGHT_TINT_COLOR;
  _tintCtx.fillRect(0, 0, dw, dh);
  _tintCtx.globalAlpha = 1;

  // ...then re-clip to the sprite's own silhouette so the tint doesn't
  // paint a visible box over the transparent padding around it.
  _tintCtx.globalCompositeOperation = 'destination-in';
  _tintCtx.drawImage(srcImg, sx0, sy0, sw, sh, 0, 0, dw, dh);
  _tintCtx.globalCompositeOperation = 'source-over';

  ctx.drawImage(_tintCanvas, 0, 0, dw, dh, dx, dy, dw, dh);
}

// ─────────────────────────────────────────────────────────
//  DRAW — BACKGROUND
// ─────────────────────────────────────────────────────────
function drawBackground() {
  ctx.imageSmoothingEnabled = false;

  if (bgImg.complete && bgImg.naturalWidth > 0) {
    const scaleX = bgImg.naturalWidth  / WORLD_W;
    const scaleY = bgImg.naturalHeight / WORLD_H;
    ctx.drawImage(
      bgImg,
      Math.round(cam.x * scaleX),
      Math.round(cam.y * scaleY),
      Math.round(VIEW_W * scaleX),
      Math.round(VIEW_H * scaleY),
      0, 0, VIEW_W, VIEW_H
    );
  } else {
    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

// ─────────────────────────────────────────────────────────
//  DRAW — PLAYER
// ─────────────────────────────────────────────────────────
function roundRect(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y); cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r); cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h); cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r); cx.arcTo(x,y,x+r,y,r);
  cx.closePath();
}

// Equipped-weapon sheet for the current skin if it's loaded, else the base
// no-weapon skin sheet — the same "load if present, else fall back" pattern
// used for zombie B/C, just keyed by (skin, weapon) instead of just tier.
function currentPlayerImg() {
  const img = weaponSkinImgs[`${playerSkin}_${currentWeapon}`];
  if (img && img.complete && img.naturalWidth > 0) return img;
  return skinImgs[playerSkin];
}

function drawPlayer() {
  const sx = wx(player.x);
  const sy = wy(player.y);

  // Invulnerability i-frames read as a fast blink after taking a hit.
  const invuln = performance.now() < player.invulnUntil;
  if (invuln && Math.floor(performance.now() / 80) % 2 === 0) return;

  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(sx + PW / 2, sy + PH - 6, PW / 3.2, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.imageSmoothingEnabled = false;

  const _sImg = currentPlayerImg();
  if (_sImg.complete && _sImg.naturalWidth > 0) {
    const moving = player.moving ?? false;
    // Weapon sheets are documented as 2 columns (idle + walk) — no
    // breathe-frame column — while base skin sheets have 3. Read the
    // actual sheet width rather than assuming, so either layout (and any
    // future sheet with a real 3rd column) is handled correctly instead
    // of guessing from which image happened to be picked.
    const cols = Math.max(1, Math.floor(_sImg.naturalWidth / FRAME_W));
    const col  = moving ? player.animFrame : (cols >= 3 && player.idleFrame === 1 ? 2 : 0);
    const srcX = col * FRAME_W;
    const srcY = DIR_ROW[player.facing] * FRAME_H;

    drawNightTinted(_sImg, srcX, srcY, FRAME_W, FRAME_H, sx, sy, PW, PH);
  } else {
    ctx.fillStyle = '#e94560';
    ctx.fillRect(sx + 8, sy, PW - 16, PH * 0.35);
    ctx.fillStyle = '#141c3a';
    ctx.fillRect(sx + 4, sy + PH * 0.35, PW - 8, PH * 0.65);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(ctx, sx + PW / 2 - 26, sy - 22, 52, 16, 2);
  ctx.fill();
  ctx.fillStyle = '#e94560';
  ctx.font = '8px "Press Start 2P"';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(playerName, sx + PW / 2, sy - 14);
}

// ─────────────────────────────────────────────────────────
//  DRAW — ZOMBIE
//  Tier A has real art; B/C fall back to a tier-tinted placeholder rect
//  (same "complete && naturalWidth" pattern room 1's scene objects use)
//  until their sheets exist.
// ─────────────────────────────────────────────────────────
function drawZombie(z) {
  const sx = wx(z.x), sy = wy(z.y);

  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(sx + PW / 2, sy + PH - 6, PW / 3.2, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.imageSmoothingEnabled = false;

  const img = zombieImgs[z.tier];
  if (img.complete && img.naturalWidth > 0) {
    const srcX = z.animFrame * FRAME_W;
    const srcY = DIR_ROW[z.facing] * FRAME_H;
    drawNightTinted(img, srcX, srcY, FRAME_W, FRAME_H, sx, sy, PW, PH);
  } else {
    ctx.fillStyle = ZOMBIE_TIERS[z.tier].color;
    ctx.fillRect(sx + 10, sy + 6, PW - 20, PH - 24);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(z.tier, sx + PW / 2, sy + PH / 2);
  }
}

// ─────────────────────────────────────────────────────────
//  DRAW — COMBAT FX (procedural — tracer/muzzle-flash + death burst)
// ─────────────────────────────────────────────────────────
// Tracers fired while the player was facing 'up' are drawn separately, in
// render() BEFORE the player sprite (so they land behind it) — everything
// else (every other tracer, plus the death burst) still draws here, after
// everything, on top, exactly as before.
function drawEffects() {
  const now = performance.now();
  for (const e of effects) {
    const t = Math.min(1, (now - e.start) / e.duration);
    if (e.type === 'tracer') {
      if (e.facing === 'up') continue;
      drawTracerEffect(e, t);
    } else if (e.type === 'death') {
      drawDeathEffect(e, t);
    }
  }
}

function drawUpFacingTracers() {
  const now = performance.now();
  for (const e of effects) {
    if (e.type !== 'tracer' || e.facing !== 'up') continue;
    drawTracerEffect(e, Math.min(1, (now - e.start) / e.duration));
  }
}

function drawTracerEffect(e, t) {
  const sx = wx(e.x), sy = wy(e.y);
  const alpha = 1 - t;
  const halfCone = ((e.coneDeg || 0) * Math.PI / 180) / 2;

  ctx.save();
  ctx.strokeStyle = e.hit ? '#f9c74f' : 'rgba(249,199,79,0.5)';
  ctx.lineWidth = 2;

  if (e.multiHit) {
    // Fan TRACER_RAY_COUNT rays evenly across ±halfCone (the same cone
    // fireWeapon() actually checked) instead of one center line, so the
    // visual width always matches what's really being hit. Each ray is
    // dimmer than a single solid line would be so the fan doesn't read
    // brighter than a normal single-line tracer. Only multi-hit weapons
    // (the shotgun) draw this — single-target weapons' cones are meant to
    // stay narrow/invisible, not read as a visible spread.
    for (let i = 0; i < TRACER_RAY_COUNT; i++) {
      const frac = TRACER_RAY_COUNT > 1 ? (i / (TRACER_RAY_COUNT - 1)) * 2 - 1 : 0; // -1..1
      const rayAngle = e.angle + frac * halfCone;
      const ex = sx + Math.cos(rayAngle) * e.dist;
      const ey = sy + Math.sin(rayAngle) * e.dist;
      ctx.globalAlpha = alpha * TRACER_RAY_ALPHA_SCALE;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }
  } else {
    // Single-target weapons (pistol, SMG) — one clean line straight down
    // the aim angle, no cone spread, same as before the fan was added.
    const ex = sx + Math.cos(e.angle) * e.dist;
    const ey = sy + Math.sin(e.angle) * e.dist;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }

  // Muzzle flash — small bright burst at the origin
  ctx.globalAlpha = alpha;
  const flashR = 10 * (1 - t) + 2;
  const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, flashR);
  grad.addColorStop(0, 'rgba(255,240,180,0.9)');
  grad.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(sx, sy, flashR, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawDeathEffect(e, t) {
  const sx = wx(e.x), sy = wy(e.y);
  const alpha = 1 - t;
  const scale = e.scale ?? 1; // shrinks the whole burst for the lighter non-lethal-hit variant
  const spread = (6 + t * 26) * scale;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#7a1f1f';
  const spokes = 6;
  for (let i = 0; i < spokes; i++) {
    const a = (i / spokes) * Math.PI * 2;
    const px = sx + Math.cos(a) * spread;
    const py = sy + Math.sin(a) * spread * 0.6;
    const r = (5 * (1 - t) + 1.5) * scale;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(40,10,10,0.6)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, spread * 0.7, spread * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ─────────────────────────────────────────────────────────
//  DRAW — WAVE BANNER
// ─────────────────────────────────────────────────────────
function drawWaveBanner() {
  const cx = VIEW_W / 2, cy = CROP_TOP + VIEW_H_DYN / 2;

  if (waveState === 'INTRO') {
    const t = (performance.now() - waveStateSince) / WAVE_INTRO_DURATION;
    const alpha = t < 0.15 ? t / 0.15 : t > 0.8 ? (1 - t) / 0.2 : 1;
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.fillStyle = 'rgba(5,5,10,0.4)';
    ctx.fillRect(0, cy - 40, VIEW_W, 80);
    ctx.fillStyle = '#e94560';
    ctx.font = '22px "Press Start 2P"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`WAVE ${waveNumber}`, cx, cy);
    ctx.globalAlpha = 1;
  } else if (waveState === 'CLEAR') {
    const remain = Math.max(0, WAVE_CLEAR_DURATION - (performance.now() - waveStateSince));
    ctx.fillStyle = 'rgba(5,5,10,0.4)';
    ctx.fillRect(0, cy - 30, VIEW_W, 60);
    ctx.fillStyle = '#4ecca3';
    ctx.font = '14px "Press Start 2P"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`WAVE ${waveNumber} CLEARED`, cx, cy - 12);
    ctx.font = '9px "Press Start 2P"';
    ctx.fillText(`NEXT WAVE IN ${Math.ceil(remain / 1000)}...`, cx, cy + 12);
  }

  if (weaponUnlockNotice) {
    const t = (performance.now() - weaponUnlockNotice.start) / WEAPON_UNLOCK_NOTICE_DURATION;
    if (t >= 1) {
      weaponUnlockNotice = null;
    } else {
      const alpha = t < 0.1 ? t / 0.1 : t > 0.75 ? (1 - t) / 0.25 : 1;
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.fillStyle = 'rgba(5,5,10,0.5)';
      ctx.fillRect(0, cy + 44, VIEW_W, 46);
      ctx.fillStyle = '#f9c74f';
      ctx.font = '13px "Press Start 2P"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`WEAPON UNLOCKED: ${weaponUnlockNotice.label}`, cx, cy + 67);
      ctx.globalAlpha = 1;
    }
  }
}

// ─────────────────────────────────────────────────────────
//  DRAW — HUD
// ─────────────────────────────────────────────────────────
function drawHUD() {
  const screenBtm = CROP_TOP + VIEW_H_DYN;
  ctx.fillStyle = 'rgba(5,5,10,0)';
  ctx.fillRect(0, CROP_TOP, VIEW_W, 20);
  ctx.fillStyle = '#e94560';
  ctx.font = '9px "Press Start 2P"';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('▸ ZOMBIE STREET', 8, CROP_TOP + 10);

  ctx.textAlign = 'right';
  const remaining = zombies.length + Math.max(0, waveTotalCount - waveSpawnedCount);
  ctx.fillText(`WAVE ${waveNumber}  ·  ${remaining} LEFT`, VIEW_W - 8, CROP_TOP + 10);

  // Second HUD row — HP bar (left) + score (right)
  const rowY = CROP_TOP + 26;
  const barW = 100, barH = 10;
  const hpFrac = Math.max(0, player.hp / PLAYER_MAX_HP);
  ctx.fillStyle = 'rgba(20,5,10,0.7)';
  ctx.fillRect(8, rowY, barW, barH);
  ctx.fillStyle = hpFrac > 0.35 ? '#4ecca3' : '#e94560';
  ctx.fillRect(8, rowY, barW * hpFrac, barH);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
  ctx.strokeRect(8, rowY, barW, barH);
  ctx.fillStyle = '#e0e0e0';
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`${Math.ceil(player.hp)}/${PLAYER_MAX_HP}`, 8 + barW + 8, rowY + barH / 2 + 1);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#f9c74f';
  ctx.font = '9px "Press Start 2P"';
  ctx.fillText(`SCORE ${score}`, VIEW_W - 8, rowY + barH / 2 + 1);

  // Bottom-left weapon readout
  ctx.fillStyle = 'rgba(5,5,10,0.55)';
  ctx.fillRect(0, screenBtm - 20, 140, 20);
  ctx.fillStyle = '#f9c74f';
  ctx.textAlign = 'left';
  ctx.fillText(`[${WEAPONS[currentWeapon].label}]`, 8, screenBtm - 10);

  // Keep the mobile weapon-switch button's label in sync — cheap to just
  // re-set every frame rather than hooking every currentWeapon assignment.
  const _wbLabel = WEAPONS[currentWeapon].short || WEAPONS[currentWeapon].label;
  if (weaponBtn.textContent !== _wbLabel) weaponBtn.textContent = _wbLabel;

  if (gameStarted) drawWaveBanner();
}

// ─────────────────────────────────────────────────────────
//  MAIN RENDER — Y-sort by baseY, same as room 1
// ─────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  ctx.imageSmoothingEnabled = false;

  drawBackground();

  // Tracers fired while facing up are drawn here, before drawPlayer() runs
  // below (via the Y-sorted renderList), so they land behind the player.
  drawUpFacingTracers();

  const renderList = [];
  for (const obj of sceneObjects) {
    renderList.push({
      baseY: obj.baseY,
      fn: () => {
        const sx = wx(obj.x), sy = wy(obj.y);
        if (sx + obj.w < 0 || sx > VIEW_W || sy + obj.h < 0 || sy > VIEW_H) return;
        ctx.imageSmoothingEnabled = false;
        if (obj.img && obj.img.complete && obj.img.naturalWidth > 0) {
          ctx.drawImage(obj.img, sx, sy, obj.w, obj.h);
        } else {
          obj.draw(ctx, sx, sy);
        }
      }
    });
  }
  renderList.push({ baseY: playerBaseY(), fn: drawPlayer });
  for (const z of zombies) {
    renderList.push({ baseY: zombieBaseY(z), fn: () => drawZombie(z) });
  }
  renderList.sort((a, b) => a.baseY - b.baseY);
  for (const item of renderList) item.fn();

  // Combat FX draw on top of everything — transient, screen-space overlay.
  drawEffects();

  // ── DEBUG OVERLAY (press ` backtick to toggle) — for tuning the
  // invisible building colliders against the painted background art. ──
  if (debugOn) {
    // World-space coordinate grid (every 100px) — for reading off exact
    // building-edge coordinates against the painted art while tuning.
    ctx.strokeStyle = 'rgba(255,255,0,0.25)'; ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(255,255,0,0.6)'; ctx.font = '9px monospace';
    const gStartX = Math.floor(cam.x / 100) * 100;
    const gStartY = Math.floor(cam.y / 100) * 100;
    for (let gx = gStartX; gx < cam.x + VIEW_W; gx += 100) {
      ctx.beginPath(); ctx.moveTo(wx(gx), 0); ctx.lineTo(wx(gx), VIEW_H); ctx.stroke();
      ctx.fillText(String(gx), wx(gx) + 2, 12);
    }
    for (let gy = gStartY; gy < cam.y + VIEW_H; gy += 100) {
      ctx.beginPath(); ctx.moveTo(0, wy(gy)); ctx.lineTo(VIEW_W, wy(gy)); ctx.stroke();
      ctx.fillText(String(gy), 2, wy(gy) + 10);
    }
    for (const obj of sceneObjects) {
      if (!obj.collision) continue;
      const cxp = wx(obj.collision.x), cyp = wy(obj.collision.y);
      ctx.fillStyle = 'rgba(255,40,40,0.18)';
      ctx.fillRect(cxp, cyp, obj.collision.w, obj.collision.h);
      ctx.strokeStyle = 'rgba(255,40,40,0.9)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(cxp, cyp, obj.collision.w, obj.collision.h);
      ctx.fillStyle = '#39ff14'; ctx.font = '11px monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(obj.id, cxp + 3, cyp + 3);
    }
    const pf = playerFeetRect();
    ctx.strokeStyle = 'cyan'; ctx.lineWidth = 1.5;
    ctx.strokeRect(wx(pf.x), wy(pf.y), pf.w, pf.h);
    ctx.fillStyle = '#4ecca3'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`WORLD ${WORLD_W}x${WORLD_H}  PLAYER (${Math.round(player.x)},${Math.round(player.y)})`, 6, 24);
    ctx.fillText(`WAVE state=${waveState} spawned=${waveSpawnedCount}/${waveTotalCount} zombies=${zombies.length}  [K]=clear wave`, 6, 38);
    ctx.fillText(`WEAPON=${currentWeapon} aimDir=${player.aimDir} unlocked=[${[...unlockedWeapons].join(',')}]`, 6, 52);
    ctx.fillText(`HP=${player.hp.toFixed(1)}/${PLAYER_MAX_HP} invuln=${performance.now() < player.invulnUntil} SCORE=${score}  [H]=-25hp`, 6, 66);

    // Aim cone — shows the exact hitscan wedge for the current weapon.
    const w = WEAPONS[currentWeapon];
    const dir = AIM_DIRS[player.aimDir];
    const aimAngle = Math.atan2(dir.dy, dir.dx);
    const half = (w.coneDeg * Math.PI / 180) / 2;
    const ox = wx(player.x + PW / 2), oy = wy(player.y + FEET_OY + FEET_H / 2);
    ctx.strokeStyle = 'rgba(249,199,79,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + Math.cos(aimAngle - half) * w.range, oy + Math.sin(aimAngle - half) * w.range);
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + Math.cos(aimAngle + half) * w.range, oy + Math.sin(aimAngle + half) * w.range);
    ctx.stroke();

    for (const z of zombies) {
      const zsx = wx(z.x), zsy = wy(z.y);
      ctx.strokeStyle = 'rgba(255,150,0,0.8)'; ctx.lineWidth = 1;
      ctx.strokeRect(zsx + FEET_MARGIN, zsy + FEET_OY, PW - FEET_MARGIN * 2, FEET_H);
      ctx.fillStyle = '#ff9600'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
      ctx.fillText(z.tier, zsx + PW / 2, zsy - 6);
    }
  }

  drawHUD();
}

// ─────────────────────────────────────────────────────────
//  ROOM 1 → ROOM 2 INTRO TRANSITION — reverse pixelation dissolve
//  The other half of room 1's exit effect: starts at maximum block size
//  and resolves down to full resolution over ~500ms, using the same
//  downsample/upscale-with-smoothing-off technique.
// ─────────────────────────────────────────────────────────
const transitionCanvas = document.getElementById('transitionCanvas');
const tCtx             = transitionCanvas.getContext('2d');

function playIntroPixelation(onComplete) {
  const w = canvas.width, h = canvas.height;

  const snapshot = document.createElement('canvas');
  snapshot.width = w; snapshot.height = h;
  snapshot.getContext('2d').drawImage(canvas, 0, 0);

  transitionCanvas.width        = w;
  transitionCanvas.height       = h;
  transitionCanvas.style.width  = canvas.style.width;
  transitionCanvas.style.height = canvas.style.height;
  transitionCanvas.style.left   = canvas.style.left;
  transitionCanvas.style.top    = canvas.style.top;
  transitionCanvas.style.opacity = '1';

  const offscreen = document.createElement('canvas');
  const offCtx    = offscreen.getContext('2d');

  const DURATION   = 520;  // ms — within the 400-600ms target window
  const START_MULT = 46;   // begins very blocky
  const END_MULT   = 1;    // resolves to full resolution
  const OVERSCAN   = 24;   // px padding so jitter never reveals an edge
  const startTime  = performance.now();

  function step(now) {
    const t = Math.min(1, (now - startTime) / DURATION);

    const mult  = START_MULT + (END_MULT - START_MULT) * t;
    const downW = Math.max(1, Math.round(w / mult));
    const downH = Math.max(1, Math.round(h / mult));
    offscreen.width  = downW;
    offscreen.height = downH;
    offCtx.imageSmoothingEnabled = false;
    offCtx.drawImage(snapshot, 0, 0, downW, downH);

    // Jitter fades out as the image resolves, settling instead of
    // snapping cleanly into focus.
    const jitterMag = 8 * (1 - t);
    const jx = (Math.random() - 0.5) * jitterMag;
    const jy = (Math.random() - 0.5) * jitterMag;

    tCtx.imageSmoothingEnabled = false;
    tCtx.clearRect(0, 0, w, h);
    tCtx.drawImage(
      offscreen, 0, 0, downW, downH,
      -OVERSCAN / 2 + jx, -OVERSCAN / 2 + jy, w + OVERSCAN, h + OVERSCAN
    );

    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      transitionCanvas.style.opacity = '0';
      if (onComplete) onComplete();
    }
  }
  requestAnimationFrame(step);
}

// ─────────────────────────────────────────────────────────
//  RESPONSIVE SIZING — same approach as index.html's resizeGame()
// ─────────────────────────────────────────────────────────
function resizeGame() {
  const dpr = window.devicePixelRatio || 1;
  const vp = window.visualViewport;
  SCREEN_W = vp ? vp.width  : window.innerWidth;
  SCREEN_H = vp ? vp.height : window.innerHeight;

  const scale = SCREEN_W / VIEW_W;
  const cssH  = VIEW_H * scale;

  canvas.style.width  = SCREEN_W + 'px';
  canvas.style.height = cssH + 'px';
  canvas.style.left   = '0';
  canvas.style.top    = ((SCREEN_H - cssH) / 2) + 'px';

  canvas.width  = Math.round(SCREEN_W * dpr);
  canvas.height = Math.round(cssH * dpr);

  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;

  VIEW_H_DYN = Math.min(VIEW_H, SCREEN_H / scale);
  CROP_TOP   = (VIEW_H - VIEW_H_DYN) / 2;
}

window.addEventListener('resize', resizeGame);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resizeGame);
}
resizeGame();
setTimeout(resizeGame, 100);

// ─────────────────────────────────────────────────────────
//  GAME OVER — overlay wiring, score submission, leaderboard, reset
// ─────────────────────────────────────────────────────────
const goOverlay      = document.getElementById('gameover-overlay');
const goScoreEl      = document.getElementById('go-score');
const goWaveEl       = document.getElementById('go-wave');
const goNameWrap     = document.getElementById('go-name-wrap');
const goNameInput    = document.getElementById('go-name-input');
const goNameStatic   = document.getElementById('go-name-static');
const goSubmitBtn    = document.getElementById('go-submit-btn');
const goSubmitStatus = document.getElementById('go-submit-status');
const goLeaderList   = document.getElementById('go-leaderboard-list');
const goPlayAgainBtn = document.getElementById('go-playagain-btn');

let goSubmitted = false;

async function renderLeaderboard() {
  goLeaderList.innerHTML = '<li id="go-leaderboard-empty">LOADING...</li>';
  const rows = await fetchLeaderboard();
  if (!rows.length) {
    goLeaderList.innerHTML = '<li id="go-leaderboard-empty">NO SCORES YET</li>';
    return;
  }
  goLeaderList.innerHTML = rows.map((r, i) =>
    `<li><span>#${i + 1} ${(r.name || 'ANON').toUpperCase()}</span><span>${r.score} (W${r.wave})</span></li>`
  ).join('');
}

async function doSubmit(name) {
  if (goSubmitted) return;
  goSubmitted = true;
  goSubmitBtn.disabled = true;
  goSubmitStatus.textContent = 'SUBMITTING...';
  const ok = await submitScore(name, score, waveNumber);
  goSubmitStatus.textContent = ok ? '✓ SUBMITTED' : 'SUBMIT FAILED — SCORE NOT SAVED';
  renderLeaderboard();
}

function showGameOverOverlay() {
  goScoreEl.textContent = String(score);
  goWaveEl.textContent  = String(waveNumber);
  goSubmitted = false;
  goSubmitBtn.disabled = false;
  goSubmitStatus.textContent = '';
  goLeaderList.innerHTML = '';

  if (hasStoredName) {
    // Already have a name from room 1 — skip straight to submitting.
    goNameWrap.style.display   = 'none';
    goNameStatic.style.display = 'block';
    goNameStatic.textContent   = `PLAYER: ${playerName.toUpperCase()}`;
    goSubmitBtn.style.display  = 'none';
    doSubmit(playerName);
  } else {
    // No stored name — this is the player's second chance to name
    // themselves before their score is submitted.
    goNameWrap.style.display   = 'block';
    goNameStatic.style.display = 'none';
    goSubmitBtn.style.display  = 'block';
    goNameInput.value = '';
  }

  renderLeaderboard();
  goOverlay.classList.add('active');
}

function hideGameOverOverlay() {
  goOverlay.classList.remove('active');
}

goSubmitBtn.addEventListener('click', () => {
  const name = goNameInput.value.trim().replace(/[^a-zA-Z0-9_ ]/g, '').substring(0, 12).toUpperCase() || 'ANON';
  doSubmit(name);
});

function triggerGameOver() {
  if (gameOver) return;
  gameOver = true;
  showGameOverOverlay();
}

// Resets everything a fresh run needs — player, zombies, wave, HP, score,
// and weapon unlocks — then starts back at wave 1.
function resetGame() {
  player.x = WORLD_W / 2 - PW / 2;
  player.y = WORLD_H / 2 - PH / 2;
  player.hp = PLAYER_MAX_HP;
  player.invulnUntil = 0;
  player.facing = 'down';
  player.aimDir = 2;
  player.moving = false;

  zombies.length = 0;
  effects.length = 0;
  score = 0;

  currentWeapon = 'pistol';
  unlockedWeapons.clear();
  unlockedWeapons.add('pistol');

  gameOver = false;
  gameStarted = true; // in case this fires before the initial startup buffer's setTimeout does
  hideGameOverOverlay();
  startWave(1);
}

goPlayAgainBtn.addEventListener('click', resetGame);

// ─────────────────────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────────────────────
let _lastFrameTime = 0;
(function loop(ts) {
  const dt = _lastFrameTime ? Math.min((ts - _lastFrameTime) / 16.667, 3) : 1;
  _lastFrameTime = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
})();
</script>

</body>
