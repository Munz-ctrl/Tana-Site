  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  muteToggle.click();
});
TanaAudio.setMusic('room2');

// ─────────────────────────────────────────────────────────
//  INPUT — virtual joystick (same pattern as room 1)
// ─────────────────────────────────────────────────────────
const joy = { dx: 0, dy: 0, active: false };
const JOY_MAX = 55;
// Floating joystick: any touch that STARTS in #joystick-zone (left share of
// the screen, below the HUD) grabs it — the base appears centered under the
// thumb and the knob follows from there. Touches that start elsewhere (fire
// / weapon buttons) are separate touch identifiers, so they keep working at
// the same time. Movement math below is unchanged: joy.dx/dy are still
// knob offset / JOY_MAX.
const jZone = document.getElementById('joystick-zone');
const jRest = document.getElementById('joystick-rest');
const jBase = document.getElementById('joystick-base');
const jKnob = document.getElementById('joystick-knob');
let jCX = 0, jCY = 0, jTid = null;

function placeJoyBase(cx, cy) {
  const half = jBase.offsetWidth / 2;
  jBase.style.left = (cx - half) + 'px';
  jBase.style.top  = (cy - half) + 'px';
}
function settleJoyAtRest() {
  const r = jRest.getBoundingClientRect();
  if (!r.width) return; // touch UI not displayed (desktop)
  placeJoyBase(r.left + r.width / 2, r.top + r.height / 2);
}

function jStart(e) {
  e.preventDefault();
  if (jTid !== null) return; // one thumb drives the stick
  const t = e.changedTouches[0]; jTid = t.identifier;
  // Keep the whole ring on-screen even for a touch right at the edge.
  const half = jBase.offsetWidth / 2;
  jCX = Math.max(half, Math.min(window.innerWidth  - half, t.clientX));
  jCY = Math.max(half, Math.min(window.innerHeight - half, t.clientY));
  jBase.classList.add('active'); // before placing, so the move isn't animated
  placeJoyBase(jCX, jCY);
  jMove(e);
}
function jMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== jTid) continue;
    let dx = t.clientX - jCX, dy = t.clientY - jCY;
    const d = Math.hypot(dx, dy);
    if (d > JOY_MAX) { dx = dx / d * JOY_MAX; dy = dy / d * JOY_MAX; }
    jKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX; joy.active = true;
  }
}
function jEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== jTid) continue;
    jKnob.style.transform = 'translate(-50%,-50%)';
    joy.dx = joy.dy = 0; joy.active = false; jTid = null;
    jBase.classList.remove('active'); // re-enables the 150ms ease back
    settleJoyAtRest();
  }
}
jZone.addEventListener('touchstart',  jStart, { passive: false });
jZone.addEventListener('touchmove',   jMove,  { passive: false });
jZone.addEventListener('touchend',    jEnd,   { passive: false });
jZone.addEventListener('touchcancel', jEnd,   { passive: false });

// Rest spot depends on viewport + safe-area — re-seat the idle base whenever
// that can change (rotation, URL-bar show/hide), but never mid-drag.
function reseatIdleJoystick() {
  if (jTid !== null) return;
  jBase.classList.remove('active');
  jBase.style.transition = 'none';   // snap, don't slide, into the new spot
  settleJoyAtRest();
  void jBase.offsetWidth;            // flush so the snap isn't animated
  jBase.style.transition = '';
}
window.addEventListener('resize', reseatIdleJoystick);
window.addEventListener('orientationchange', reseatIdleJoystick);
requestAnimationFrame(reseatIdleJoystick);

// ─────────────────────────────────────────────────────────
//  UPDATE
// ─────────────────────────────────────────────────────────
function update(dt = 1) {
  if (gameOver) return; // frozen behind the Game Over overlay
  if (performance.now() < hitstopUntil) return; // kill hitstop — rendering carries on
  if (tapPromptActive) return;                  // waiting on "TAP TO FIGHT" — no movement or firing yet

  let vx = 0, vy = 0;
  let ix = 0, iy = 0; // raw input direction, undiluted by dt/speed — feeds aim

  if (joy.active) {
    ix = joy.dx; iy = joy.dy;
    const mag = Math.min(1, Math.hypot(joy.dx, joy.dy));
    vx = joy.dx * JOY_SPEED * mag * dt;
    vy = joy.dy * JOY_SPEED * mag * dt;
  } else {
    const up    = keys['w'] || keys['W'] || keys['ArrowUp'];
    const down  = keys['s'] || keys['S'] || keys['ArrowDown'];
    const left  = keys['a'] || keys['A'] || keys['ArrowLeft'];
    const right = keys['d'] || keys['D'] || keys['ArrowRight'];
    ix = (right ? 1 : 0) + (left ? -1 : 0);
    iy = (down  ? 1 : 0) + (up   ? -1 : 0);
    vx = right ? SPEED : left ? -SPEED : 0;
    vy = down  ? SPEED : up   ? -SPEED : 0;
    if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
    vx *= dt; vy *= dt;
  }

  // Frozen at the machine while a purchase is in progress.
  if (vendBuy) { vx = vy = 0; ix = iy = 0; }

  // Slower while the trigger is held (keyboard and stick alike); full speed
  // returns the instant fire is released.
  if (fireHeld) { vx *= FIRE_MOVE_SPEED_MULT; vy *= FIRE_MOVE_SPEED_MULT; }

  updateAimControl(ix, iy, Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1, performance.now(), dt * 16.667);

  if (Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1) {
    const ax = Math.abs(vx), ay = Math.abs(vy);
    if      (ax >= ay && vx > 0) player.facing = 'right';
    else if (ax >= ay && vx < 0) player.facing = 'left';
    else if (vy > 0)             player.facing = 'down';
    else                         player.facing = 'up';
  }

  // Axis-separated movement — slides along a building's (or now a
  // zombie's) edge instead of stopping dead when moving diagonally into it.
  if (vx !== 0 && !wouldCollide(player.x + vx, player.y, player)) player.x += vx;
  if (vy !== 0 && !wouldCollide(player.x, player.y + vy, player)) player.y += vy;

  const moving = Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1;
  player.moving = moving;
  if (moving) {
    player.idleFrame = 0;
    player.idleTick  = 0;
    player.animTick += dt;
    if (player.animTick >= 10) { player.animTick = 0; player.animFrame ^= 1; }
  } else {
    player.animFrame = 0;
    player.animTick  = 0;
    player.idleTick += dt;
    if (player.idleTick >= 30) { player.idleTick = 0; player.idleFrame ^= 1; }
  }

  updateCamera();

  updateVending(performance.now());

  if (gameStarted) updateWave();
  for (const z of zombies) updateZombie(z, dt);
  checkZombieContact(performance.now());

  // Firing happens after the zombie-update pass above (a kill splices
  // `zombies` — safe here since that loop has already finished).
  checkHosePickup();
  updateHose(dt, performance.now());
  // Reload first, so a reload that completes this frame lets a held trigger fire at once.
  updateReload(performance.now());
  if (fireHeld && !vendBuy && currentWeapon !== 'hose') tryFire(performance.now());
  pruneEffects();
  pruneEjecta(performance.now());
}

// ─────────────────────────────────────────────────────────
//  NIGHT TINT — shared helper (see constants above)
//  Draws a sprite frame then composites a translucent navy multiply-tint
//  clipped back to the sprite's own alpha so day-lit art reads as
//  night-lit. Reused later for zombies and weapon-specific sheets.
// ─────────────────────────────────────────────────────────
const _tintCanvas = document.createElement('canvas');
_tintCanvas.width  = PW;
_tintCanvas.height = PH;
const _tintCtx = _tintCanvas.getContext('2d');

function drawNightTinted(srcImg, sx0, sy0, sw, sh, dx, dy, dw, dh) {
  // Props can be larger than a character frame (e.g. the vending machine).
  if (_tintCanvas.width < dw)  _tintCanvas.width  = dw;
  if (_tintCanvas.height < dh) _tintCanvas.height = dh;
  _tintCtx.clearRect(0, 0, dw, dh);
  _tintCtx.imageSmoothingEnabled = false;
  _tintCtx.globalCompositeOperation = 'source-over';
  _tintCtx.drawImage(srcImg, sx0, sy0, sw, sh, 0, 0, dw, dh);

  // Multiply-tint the whole box...
  _tintCtx.globalCompositeOperation = 'multiply';
  _tintCtx.globalAlpha = NIGHT_TINT_STRENGTH;
  _tintCtx.fillStyle = NIGHT_TINT_COLOR;
  _tintCtx.fillRect(0, 0, dw, dh);
  _tintCtx.globalAlpha = 1;

  // ...then re-clip to the sprite's own silhouette so the tint doesn't
  // paint a visible box over the transparent padding around it.
  _tintCtx.globalCompositeOperation = 'destination-in';
  _tintCtx.drawImage(srcImg, sx0, sy0, sw, sh, 0, 0, dw, dh);
  _tintCtx.globalCompositeOperation = 'source-over';

  ctx.drawImage(_tintCanvas, 0, 0, dw, dh, dx, dy, dw, dh);
}

// Hit flash — same offscreen-canvas idea as drawNightTinted: draw the sprite
// frame, then fill with the flash colour using 'source-atop' so only the
// sprite's own silhouette is tinted, never the transparent padding.
const _flashCanvas = document.createElement('canvas');
_flashCanvas.width  = PW;
_flashCanvas.height = PH;
const _flashCtx = _flashCanvas.getContext('2d');

function drawFlashTinted(srcImg, sx0, sy0, sw, sh, dx, dy, dw, dh, color) {
  if (_flashCanvas.width < dw)  _flashCanvas.width  = dw;   // props can be bigger than a character frame
  if (_flashCanvas.height < dh) _flashCanvas.height = dh;
  _flashCtx.clearRect(0, 0, dw, dh);
  _flashCtx.imageSmoothingEnabled = false;
  _flashCtx.globalCompositeOperation = 'source-over';
  _flashCtx.drawImage(srcImg, sx0, sy0, sw, sh, 0, 0, dw, dh);
  _flashCtx.globalCompositeOperation = 'source-atop';
  _flashCtx.fillStyle = color || HIT_FX.flashColor;
  _flashCtx.fillRect(0, 0, dw, dh);
  _flashCtx.globalCompositeOperation = 'source-over';
  ctx.drawImage(_flashCanvas, 0, 0, dw, dh, dx, dy, dw, dh);
}

// ─────────────────────────────────────────────────────────
//  DRAW — VENDING (glow on the ground, price label, buy ring, floats)
// ─────────────────────────────────────────────────────────
// Faint pulsing glow on the ground in front of the machine — under all
// entities — so players can find it at night.
function drawVendingGlow() {
  if (!vendingObj) return;
  const cx = wx(vendingObj.groundX), cy = wy(vendingObj.groundY + VEND_GLOW_OFFSET_Y);
  if (cx < -VEND_GLOW_RX || cx > VIEW_W + VEND_GLOW_RX || cy < -VEND_GLOW_RY || cy > VIEW_H + VEND_GLOW_RY) return;
  const pulse = 0.6 + 0.4 * Math.sin(performance.now() / VEND_GLOW_PULSE_MS * Math.PI * 2);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, VEND_GLOW_RY / VEND_GLOW_RX); // squash the radial gradient into an ellipse
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, VEND_GLOW_RX);
  g.addColorStop(0, `rgba(${VEND_GLOW_RGB},${(VEND_GLOW_ALPHA * pulse).toFixed(3)})`);
  g.addColorStop(1, `rgba(${VEND_GLOW_RGB},0)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, VEND_GLOW_RX, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// "+40 HP  150 PTS" above the machine. Dim when you can't afford it / are
// at full HP, flashes red briefly after a refused buy.
function drawVendingLabel() {
  if (!vendingObj) return;
  const sx = wx(vendingObj.x + vendingObj.w / 2), sy = wy(vendingObj.y) - 12;
  if (sx < -120 || sx > VIEW_W + 120 || sy < -20 || sy > VIEW_H + 20) return;
  const now = performance.now();
  const err = now < vendLabelErrUntil;
  const color = err ? '#ff4d5e' : (vendCanBuy() ? '#f9c74f' : '#8f93a8');
  const txt = `+${VEND_HEAL_AMOUNT} HP  ${vendPrice} PTS`;
  ctx.save();
  ctx.font = '9px "Press Start 2P"';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(txt).width;
  ctx.fillStyle = err ? 'rgba(60,5,10,0.8)' : 'rgba(5,5,10,0.65)';
  ctx.fillRect(Math.round(sx - tw / 2 - 5), Math.round(sy - 9), Math.round(tw + 10), 18);
  ctx.fillStyle = color;
  ctx.fillText(txt, sx, sy + 1);
  ctx.restore();
}

// Progress ring over the player while a purchase is in progress.
function drawVendRing() {
  if (!vendBuy) return;
  const k = Math.min(1, (performance.now() - vendBuy.start) / VEND_BUY_TIME);
  const cx = wx(player.x + PW / 2), cy = wy(player.y) - 38, r = 11;
  ctx.save();
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(5,5,10,0.7)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#4ecca3';
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// Green "+HP" rising above the player (world space). The red "-price" is
// drawn by drawHUD() next to the score.
function drawPlayerFloats() {
  const now = performance.now();
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    if (now - floatTexts[i].born >= VEND_FLOAT_MS) floatTexts.splice(i, 1);
  }
  ctx.save();
  ctx.font = '10px "Press Start 2P"';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineJoin = 'round';
  for (const f of floatTexts) {
    if (f.kind !== 'player') continue;
    const k = (now - f.born) / VEND_FLOAT_MS;
    ctx.globalAlpha = k < 0.5 ? 1 : 1 - (k - 0.5) / 0.5;
    const x = wx(player.x + PW / 2), y = wy(player.y) - 34 - 26 * k;
    ctx.strokeText(f.text, x, y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, x, y);
  }
  ctx.restore();
}

// ─────────────────────────────────────────────────────────
//  DRAW — BACKGROUND
// ─────────────────────────────────────────────────────────
function drawBackground() {
  ctx.imageSmoothingEnabled = false;

  if (bgImg.complete && bgImg.naturalWidth > 0) {
    const scaleX = bgImg.naturalWidth  / WORLD_W;
    const scaleY = bgImg.naturalHeight / WORLD_H;
    ctx.drawImage(
      bgImg,
      Math.round(cam.x * scaleX),
      Math.round(cam.y * scaleY),
      Math.round(VIEW_W * scaleX),
      Math.round(VIEW_H * scaleY),
      0, 0, VIEW_W, VIEW_H
    );
  } else {
    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

// ─────────────────────────────────────────────────────────
//  DRAW — PLAYER
// ─────────────────────────────────────────────────────────
function roundRect(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y); cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r); cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h); cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r); cx.arcTo(x,y,x+r,y,r);
  cx.closePath();
}

// Equipped-weapon sheet for the current skin if it's loaded, else the base
// no-weapon skin sheet — the same "load if present, else fall back" pattern
// used for zombie B/C, just keyed by (skin, weapon) instead of just tier.
function currentPlayerImg() {
  const keys = [currentWeapon, WEAPONS[currentWeapon].spriteFallback];
  for (const wk of keys) {
    if (!wk) continue;
    const img = weaponSkinImgs[`${playerSkin}_${wk}`];
    if (img && img.complete && img.naturalWidth > 0) return img;
  }
  return skinImgs[playerSkin];
}

function drawPlayer() {
  let sx = wx(player.x);
  let sy = wy(player.y);
  // Recoil: nudge the DRAW position opposite the last shot (visual only).
  const recoilAge = performance.now() - lastShot.at;
  if (recoilAge < HIT_FX.recoilMs) {
    sx -= Math.round(Math.cos(lastShot.angle) * HIT_FX.recoilPx);
    sy -= Math.round(Math.sin(lastShot.angle) * HIT_FX.recoilPx);
  }

  // Invulnerability i-frames read as a fast blink after taking a hit.
  const invuln = performance.now() < player.invulnUntil;
  if (invuln && Math.floor(performance.now() / 80) % 2 === 0) return;

  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(sx + PW / 2, sy + PH - 6, PW / 3.2, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.imageSmoothingEnabled = false;

  const _sImg = currentPlayerImg();
  if (_sImg.complete && _sImg.naturalWidth > 0) {
    const moving = player.moving ?? false;
    // Weapon sheets are documented as 2 columns (idle + walk) — no
    // breathe-frame column — while base skin sheets have 3. Read the
    // actual sheet width rather than assuming, so either layout (and any
    // future sheet with a real 3rd column) is handled correctly instead
    // of guessing from which image happened to be picked.
    const cols = Math.max(1, Math.floor(_sImg.naturalWidth / FRAME_W));
    const col  = moving ? player.animFrame : (cols >= 3 && player.idleFrame === 1 ? 2 : 0);
    const srcX = col * FRAME_W;
    const srcY = DIR_ROW[spriteFacing()] * FRAME_H;

    drawNightTinted(_sImg, srcX, srcY, FRAME_W, FRAME_H, sx, sy, PW, PH);
  } else {
    ctx.fillStyle = '#e94560';
    ctx.fillRect(sx + 8, sy, PW - 16, PH * 0.35);
    ctx.fillStyle = '#141c3a';
    ctx.fillRect(sx + 4, sy + PH * 0.35, PW - 8, PH * 0.65);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(ctx, sx + PW / 2 - 26, sy - 22, 52, 16, 2);
  ctx.fill();
  ctx.fillStyle = '#e94560';
  ctx.font = '8px "Press Start 2P"';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(playerName, sx + PW / 2, sy - 14);
}

// ─────────────────────────────────────────────────────────
//  DRAW — ZOMBIE
//  Tier A has real art; B/C fall back to a tier-tinted placeholder rect
//  (same "complete && naturalWidth" pattern room 1's scene objects use)
//  until their sheets exist.
// ─────────────────────────────────────────────────────────
function drawZombie(z) {
  const sx = wx(z.x), sy = wy(z.y);
  const now = performance.now();

  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(sx + PW / 2, sy + PH - 6, PW / 3.2, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.imageSmoothingEnabled = false;

  // Hit shake — random draw offset that decays to 0. The real position
  // (z.x / z.y, knockback, collision) is untouched.
  let shx = 0, shy = 0;
  const shakeAge = now - z.shakeStart;
  if (z.shakeStart && shakeAge < HIT_FX.spriteShakeMs) {
    const a = HIT_FX.spriteShakeAmp * (1 - shakeAge / HIT_FX.spriteShakeMs);
    shx = Math.round((Math.random() * 2 - 1) * a);
    shy = Math.round((Math.random() * 2 - 1) * a);
  }
  const flashing = now < z.flashUntil;

  const img = zombieImgs[z.tier];
  if (img.complete && img.naturalWidth > 0) {
    const srcX = z.animFrame * FRAME_W;
    const srcY = DIR_ROW[z.facing] * FRAME_H;
    if (flashing) drawFlashTinted(img, srcX, srcY, FRAME_W, FRAME_H, sx + shx, sy + shy, PW, PH);
    else          drawNightTinted(img, srcX, srcY, FRAME_W, FRAME_H, sx + shx, sy + shy, PW, PH);
  } else {
    ctx.fillStyle = flashing ? HIT_FX.flashColor : ZOMBIE_TIERS[z.tier].color;
    ctx.fillRect(sx + shx + 10, sy + shy + 6, PW - 20, PH - 24);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(z.tier, sx + shx + PW / 2, sy + shy + PH / 2);
  }

  // HP bar — only once damaged; held, then faded out after the last hit.
  if (z.lastHitAt) {
    const since = now - z.lastHitAt;
    const fadeT = (since - HIT_FX.hpBarHoldMs) / HIT_FX.hpBarFadeMs;
    if (fadeT < 1) {
      const alpha = fadeT <= 0 ? 1 : 1 - fadeT;
      const bx = Math.round(sx + PW / 2 - HIT_FX.hpBarW / 2);
      const by = Math.round(sy + HIT_FX.hpBarYOffset);
      const frac = Math.max(0, Math.min(1, z.hp / z.maxHp));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = HIT_FX.hpBarBg;
      ctx.fillRect(bx - 1, by - 1, HIT_FX.hpBarW + 2, HIT_FX.hpBarH + 2);
      ctx.fillStyle = HIT_FX.hpBarFill;
      ctx.fillRect(bx, by, Math.round(HIT_FX.hpBarW * frac), HIT_FX.hpBarH);
      ctx.restore();
    }
  }
}

// ── Blood decals — ground splats, drawn under every entity ──
function drawBloodDecals() {
  const now = performance.now();
  for (let i = bloodDecals.length - 1; i >= 0; i--) {
    if (now - bloodDecals[i].born >= HIT_FX.decalFadeMs) bloodDecals.splice(i, 1);
  }
  if (!bloodDecals.length) return;
  ctx.save();
  for (const d of bloodDecals) {
    const age = (now - d.born) / HIT_FX.decalFadeMs;
    ctx.fillStyle = `rgba(${HIT_FX.decalColor},${(HIT_FX.decalAlpha * (1 - age)).toFixed(3)})`;
    const bx = wx(d.x), by = wy(d.y);
    for (const b of d.blobs) ctx.fillRect(bx + b.ox, by + b.oy, b.s, Math.max(2, Math.round(b.s * 0.6)));
  }
  ctx.restore();
}

// ── Blood particles + damage numbers — drawn on top, after the entities ──
function drawBloodParticles() {
  const now = performance.now();
  for (let i = bloodParticles.length - 1; i >= 0; i--) {
    if (now - bloodParticles[i].born >= bloodParticles[i].life) bloodParticles.splice(i, 1);
  }
  if (!bloodParticles.length) return;
  ctx.save();
  for (const p of bloodParticles) {
    const age = now - p.born;
    const x = p.x0 + p.vx * age;
    const y = p.y0 + p.vy * age + 0.5 * (p.g != null ? p.g : HIT_FX.particleGravity) * age * age;
    const k = age / p.life;
    ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    ctx.fillStyle = p.color;
    ctx.fillRect(wx(x), wy(y), p.size, p.size);
  }
  ctx.restore();
}

function drawDamageNumbers() {
  const now = performance.now();
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    if (now - damageNumbers[i].lastHit >= HIT_FX.numRiseMs) damageNumbers.splice(i, 1);
  }
  if (!damageNumbers.length) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const d of damageNumbers) {
    const rise = HIT_FX.numRisePx * (1 - Math.pow(1 - Math.min(1, (now - d.born) / HIT_FX.numRiseMs), 2));
    const fadeK = (now - d.lastHit) / HIT_FX.numRiseMs;
    const alpha = fadeK < 0.35 ? 1 : 1 - (fadeK - 0.35) / 0.65;
    const popK = Math.max(0, 1 - (now - d.popAt) / HIT_FX.numPopMs);
    const scale = 1 + d.popAmt * popK;
    const x = wx(d.z.x + PW / 2);
    const y = wy(d.z.y) + HIT_FX.numYOffset - rise;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.font = d.kill ? HIT_FX.numKillFont : HIT_FX.numFont;
    const txt = String(Math.max(1, Math.round(d.value)));
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineJoin = 'round';
    ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = d.kill ? HIT_FX.numKillColor : HIT_FX.numColor;
    ctx.fillText(txt, 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

// Procedural pixel muzzle flash — a small blocky burst pointing along the aim.
function drawMuzzleSprite(e, t) {
  const sx = wx(e.x), sy = wy(e.y);
  const L = HIT_FX.muzzleLen * (e.big ? HIT_FX.muzzleScaleMulti : 1) * (1 - t * 0.35);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(e.angle);
  ctx.globalAlpha = 1 - t * 0.6;
  // outer flame, mid flame, white-hot core — stacked pixel rects
  ctx.fillStyle = '#ff9a2e'; ctx.fillRect(0, -5, Math.round(L), 10);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(0, -3, Math.round(L * 0.75), 6);
  ctx.fillStyle = '#fffbe0'; ctx.fillRect(0, -1, Math.round(L * 0.45), 2);
  // side spikes
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(Math.round(L * 0.2), -9, 4, 4);
  ctx.fillRect(Math.round(L * 0.2),  5, 4, 4);
  ctx.restore();
}

// ─────────────────────────────────────────────────────────
//  DRAW — COMBAT FX (procedural — tracer/muzzle-flash + death burst)
// ─────────────────────────────────────────────────────────
// Tracers fired while the player was facing 'up' are drawn separately, in
// render() BEFORE the player sprite (so they land behind it) — everything
// else (every other tracer, plus the death burst) still draws here, after
// everything, on top, exactly as before.
function drawEffects() {
  const now = performance.now();
  for (const e of effects) {
    const t = Math.min(1, (now - e.start) / e.duration);
    if (e.type === 'tracer') {
      if (e.facing === 'up') continue;
      drawTracerEffect(e, t);
    } else if (e.type === 'death') {
      drawDeathEffect(e, t);
    }
  }
  if (hoseBeam.facing !== 'up') drawHoseBeam();
  drawBloodParticles();
  drawDamageNumbers();
}

function drawUpFacingTracers() {
  const now = performance.now();
  if (hoseBeam.facing === 'up') drawHoseBeam(); // behind the player when aiming up
  for (const e of effects) {
    if (e.facing !== 'up') continue;
    const t = Math.min(1, (now - e.start) / e.duration);
    if (e.type === 'tracer') drawTracerEffect(e, t);
  }
}

// Muzzle flashes (the flash sprite, and the radial burst that goes with each tracer) are
// depth-sorted in render() with the shooter: just in front of the player sprite, or just
// behind it when the shot was fired facing up — so anything that is in front of the
// player (a pole, a building edge) hides the flash too.
function muzzleFlashSortY(e) {
  return (e.baseY != null ? e.baseY : playerBaseY()) + (e.facing === 'up' ? -0.5 : 0.5);
}

// A tracer is up to three pieces:
//  • line  — single-target weapons. On a hit it runs muzzle → middle of the
//    hit zombie's sprite and is drawn from the depth-sorted render list just
//    behind that zombie (drawTracerLine, called by render()); on a miss it
//    runs the full range along the aim angle, drawn with the rest of the FX.
//  • cone  — shotgun only: one soft light wedge matching coneDeg/range.
//  • flash — small muzzle burst at the origin (all weapons).
function tracerHitTargetPos(e) {
  return { x: e.target.x + PW / 2, y: e.target.y + PH * TRACER_HIT_TARGET_Y };
}

function drawTracerLine(e, t) {
  const sx = wx(e.x), sy = wy(e.y);
  let ex, ey;
  if (e.target) {
    const p = tracerHitTargetPos(e);
    ex = wx(p.x); ey = wy(p.y);
  } else if (e.hitPos) {
    // Static target (the secret hydrant): ends in the middle of its sprite.
    ex = wx(e.hitPos.x); ey = wy(e.hitPos.y);
  } else {
    ex = sx + Math.cos(e.angle) * e.dist;
    ey = sy + Math.sin(e.angle) * e.dist;
  }
  ctx.save();
  ctx.strokeStyle = e.hit ? '#f9c74f' : 'rgba(249,199,79,0.5)';
  ctx.lineWidth = 2;
  ctx.globalAlpha = 1 - t;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.restore();
}

function drawShotgunCone(e, t) {
  const sx = wx(e.x), sy = wy(e.y);
  const halfCone = ((e.coneDeg || 0) * Math.PI / 180) / 2;
  const range = e.range || e.dist;
  const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, range);
  grad.addColorStop(0, `rgba(${SHOTGUN_CONE_COLOR},${SHOTGUN_CONE_ALPHA})`);
  grad.addColorStop(1, `rgba(${SHOTGUN_CONE_COLOR},0)`);
  ctx.save();
  ctx.globalAlpha = 1 - t;
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.arc(sx, sy, range, e.angle - halfCone, e.angle + halfCone);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawMuzzleFlash(e, t) {
  const sx = wx(e.x), sy = wy(e.y);
  const base = MUZZLE_FLASH_RADIUS * (e.multiHit ? SHOTGUN_FLASH_SCALE : 1);
  const flashR = base * (1 - t) + 2;
  ctx.save();
  ctx.globalAlpha = 1 - t;
  const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, flashR);
  grad.addColorStop(0, 'rgba(255,240,180,0.9)');
  grad.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(sx, sy, flashR, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Everything about a tracer EXCEPT a hit's line (that one is drawn from the
// depth-sorted render list so it sits behind the zombie it hit).
function drawTracerEffect(e, t) {
  if (e.multiHit) drawShotgunCone(e, t);
  else if (!e.target && !e.hitPos) drawTracerLine(e, t); // hit lines are drawn depth-sorted by render()
  // (the muzzle flash is depth-sorted in render() — see muzzleFlashSortY)
}

function drawDeathEffect(e, t) {
  const sx = wx(e.x), sy = wy(e.y);
  const alpha = 1 - t;
  const scale = e.scale ?? 1; // shrinks the whole burst for the lighter non-lethal-hit variant
  const spread = (6 + t * 26) * scale;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#7a1f1f';
  const spokes = 6;
  for (let i = 0; i < spokes; i++) {
    const a = (i / spokes) * Math.PI * 2;
    const px = sx + Math.cos(a) * spread;
    const py = sy + Math.sin(a) * spread * 0.6;
    const r = (5 * (1 - t) + 1.5) * scale;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(40,10,10,0.6)';
  ctx.beginPath();
  ctx.ellipse(sx, sy, spread * 0.7, spread * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ─────────────────────────────────────────────────────────
//  DRAW — WAVE BANNER
// ─────────────────────────────────────────────────────────
function drawWaveBanner() {
  const cx = VIEW_W / 2, cy = CROP_TOP + VIEW_H_DYN / 2;

  if (waveState === 'INTRO') {
    const t = (performance.now() - waveStateSince) / WAVE_INTRO_DURATION;
    const alpha = t < 0.15 ? t / 0.15 : t > 0.8 ? (1 - t) / 0.2 : 1;
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.fillStyle = 'rgba(5,5,10,0.4)';
    ctx.fillRect(0, cy - 40, VIEW_W, 80);
    ctx.fillStyle = '#e94560';
    ctx.font = '22px "Press Start 2P"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`WAVE ${waveNumber}`, cx, cy);
    ctx.globalAlpha = 1;
  } else if (waveState === 'CLEAR') {
    const remain = Math.max(0, WAVE_CLEAR_DURATION - (performance.now() - waveStateSince));
    ctx.fillStyle = 'rgba(5,5,10,0.4)';
    ctx.fillRect(0, cy - 30, VIEW_W, 60);
    ctx.fillStyle = '#4ecca3';
    ctx.font = '14px "Press Start 2P"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`WAVE ${waveNumber} CLEARED`, cx, cy - 12);
    ctx.font = '9px "Press Start 2P"';
    ctx.fillText(`NEXT WAVE IN ${Math.ceil(remain / 1000)}...`, cx, cy + 12);
  }

  if (scorePopup) {
    const t = (performance.now() - scorePopup.start) / SCORE_POPUP_DURATION;
    if (t >= 1) {
      scorePopup = null;
    } else {
      // Floats up from just above the banner while fading out.
      ctx.globalAlpha = Math.max(0, Math.min(1, t > 0.6 ? (1 - t) / 0.4 : 1));
      ctx.fillStyle = '#f9c74f';
      ctx.font = '18px "Press Start 2P"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(scorePopup.text, cx, cy - 50 - 40 * t);
      ctx.globalAlpha = 1;
    }
  }

  if (weaponUnlockNotice) {
    const t = (performance.now() - weaponUnlockNotice.start) / WEAPON_UNLOCK_NOTICE_DURATION;
    if (t >= 1) {
      weaponUnlockNotice = null;
    } else {
      const alpha = t < 0.1 ? t / 0.1 : t > 0.75 ? (1 - t) / 0.25 : 1;
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.fillStyle = 'rgba(5,5,10,0.5)';
      ctx.fillRect(0, cy + 44, VIEW_W, 46);
      ctx.fillStyle = '#f9c74f';
      ctx.font = '13px "Press Start 2P"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`WEAPON UNLOCKED: ${weaponUnlockNotice.label}`, cx, cy + 67);
      ctx.globalAlpha = 1;
    }
  }
}

// ─────────────────────────────────────────────────────────
//  DRAW — HUD
// ─────────────────────────────────────────────────────────
function drawHUD() {
  const screenBtm = CROP_TOP + VIEW_H_DYN;
  ctx.fillStyle = 'rgba(5,5,10,0)';
  ctx.fillRect(0, CROP_TOP, VIEW_W, 20);
  ctx.fillStyle = '#e94560';
  ctx.font = '9px "Press Start 2P"';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('▸ ZOMBIE STREET', 8, CROP_TOP + 10);

  ctx.textAlign = 'right';
  const remaining = zombies.length + Math.max(0, waveTotalCount - waveSpawnedCount);
  ctx.fillText(`WAVE ${waveNumber}  ·  ${remaining} LEFT`, VIEW_W - 8, CROP_TOP + 10);

  // Second HUD row — HP bar (left) + score (right)
  const rowY = CROP_TOP + 26;
  const barW = 100, barH = 10;
  const shownHp = displayedHp(performance.now());
  const hpFrac = Math.max(0, shownHp / PLAYER_MAX_HP);
  ctx.fillStyle = 'rgba(20,5,10,0.7)';
  ctx.fillRect(8, rowY, barW, barH);
  ctx.fillStyle = hpFrac > 0.35 ? '#4ecca3' : '#e94560';
  ctx.fillRect(8, rowY, barW * hpFrac, barH);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
  ctx.strokeRect(8, rowY, barW, barH);
  ctx.fillStyle = '#e0e0e0';
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`${Math.ceil(shownHp)}/${PLAYER_MAX_HP}`, 8 + barW + 8, rowY + barH / 2 + 1);

  // SCORE — top center, ~2× the other HUD text, gold, with a dark outline so
  // it reads over the street. (Clear of the left title / right WAVE text and
  // the NO-HEAL tag on the left — the HUD scales as one 1537-wide layer.)
  const scoreX = VIEW_W / 2, scoreY = CROP_TOP + 22;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '16px "Press Start 2P"';
  ctx.lineJoin = 'round'; ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(5,5,10,0.85)';
  ctx.strokeText(`SCORE ${score}`, scoreX, scoreY);
  ctx.fillStyle = '#f9c74f';
  ctx.fillText(`SCORE ${score}`, scoreX, scoreY);

  // Red "-price" dropping from under the score after a purchase.
  {
    const nowH = performance.now();
    for (const f of floatTexts) {
      if (f.kind !== 'hud') continue;
      const k = (nowH - f.born) / VEND_FLOAT_MS;
      if (k >= 1) continue;
      ctx.globalAlpha = k < 0.4 ? 1 : 1 - (k - 0.4) / 0.6;
      ctx.font = '12px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(5,5,10,0.85)';
      const fy = scoreY + 22 + 18 * k;
      ctx.strokeText(f.text, scoreX, fy);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, scoreX, fy);
      ctx.globalAlpha = 1;
    }
  }

  // NO-HEAL tag — shown while the bonus is still alive (no potion bought yet).
  if (potionsBoughtThisRun === 0) {
    ctx.fillStyle = '#4ecca3';
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'left';
    ctx.fillText(`NO-HEAL +${Math.round(NO_HEAL_BONUS_FRACTION * 100)}%`, 8, rowY + barH + 10);
  }

  // Mobile weapon row (DOM) — kept in sync every frame; cheap, it only touches the DOM on change.
  updateWeaponRow(performance.now());

  // Bottom-left weapon readout. Desktop only: on touch devices the DOM weapon row replaces it.
  // (font set explicitly — it used to inherit whatever the HUD code above drew last)
  if (!touchUiMQ.matches) {
    ctx.font = '9px "Press Start 2P"';
    const _r = weaponReadout(performance.now());
    const _isHose = _r.hose;
    const _labelW = ctx.measureText(_r.label).width;
    const _hint = 'Q SWITCH · R RELOAD';
    ctx.font = '7px "Press Start 2P"';
    const _hintW = ctx.measureText(_hint).width;
    ctx.font = '9px "Press Start 2P"';
    const _mainW = _isHose ? 230 : Math.max(140, 8 + _labelW + (_r.txt ? 8 + ctx.measureText(_r.txt).width : 0) + 8);
    ctx.fillStyle = 'rgba(5,5,10,0.55)';
    ctx.fillRect(0, screenBtm - 20, _mainW + 10 + _hintW + 8, 20);
    ctx.fillStyle = '#f9c74f';
    ctx.textAlign = 'left';
    ctx.fillText(_r.label, 8, screenBtm - 10);
    if (_r.txt) {
      ctx.globalAlpha = _r.alpha;
      ctx.fillStyle = _r.color;
      ctx.fillText(_r.txt, 8 + _labelW + 8, screenBtm - 10);
      ctx.globalAlpha = 1;
    }
    if (_isHose) {
      // Water tank bar next to the weapon name (marker at the sputter-recovery level).
      const bx = 8 + _labelW + 8, by = screenBtm - 15, bw = 76, bh = 9;
      ctx.fillStyle = 'rgba(10,20,40,0.8)'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = hose.sputter ? '#5c7a99' : '#4aa3ff';
      ctx.fillRect(bx, by, Math.round(bw * hose.tank / HOSE_TANK_MAX), bh);
      ctx.strokeStyle = 'rgba(190,230,255,0.7)'; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
      const mxk = Math.round(bx + bw * HOSE_SPUTTER_RECOVER / HOSE_TANK_MAX);
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(mxk, by, 1, bh);
    }
    // Dim key hint after the readout.
    ctx.font = '7px "Press Start 2P"';
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#f9c74f';
    ctx.fillText(_hint, _mainW + 10, screenBtm - 10);
    ctx.globalAlpha = 1;
  }

  if (gameStarted) drawWaveBanner();
}

// Faint dotted line + small reticle from the muzzle along aimAngle. Only while
// aiming with the right stick or the mouse (not in the release window, not
// keyboard-only play).
function drawAimLine() {
  if (gameOver || tapPromptActive) return;
  if (aim.mode !== 'stick' && aim.mode !== 'mouse') return;
  const m = muzzlePoint();
  const sx = wx(m.x), sy = wy(m.y);
  const ex = sx + Math.cos(player.aimAngle) * AIM_LINE_LENGTH;
  const ey = sy + Math.sin(player.aimAngle) * AIM_LINE_LENGTH;
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.setLineDash([1, 9]);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ─────────────────────────────────────────────────────────
//  MAIN RENDER — Y-sort by baseY, same as room 1
// ─────────────────────────────────────────────────────────
function render() {
  updateBuyButton();
  updateSecretFx(performance.now());
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  ctx.imageSmoothingEnabled = false;

  // Screen shake: the whole world layer is nudged; the HUD (drawn after the
  // restore below) stays put.
  ctx.save();
  const shk = currentShakeOffset();
  ctx.translate(shk.x, shk.y);

  drawBackground();
  drawVendingGlow();  // ground glow in front of the machine — under every entity
  drawBloodDecals(); // ground splats — under every entity
  drawEjecta(true);  // dropped mags / shells that have landed — also under every entity

  drawAimLine(); // faint indicator — under every entity, zombies included

  // Tracers fired while facing up are drawn here, before drawPlayer() runs
  // below (via the Y-sorted renderList), so they land behind the player.
  drawUpFacingTracers();

  const renderList = [];
  for (const obj of sceneObjects) {
    renderList.push({
      baseY: obj.baseY,
      fn: () => {
        const sx = wx(obj.x), sy = wy(obj.y);
        if (sx + obj.w < 0 || sx > VIEW_W || sy + obj.h < 0 || sy > VIEW_H) return;
        ctx.imageSmoothingEnabled = false;
        if (obj.img && obj.img.complete && obj.img.naturalWidth > 0) {
          if (obj.tint)        drawNightTinted(obj.img, 0, 0, obj.img.naturalWidth, obj.img.naturalHeight, sx, sy, obj.w, obj.h);
          else if (obj.secret) drawSecretHydrant(obj, sx, sy);
          else                 ctx.drawImage(obj.img, sx, sy, obj.w, obj.h);
        } else {
          obj.draw(ctx, sx, sy);
        }
      }
    });
  }
  renderList.push({ baseY: playerBaseY(), fn: drawPlayer });
  if (hosePickup) renderList.push({ baseY: hosePickup.y + 16, fn: drawHosePickup });
  for (const z of zombies) {
    renderList.push({ baseY: zombieBaseY(z), fn: () => drawZombie(z) });
  }
  // A hit's tracer line ends inside the zombie's body, so it's slotted just
  // BEHIND that zombie (even one that this very hit killed — its last
  // position is still on the effect's target).
  {
    const nowT = performance.now();
    for (const e of effects) {
      if (e.type !== 'tracer' || (!e.target && !e.hitPos)) continue;
      const t = Math.min(1, (nowT - e.start) / e.duration);
      renderList.push({ baseY: (e.target ? zombieBaseY(e.target) : e.hitBaseY) - 0.5, fn: () => drawTracerLine(e, t) });
    }
  }
  // Muzzle flashes sort with the shooter (see muzzleFlashSortY).
  {
    const nowF = performance.now();
    for (const e of effects) {
      if (e.type !== 'muzzle' && e.type !== 'tracer') continue;
      const t = Math.min(1, (nowF - e.start) / e.duration);
      renderList.push({
        baseY: muzzleFlashSortY(e),
        fn: e.type === 'muzzle' ? () => drawMuzzleSprite(e, t) : () => drawMuzzleFlash(e, t),
      });
    }
  }
  renderList.sort((a, b) => a.baseY - b.baseY);
  for (const item of renderList) item.fn();

  // Combat FX draw on top of everything — transient, screen-space overlay.
  drawEffects();
  drawEjecta(false); // mags / shells still in the air
  drawVendingLabel();
  drawVendRing();
  drawReloadRing();
  drawPlayerFloats();

  ctx.restore(); // end of the shaken world layer

  // ── DEBUG OVERLAY (press ` backtick to toggle) — for tuning the
  // invisible building colliders against the painted background art. ──
  if (debugOn) {
    // World-space coordinate grid (every 100px) — for reading off exact
    // building-edge coordinates against the painted art while tuning.
    ctx.strokeStyle = 'rgba(255,255,0,0.25)'; ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(255,255,0,0.6)'; ctx.font = '9px monospace';
    const gStartX = Math.floor(cam.x / 100) * 100;
    const gStartY = Math.floor(cam.y / 100) * 100;
    for (let gx = gStartX; gx < cam.x + VIEW_W; gx += 100) {
      ctx.beginPath(); ctx.moveTo(wx(gx), 0); ctx.lineTo(wx(gx), VIEW_H); ctx.stroke();
      ctx.fillText(String(gx), wx(gx) + 2, 12);
    }
    for (let gy = gStartY; gy < cam.y + VIEW_H; gy += 100) {
      ctx.beginPath(); ctx.moveTo(0, wy(gy)); ctx.lineTo(VIEW_W, wy(gy)); ctx.stroke();
      ctx.fillText(String(gy), 2, wy(gy) + 10);
    }
    for (const obj of sceneObjects) {
      if (!obj.collision) continue;
      const cxp = wx(obj.collision.x), cyp = wy(obj.collision.y);
      ctx.fillStyle = 'rgba(255,40,40,0.18)';
      ctx.fillRect(cxp, cyp, obj.collision.w, obj.collision.h);
      ctx.strokeStyle = 'rgba(255,40,40,0.9)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(cxp, cyp, obj.collision.w, obj.collision.h);
      ctx.fillStyle = '#39ff14'; ctx.font = '11px monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(obj.id, cxp + 3, cyp + 3);
    }
    const pf = playerFeetRect();
    ctx.strokeStyle = 'cyan'; ctx.lineWidth = 1.5;
    ctx.strokeRect(wx(pf.x), wy(pf.y), pf.w, pf.h);
    ctx.fillStyle = '#4ecca3'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`WORLD ${WORLD_W}x${WORLD_H}  PLAYER (${Math.round(player.x)},${Math.round(player.y)})`, 6, 24);
    ctx.fillText(`WAVE state=${waveState} spawned=${waveSpawnedCount}/${waveTotalCount} zombies=${zombies.length}  [K]=clear wave`, 6, 38);
    ctx.fillText(`WEAPON=${currentWeapon} aimDir=${player.aimDir} aimAngle=${(player.aimAngle * 180 / Math.PI).toFixed(0)}° aimFacing=${player.aimFacing} unlocked=[${[...unlockedWeapons].join(',')}]`, 6, 52);
    ctx.fillText(`HP=${player.hp.toFixed(1)}/${PLAYER_MAX_HP} invuln=${performance.now() < player.invulnUntil} SCORE=${score}  [H]=-25hp`, 6, 66);

    // Aim cone — shows the exact hitscan wedge for the current weapon.
    const w = WEAPONS[currentWeapon];
    const aimAngle = player.aimAngle;
    const half = (w.coneDeg * Math.PI / 180) / 2;
    const ox = wx(player.x + PW / 2), oy = wy(player.y + FEET_OY + FEET_H / 2);
    ctx.strokeStyle = 'rgba(249,199,79,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + Math.cos(aimAngle - half) * w.range, oy + Math.sin(aimAngle - half) * w.range);
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + Math.cos(aimAngle + half) * w.range, oy + Math.sin(aimAngle + half) * w.range);
    ctx.stroke();

    for (const z of zombies) {
      const zsx = wx(z.x), zsy = wy(z.y);
      ctx.strokeStyle = 'rgba(255,150,0,0.8)'; ctx.lineWidth = 1;
      ctx.strokeRect(zsx + FEET_MARGIN, zsy + FEET_OY, PW - FEET_MARGIN * 2, FEET_H);
      ctx.fillStyle = '#ff9600'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
      ctx.fillText(z.tier, zsx + PW / 2, zsy - 6);
    }
  }

  drawHUD();
}

// ─────────────────────────────────────────────────────────
//  ROOM 1 → ROOM 2 INTRO TRANSITION — reverse pixelation dissolve
//  The other half of room 1's exit effect: starts at maximum block size
//  and resolves down to full resolution over ~500ms, using the same
//  downsample/upscale-with-smoothing-off technique.
// ─────────────────────────────────────────────────────────
const transitionCanvas = document.getElementById('transitionCanvas');
const tCtx             = transitionCanvas.getContext('2d');

function playIntroPixelation(onComplete) {
  const w = canvas.width, h = canvas.height;

  const snapshot = document.createElement('canvas');
  snapshot.width = w; snapshot.height = h;
  snapshot.getContext('2d').drawImage(canvas, 0, 0);

  transitionCanvas.width        = w;
  transitionCanvas.height       = h;
  transitionCanvas.style.width  = canvas.style.width;
  transitionCanvas.style.height = canvas.style.height;
  transitionCanvas.style.left   = canvas.style.left;
  transitionCanvas.style.top    = canvas.style.top;
  transitionCanvas.style.opacity = '1';

  const offscreen = document.createElement('canvas');
  const offCtx    = offscreen.getContext('2d');

  const DURATION   = 520;  // ms — within the 400-600ms target window
  const START_MULT = 46;   // begins very blocky
  const END_MULT   = 1;    // resolves to full resolution
  const OVERSCAN   = 24;   // px padding so jitter never reveals an edge
  const startTime  = performance.now();

  function step(now) {
    const t = Math.min(1, (now - startTime) / DURATION);

    const mult  = START_MULT + (END_MULT - START_MULT) * t;
    const downW = Math.max(1, Math.round(w / mult));
    const downH = Math.max(1, Math.round(h / mult));
    offscreen.width  = downW;
    offscreen.height = downH;
    offCtx.imageSmoothingEnabled = false;
    offCtx.drawImage(snapshot, 0, 0, downW, downH);

    // Jitter fades out as the image resolves, settling instead of
    // snapping cleanly into focus.
    const jitterMag = 8 * (1 - t);
    const jx = (Math.random() - 0.5) * jitterMag;
    const jy = (Math.random() - 0.5) * jitterMag;

    tCtx.imageSmoothingEnabled = false;
    tCtx.clearRect(0, 0, w, h);
    tCtx.drawImage(
      offscreen, 0, 0, downW, downH,
      -OVERSCAN / 2 + jx, -OVERSCAN / 2 + jy, w + OVERSCAN, h + OVERSCAN
    );

    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      transitionCanvas.style.opacity = '0';
      if (onComplete) onComplete();
    }
  }
  requestAnimationFrame(step);
}

// ─────────────────────────────────────────────────────────
//  RESPONSIVE SIZING — same approach as index.html's resizeGame()
// ─────────────────────────────────────────────────────────
function resizeGame() {
  const dpr = window.devicePixelRatio || 1;
  const vp = window.visualViewport;
  SCREEN_W = vp ? vp.width  : window.innerWidth;
  SCREEN_H = vp ? vp.height : window.innerHeight;

  const scale = SCREEN_W / VIEW_W;
  const cssH  = VIEW_H * scale;

  canvas.style.width  = SCREEN_W + 'px';
  canvas.style.height = cssH + 'px';
  canvas.style.left   = '0';
  canvas.style.top    = ((SCREEN_H - cssH) / 2) + 'px';

  canvas.width  = Math.round(SCREEN_W * dpr);
  canvas.height = Math.round(cssH * dpr);

  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;

  // Mobile weapon row text = canvas HUD text size: 9 canvas px × this scale.
  document.documentElement.style.setProperty('--hud-scale', scale.toFixed(4));

  VIEW_H_DYN = Math.min(VIEW_H, SCREEN_H / scale);
  CROP_TOP   = (VIEW_H - VIEW_H_DYN) / 2;
}

window.addEventListener('resize', resizeGame);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resizeGame);
}
resizeGame();
setTimeout(resizeGame, 100);

// ─────────────────────────────────────────────────────────
//  GAME OVER — overlay wiring, score submission, leaderboard, reset
// ─────────────────────────────────────────────────────────
const goOverlay      = document.getElementById('gameover-overlay');
const goScoreEl      = document.getElementById('go-score');
const goGrossEl      = document.getElementById('go-gross');
const goSpentRow     = document.getElementById('go-spent-row');
const goSpentEl      = document.getElementById('go-spent');
const goBonusRow     = document.getElementById('go-bonus-row');
const goBonusEl      = document.getElementById('go-bonus');
const goWaveEl       = document.getElementById('go-wave');
const goNameWrap     = document.getElementById('go-name-wrap');
const goNameInput    = document.getElementById('go-name-input');
const goNameStatic   = document.getElementById('go-name-static');
const goSubmitBtn    = document.getElementById('go-submit-btn');
const goSubmitStatus = document.getElementById('go-submit-status');
const goBoardBody    = document.getElementById('go-board-body');
const goResult       = document.getElementById('go-result');
const goClaim        = document.getElementById('go-claim');
const goClaimForm    = document.getElementById('go-claim-form');
const goClaimInput   = document.getElementById('go-claim-input');
const goClaimError   = document.getElementById('go-claim-error');
const goClaimLink    = document.getElementById('go-claim-link');
const goClaimSkip    = document.getElementById('go-claim-skip');
const goClaimOk      = document.getElementById('go-claim-ok');
const goPlayAgainBtn = document.getElementById('go-playagain-btn');
const goCribBtn      = document.getElementById('go-crib-btn');

let goSubmitted = false;
let goSession   = 0;   // bumped on every overlay open/close so late async results are dropped
let goShownAt   = 0;   // performance.now() when the overlay opened (for the score_coins timing)
let goAckTimer  = 0;
let goLastRun = null; // { rowId, score, name } of the submitted run, for the contact link
let goLastTab = 'weekly'; // board tab shown after submit, reused when the claim re-renders it

function renderLeaderboard(opts) {
  TanaBoard.render(goBoardBody, opts || {});
}

// Contact check: a plausible email, or a phone of 7–15 digits (spaces, dashes,
// parentheses and a leading + allowed). Returns the trimmed contact or null.
function parseContact(raw) {
  const v = String(raw || '').trim();
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return v;
  if (/^\+?[\d\s\-()]+$/.test(v)) {
    const digits = v.replace(/\D/g, '').length;
    if (digits >= 7 && digits <= 15) return v;
  }
  return null;
}

function showClaimPrompt() {
  goClaim.style.display = 'block';
  goClaimForm.style.display = '';
  goClaimOk.style.display = 'none';
  goClaimError.textContent = '';
  goClaimLink.disabled = goClaimSkip.disabled = false;
  goClaimInput.value = TanaBoard.getContact(); // prefilled from room 1 / an earlier run
}

function showPlacement(rankWeek, rankAll) {
  const topWeek = rankWeek != null && rankWeek <= 10;
  const topAll  = rankAll  != null && rankAll  <= 10;
  goResult.textContent = '';
  const line = (cls, text) => {
    const d = document.createElement('div'); d.className = cls; d.textContent = text; goResult.appendChild(d);
  };
  if (topWeek || topAll) {
    if (topWeek) line('go-ack-big', `NEW #${rankWeek} THIS WEEK!`);
    if (topAll)  line('go-ack-big', topWeek ? `#${rankAll} ALL TIME` : `NEW #${rankAll} ALL TIME!`);
    // score_coins is also the score count-up's sound (1 voice) — wait for it to finish.
    const wait = Math.max(0, goShownAt + GO_COUNT_DELAY + GO_COUNT_DURATION - performance.now());
    clearTimeout(goAckTimer);
    goAckTimer = setTimeout(() => TanaAudio.play('score_coins'), wait);
    showClaimPrompt();
  } else if (rankWeek != null || rankAll != null) {
    const parts = [];
    if (rankWeek != null) parts.push(`#${rankWeek} THIS WEEK`);
    if (rankAll  != null) parts.push(`#${rankAll} ALL TIME`);
    line('go-ack-plain', 'YOU PLACED ' + parts.join(' · '));
  }
  goResult.style.display = goResult.childNodes.length ? 'block' : 'none';
}

async function doSubmit(name) {
  if (goSubmitted) return;
  goSubmitted = true;
  const session = goSession;
  goSubmitBtn.disabled = true;
  goSubmitStatus.textContent = 'SUBMITTING...';
  const finalScore = score, finalWave = waveNumber;
  let rowId;
  try {
    rowId = await TanaBoard.submit({
      name, score: finalScore, wave: finalWave,
      duration_s: runStats.duration_s, kills: runStats.kills, spent: runStats.spent,
    });
  } catch (e) {
    console.error('[ZOMBIE STREET] score submit failed:', e);
    if (session !== goSession) return;
    goSubmitStatus.textContent = 'SUBMIT FAILED — SCORE NOT SAVED';
    return;
  }
  if (session !== goSession) return; // player already hit PLAY AGAIN
  goSubmitStatus.textContent = '✓ SUBMITTED';
  goLastRun = { rowId, score: finalScore, name };

  const [rankWeek, rankAll] = await Promise.all([
    TanaBoard.fetchRank(finalScore, 'weekly'),
    TanaBoard.fetchRank(finalScore, 'alltime'),
  ]);
  if (session !== goSession) return;
  showPlacement(rankWeek, rankAll);
  // Open on the tab where the run placed, so its highlighted row is visible.
  const tab = (rankWeek != null && rankWeek <= 10) || !(rankAll != null && rankAll <= 10) ? 'weekly' : 'alltime';
  goLastTab = tab;
  renderLeaderboard({ highlightId: rowId, tab });
}

goClaimLink.addEventListener('click', async () => {
  TanaAudio.play('ui_click');
  const contact = parseContact(goClaimInput.value);
  if (!contact) {
    goClaimError.textContent = 'ENTER A VALID EMAIL OR PHONE (7-15 DIGITS)';
    return;
  }
  if (!goLastRun) return;
  goClaimError.textContent = '';
  goClaimLink.disabled = goClaimSkip.disabled = true;
  try {
    // Apps Script only — never Supabase (the scores table is public).
    await TanaBoard.linkContact({ ...goLastRun, contact });
    goClaimForm.style.display = 'none';
    goClaimOk.style.display = 'block';
    // Redraw so "YOU" now follows the contact just entered.
    renderLeaderboard({ highlightId: goLastRun.rowId, tab: goLastTab });
  } catch (e) {
    console.error('[ZOMBIE STREET] contact link failed:', e);
    goClaimError.textContent = 'COULD NOT LINK — TRY AGAIN';
    goClaimLink.disabled = goClaimSkip.disabled = false;
  }
});
goClaimSkip.addEventListener('click', () => {
  TanaAudio.play('ui_click');
  goClaim.style.display = 'none';
});

// Score counts up 0 → final over GO_COUNT_DURATION while score_coins plays,
// starting GO_COUNT_DELAY after the overlay appears so ui_open / game_over
// get their moment first.
const GO_COUNT_DURATION = 1200; // ms
const GO_COUNT_DELAY    = 400;  // ms
let goCountRAF = 0, goCountTimer = 0;

function cancelGameOverCount() {
  cancelAnimationFrame(goCountRAF);
  clearTimeout(goCountTimer);
  goCountRAF = goCountTimer = 0;
}

function startGameOverCount(finalScore) {
  cancelGameOverCount();
  if (finalScore <= 0) { goScoreEl.textContent = String(finalScore); return; }
  goScoreEl.textContent = '0';
  goCountTimer = setTimeout(() => {
    goCountTimer = 0;
    TanaAudio.play('score_coins');
    const t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / GO_COUNT_DURATION);
      goScoreEl.textContent = String(Math.round(finalScore * k));
      goCountRAF = k < 1 ? requestAnimationFrame(step) : 0;
    };
    goCountRAF = requestAnimationFrame(step);
  }, GO_COUNT_DELAY);
}

function showGameOverOverlay() {
  // Breakdown: SCORE (gross earned), SPENT or NO-HEAL BONUS, FINAL (counts up).
  goGrossEl.textContent = String(runBreakdown.gross);
  goSpentRow.style.display = runBreakdown.spent > 0 ? '' : 'none';
  goSpentEl.textContent    = '-' + runBreakdown.spent;
  goBonusRow.style.display = runBreakdown.bonus > 0 ? '' : 'none';
  goBonusEl.textContent    = '+' + runBreakdown.bonus;
  startGameOverCount(score);
  goWaveEl.textContent  = String(waveNumber);
  goSubmitted = false;
  goSubmitBtn.disabled = false;
  goSubmitStatus.textContent = '';
  goSession++;
  goShownAt = performance.now();
  clearTimeout(goAckTimer);
  goLastRun = null;
  goResult.style.display = 'none'; goResult.textContent = '';
  goClaim.style.display  = 'none';
  goBoardBody.textContent = '';

  if (hasStoredName) {
    // Already have a name from room 1 — skip straight to submitting.
    goNameWrap.style.display   = 'none';
    goNameStatic.style.display = 'block';
    goNameStatic.textContent   = `PLAYER: ${playerName.toUpperCase()}`;
    goSubmitBtn.style.display  = 'none';
    doSubmit(playerName);
  } else {
    // No stored name — this is the player's second chance to name
    // themselves before their score is submitted.
    goNameWrap.style.display   = 'block';
    goNameStatic.style.display = 'none';
    goSubmitBtn.style.display  = 'block';
    goNameInput.value = '';
  }

  renderLeaderboard();
  goOverlay.classList.add('active');
  TanaAudio.play('ui_open');
}

function hideGameOverOverlay() {
  cancelGameOverCount();
  goSession++;               // drop any submit / rank result still in flight
  clearTimeout(goAckTimer);
  if (!goOverlay.classList.contains('active')) return;
  goOverlay.classList.remove('active');
  TanaAudio.play('ui_close');
}

goSubmitBtn.addEventListener('click', () => {
  TanaAudio.play('ui_click');
  const name = goNameInput.value.trim().replace(/[^a-zA-Z0-9_ ]/g, '').substring(0, 12).toUpperCase() || 'ANON';
  doSubmit(name);
});

function triggerGameOver() {
  if (gameOver) return;
  gameOver = true;
  vendBuy = null;
  cancelWeaponFx();
  if (hose.voice) { hose.voice.stop(80); hose.voice = null; }
  hoseBeam.alpha = 0;
  if (waveStartVoice) { waveStartVoice.stop(); waveStartVoice = null; }
  // NO-HEAL bonus: never bought a potion → +10% on the final score. Applied
  // to `score` BEFORE the overlay shows / submission runs, so FINAL is what
  // gets submitted and ranked on the leaderboard.
  const bonus = potionsBoughtThisRun === 0 ? Math.round(score * NO_HEAL_BONUS_FRACTION) : 0;
  runBreakdown = { gross: score + totalSpent, spent: totalSpent, bonus };
  score += bonus;
  runStats = {
    duration_s: runStartAt ? Math.max(0, Math.round((performance.now() - runStartAt) / 1000)) : 0,
    kills: runKills,
    spent: totalSpent,
  };
  showGameOverOverlay();   // plays ui_open first
  TanaAudio.play('game_over');
}

// Resets everything a fresh run needs — player, zombies, wave, HP, score,
// and weapon unlocks — then starts back at wave 1.
function resetGame() {
  player.x = WORLD_W / 2 - PW / 2;
  player.y = WORLD_H / 2 - PH / 2;
  player.hp = PLAYER_MAX_HP;
  player.invulnUntil = 0;
  player.facing = 'down';
  setAimAngle(Math.PI / 2);
  aim.releaseAt = -1e9; aim.active = aim.wasActive = false; aim.mode = null;
  player.moving = false;

  zombies.length = 0;
  effects.length = 0;
  bloodParticles.length = 0;
  bloodDecals.length = 0;
  damageNumbers.length = 0;
  hitstopUntil = 0;
  screenShake = { amp: 0, start: 0, ms: 0 };
  score = 0;
  waveScoreEarned = 0; scoreEarnedLastWave = 0;
  potionsBoughtThisRun = 0; totalSpent = 0; runKills = 0;
  vendBuy = null; vendLabelErrUntil = 0; floatTexts.length = 0;
  // secret hydrant + hose: new run → hydrant restored, hose gone, tank full
  secretHp = SECRET_HP; secretBroken = false; secretLastHit = 0; secretFlashUntil = 0; secretShakeStart = 0;
  if (secretHydrant) secretHydrant.collision = secretHydrant.origCollision; // solid again
  hosePickup = null; hoseObtained = false;
  hose.tank = HOSE_TANK_MAX; hose.sputter = false; hose.lastSprayAt = -1e9; hose.wasSpraying = false;
  hpAnim = null;
  if (hose.voice) { hose.voice.stop(80); hose.voice = null; }
  hoseBeam.alpha = 0;
  runBreakdown = { gross: 0, spent: 0, bonus: 0 };
  recalcVendPrice();

  currentWeapon = 'pistol';
  unlockedWeapons.clear();
  unlockedWeapons.add('pistol');
  cancelWeaponFx();     // new run: nothing mid-reload, every magazine full, no leftover junk
  refillAllAmmo();
  ejecta.length = 0;
  lastDryFireAt = -1e9;

  gameOver = false;
  gameStarted = true; // in case this fires before the initial startup buffer's setTimeout does
  scorePopup = null;
  hideGameOverOverlay();
  startWave(1);
  scheduleWaveStartSfx(performance.now() + WAVE_INTRO_DURATION);
}

goPlayAgainBtn.addEventListener('click', resetGame);

// Back to room 1. 'tana-return' tells index.html the player is coming back
// from the street (read on that side in the next step).
function goToCrib() {
  try { sessionStorage.setItem('tana-return', '1'); } catch (_) {}
  location.href = '/';
}
goCribBtn.addEventListener('click', () => { TanaAudio.play('ui_click'); goToCrib(); });

// ─────────────────────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────────────────────
let _lastFrameTime = 0;
(function loop(ts) {
  const dt = _lastFrameTime ? Math.min((ts - _lastFrameTime) / 16.667, 3) : 1;
  _lastFrameTime = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
})();
</script>
