<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ZOMBIE STREET</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="TANA.EXE">
  <meta name="theme-color" content="#05050a">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/audio.js"></script>
  <script src="assets/leaderboard.js"></script>
  <script>
    // If audio.js ever fails to load, every TanaAudio call becomes a harmless no-op.
    window.TanaAudio = window.TanaAudio || new Proxy({}, { get: () => () => null });
  </script>
  <style>
    /* ── Touch-control tuning — tweak these ── */
    :root {
      --ctrl-bottom-base: calc(env(safe-area-inset-bottom, 0px) + 70px); /* bottom edge of the left joystick's rest spot, from the bottom */
      --ctrl-side:   16px;   /* inset from the left/right edge (safe-area is added on top) */
      --hud-h:       44px;   /* top strip the floating joystick ignores (HUD + mute button) */
      --joy-zone-w:  45%;    /* touches starting in this left share of the screen drive the joystick */
      --joy-base:    170px;
      --joy-knob:    64px;
      --fire-size:   104px;
      --buy-size:    64px;   /* vending BUY button, left of the aim stick */
      --ctrl-gap:    32px;   /* gap between the BUY button and the aim stick (clears the aim ring's 29px overhang) */
      /* The aim stick's CENTRE mirrors the left joystick rest spot's centre: same distance
         from the bottom (--ctrl-bottom-base + joy/2) and from its screen edge (--ctrl-side + joy/2). */
      --stick-bottom: calc(var(--ctrl-bottom-base) + (var(--joy-base) - var(--fire-size)) / 2);
      --stick-side:   calc(var(--ctrl-side) + (var(--joy-base) - var(--fire-size)) / 2);
      /* Bottom weapon row: bottom offset, and the canvas→CSS scale (set from JS in resizeGame) so
         its text is the same on-screen size as the canvas HUD readout. */
      --row-bottom:  calc(env(safe-area-inset-bottom, 0px) + 10px);
      --hud-scale:   0.55;
    }

    /* Narrow (portrait-width) screens: shrink the left joystick's rest ring so it
       clears the BUY button, and lift both sticks so the held aim ring stays >= 24px
       above the weapon row (the game itself is landscape-only). */
    @media (max-width: 520px) {
      :root {
        --joy-base: 118px;
        --ctrl-bottom-base: calc(env(safe-area-inset-bottom, 0px) + 90px);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; overflow: hidden; }

    body {
      background: #05050a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      color: #e0e0e0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* ── GAME CONTAINER — fills the full viewport edge to edge ── */
    #game-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #05050a;
    }

    /* ── Rotate prompt (portrait mobile only) ── */
    #rotate-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: #05050a;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #rotate-icon { font-size: 48px; animation: spin 2s ease-in-out infinite; }
    @keyframes spin {
      0%,100% { transform: rotate(0deg); }
      50%      { transform: rotate(90deg); }
    }
    #rotate-msg { font-size: 10px; color: #e94560; letter-spacing: 3px; }
    #rotate-sub { font-size: 6px; color: #333355; letter-spacing: 1px; }
    @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
      #rotate-screen { display: flex; }
    }

    canvas {
      display: block;
      position: absolute;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Retro pixelation transition — the reverse of room 1's exit dissolve.
       Covers the game on load and animates away as the scene resolves
       into focus. */
    #transitionCanvas {
      z-index: 90;
      opacity: 0;
      pointer-events: none;
    }

    /* CRT scanlines — same texture as room 1 */
    #game-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px
      );
      pointer-events: none;
      z-index: 50;
    }

    /* ────────────────────────────────────────
       TOUCH CONTROLS  (body-level fixed overlay)
    ──────────────────────────────────────── */
    #touch-ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 15;
    }
    @media (hover: none) and (pointer: coarse) {
      #touch-ui { display: block; }
    }

    /* Floating joystick: #joystick-zone is just the invisible touch catcher
       (left share of the screen, below the HUD). #joystick-base is the
       visible ring — it jumps under the thumb on touch and eases back to
       #joystick-rest (the default bottom-left spot) on release. */
    #joystick-zone {
      position: absolute;
      left: 0; top: var(--hud-h); bottom: 0;
      width: var(--joy-zone-w);
      pointer-events: all;
      touch-action: none;
    }
    #joystick-rest {
      position: absolute;
      bottom: var(--ctrl-bottom-base);
      left:   calc(env(safe-area-inset-left, 0px) + var(--ctrl-side));
      width: var(--joy-base); height: var(--joy-base);
      visibility: hidden;
      pointer-events: none;
    }
    #joystick-base {
      position: absolute;
      left: 0; top: 0;                   /* set from JS */
      width: var(--joy-base); height: var(--joy-base);
      border-radius: 50%;
      background: rgba(233,69,96,0.08);
      border: 2px solid rgba(233,69,96,0.35);
      box-shadow: 0 0 18px rgba(233,69,96,0.18);
      opacity: 0.35;                     /* faint while idle */
      pointer-events: none;
      transition: left 0.15s ease-out, top 0.15s ease-out, opacity 0.15s ease-out;
    }
    #joystick-base.active {
      opacity: 1;
      transition: opacity 0.08s linear;  /* position jumps, only the fade animates */
    }
    #joystick-knob {
      position: absolute;
      width: var(--joy-knob); height: var(--joy-knob);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e94560, #5c1a28);
      border: 2px solid rgba(233,69,96,0.9);
      box-shadow: 0 0 14px rgba(233,69,96,0.5);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }
    #joystick-base.active #joystick-knob { transition: none; }

    /* fire button — bottom-right of viewport (mirrors room 1's interact
       button pattern, relabeled with a crosshair for hold-to-fire) */
    #fire-btn {
      position: absolute;
      bottom: var(--stick-bottom);
      right:  calc(env(safe-area-inset-right, 0px) + var(--stick-side));
      width: var(--fire-size); height: var(--fire-size);
      border-radius: 50%;
      background: rgba(233,69,96,0.09);
      border: 2px solid rgba(233,69,96,0.5);
      display: flex; align-items: center; justify-content: center;
      pointer-events: all; touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, box-shadow 0.08s;
      font-size: 40px; color: #e94560;
    }
    #fire-btn.pressed {
      background: rgba(233,69,96,0.32);
      box-shadow: 0 0 22px rgba(233,69,96,0.55);
    }

    /* Right (aim) stick: the fire button is the stick. While held, #aim-ring
       fades in centred on the button and #aim-knob follows the thumb. The
       ring's size comes from AIM_JOY_MAX in JS (travel radius + knob radius). */
    #aim-ring {
      position: absolute;
      left: 0; top: 0;                   /* set from JS on touch start */
      width: 162px; height: 162px;       /* overwritten from AIM_JOY_MAX in JS */
      border-radius: 50%;
      background: rgba(233,69,96,0.06);
      border: 2px solid rgba(233,69,96,0.4);
      box-shadow: 0 0 18px rgba(233,69,96,0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease-out;
    }
    #aim-ring.active { opacity: 1; transition: opacity 0.08s linear; }
    #aim-knob {
      position: absolute;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e94560, #5c1a28);
      border: 2px solid rgba(233,69,96,0.9);
      box-shadow: 0 0 14px rgba(233,69,96,0.5);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
      transition: transform 0.1s ease-out; /* the spring back on release */
    }
    #aim-ring.active #aim-knob { transition: none; }

    /* Desktop mouse aim: small crosshair cursor over the game. */
    @media (hover: hover) and (pointer: fine) {
      #gameCanvas { cursor: crosshair; }
    }

    /* ── BOTTOM WEAPON ROW (touch only) — three SEPARATE elements, styled like the
       canvas bottom-left readout (dark 55% box, square corners, gold Press Start 2P):
         [⇄ SWITCH]   [PISTOL] 24/32   [↻ RELOAD]
       The text is the same on-screen size as that readout: 9 canvas px × --hud-scale
       (set from JS in resizeGame). Bottom-right corner, below the aim stick (>= 24px clear of the held
       aim ring). Lives after the joystick zone with a z-index, so it sits above it. ── */
    #weapon-row {
      position: absolute;
      right: calc(env(safe-area-inset-right, 0px) + var(--ctrl-side));   /* bottom-right corner, under the aim stick */
      bottom: var(--row-bottom);
      display: flex; align-items: center; gap: 10px;
      z-index: 3;
      pointer-events: none;               /* only the three elements take touches */
      font-family: 'Press Start 2P', monospace;
      font-size: calc(9px * var(--hud-scale));
      color: #f9c74f;
      white-space: nowrap;
    }
    .wr-el {
      position: relative;
      height: 30px; padding: 0 8px;
      display: flex; align-items: center; gap: calc(8px * var(--hud-scale));
      background: rgba(5,5,10,0.55);
      pointer-events: all; touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .wr-el::after { content: ''; position: absolute; inset: -7px -4px; } /* invisible: tap area is 44px tall */
    .wr-btn { border: 1px solid rgba(249,199,79,0.6); transition: background 0.06s; }
    .wr-btn.pressed { background: rgba(249,199,79,0.30); }
    .wr-btn.off { opacity: 0.4; cursor: default; }
    .wr-btn svg { width: 1.25em; height: 1.25em; flex: none; }
    #wr-ammo { cursor: pointer; }
    #wr-count { min-width: 0; }
    #wr-reload.flash span { animation: wrFlash 0.5s steps(1) infinite; color: #ff4d5e; }
    @keyframes wrFlash { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    /* Water tank bar (hose) — the same small bar the canvas readout draws, scaled alike. */
    #wr-tank {
      display: none; position: relative; flex: none;
      width: calc(76px * var(--hud-scale)); height: calc(9px * var(--hud-scale));
      background: rgba(10,20,40,0.8); border: 1px solid rgba(190,230,255,0.7);
    }
    #wr-tank i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #4aa3ff; }
    #wr-tank u { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.45); }

    /* vending BUY button — sits just left of the aim stick.
       Only displayed while the player is within VEND_RANGE of the machine. */
    #buy-btn {
      position: absolute;
      bottom: calc(var(--stick-bottom) + (var(--fire-size) - var(--buy-size)) / 2);
      right:  calc(env(safe-area-inset-right, 0px) + var(--stick-side) + var(--fire-size) + var(--ctrl-gap));
      width: var(--buy-size); height: var(--buy-size);
      border-radius: 50%;
      background: rgba(78,204,163,0.10);
      border: 2px solid rgba(78,204,163,0.6);
      display: none; align-items: center; justify-content: center;
      pointer-events: all; touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, box-shadow 0.08s, opacity 0.15s;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px; color: #4ecca3;
      text-align: center;
    }
    #buy-btn.show { display: flex; }
    #buy-btn.cant { opacity: 0.45; }
    #buy-btn.pressed {
      background: rgba(78,204,163,0.32);
      box-shadow: 0 0 22px rgba(78,204,163,0.55);
    }

    /* ────────────────────────────────────────
       GAME OVER — score submission + leaderboard
    ──────────────────────────────────────── */
    #gameover-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(5,5,10,0.92);
      display: none; align-items: center; justify-content: center;
      padding: max(env(safe-area-inset-top,0px),20px)
               max(env(safe-area-inset-right,0px),20px)
               max(env(safe-area-inset-bottom,0px),20px)
               max(env(safe-area-inset-left,0px),20px);
    }
    #gameover-overlay.active { display: flex; }
    #gameover-box {
      width: min(360px, 100%);
      max-height: calc(100svh - 40px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: #0c0710;
      border: 2px solid #e94560;
      box-shadow: 0 0 40px rgba(233,69,96,0.35);
      padding: 22px 22px 18px;
      text-align: center;
    }
    #gameover-title {
      font-size: 18px; color: #e94560; letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(233,69,96,0.7);
      margin-bottom: 16px;
    }
    #gameover-stats { font-size: 9px; color: #b0b8d0; line-height: 2.4; margin-bottom: 16px; }
    #gameover-stats b { color: #f9c74f; }

    #go-name-wrap { margin-bottom: 12px; }
    #go-name-input {
      width: 100%;
      background: #080818; border: 1px solid #4ecca3; color: #4ecca3;
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 9px 10px; outline: none; text-align: center;
    }
    #go-name-input::placeholder { color: #1a3a2a; }

    #go-name-static { font-size: 9px; color: #4ecca3; margin-bottom: 12px; }

    #go-submit-btn, #go-playagain-btn, #go-crib-btn {
      width: 100%;
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 10px; cursor: pointer;
      background: rgba(78,204,163,0.08); border: 1px solid #4ecca3; color: #4ecca3;
      transition: background 0.1s;
    }
    #go-submit-btn:hover, #go-playagain-btn:hover, #go-crib-btn:hover { background: rgba(78,204,163,0.22); }
    #go-submit-btn:disabled { opacity: 0.4; cursor: default; }

    #go-submit-status { font-size: 7px; color: #f9c74f; margin: 8px 0; min-height: 10px; }

    /* Placement acknowledgement + contact claim (shown after a successful submit) */
    #go-result { margin: 4px 0 10px; }
    .go-ack-big {
      font-size: 11px; color: #f9c74f; line-height: 1.8; letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(249,199,79,0.6);
    }
    .go-ack-plain { font-size: 8px; color: #b0b8d0; line-height: 1.8; }

    #go-claim { margin: 12px 0; padding: 12px 10px; border: 1px solid #f9c74f; background: rgba(249,199,79,0.05); }
    #go-claim-title { font-size: 7px; color: #f9c74f; line-height: 1.8; margin-bottom: 8px; }
    #go-claim-input {
      width: 100%;
      background: #080818; border: 1px solid #4ecca3; color: #4ecca3;
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 9px 10px; outline: none; text-align: center;
    }
    #go-claim-input::placeholder { color: #1a3a2a; }
    #go-claim-error { font-size: 7px; color: #e94560; min-height: 10px; margin: 6px 0 2px; }
    #go-claim-btns { display: flex; gap: 6px; margin-top: 6px; }
    #go-claim-btns button {
      flex: 1; font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 9px; cursor: pointer;
      background: rgba(78,204,163,0.08); border: 1px solid #4ecca3; color: #4ecca3;
    }
    #go-claim-btns button:hover { background: rgba(78,204,163,0.22); }
    #go-claim-btns button:disabled { opacity: 0.4; cursor: default; }
    #go-claim-skip { border-color: #4a4a5a !important; color: #6a6a80 !important; background: transparent !important; }
    #go-claim-ok { font-size: 9px; color: #4ecca3; padding: 6px 0; }
    #go-claim-fine { font-size: 6px; color: #6a6a80; line-height: 1.8; margin-top: 8px; }

    #go-board { margin: 16px 0; border-top: 1px solid #2a1420; padding-top: 12px; }
    #go-board-title { font-size: 9px; color: #e94560; margin-bottom: 8px; letter-spacing: 1px; text-align: left; }

    #go-playagain-btn { margin-top: 4px; border-color: #e94560; color: #e94560; background: rgba(233,69,96,0.08); }
    #go-playagain-btn:hover { background: rgba(233,69,96,0.22); }
    #go-crib-btn { margin-top: 8px; }

    /* ── TAP TO FIGHT — shown after the intro when audio is still locked ── */
    #tap-prompt {
      position: fixed; inset: 0; z-index: 120;
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      background: rgba(5,5,10,0.35);
      cursor: pointer; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    #tap-prompt.show { display: flex; }
    #tap-prompt-main {
      font-family: 'Press Start 2P', monospace; font-size: 20px; letter-spacing: 3px;
      color: #e94560; text-shadow: 0 0 14px rgba(233,69,96,0.8), 0 2px 0 #05050a;
      animation: tapPulse 1.2s ease-in-out infinite;
    }
    #tap-prompt-sub {
      font-family: 'Press Start 2P', monospace; font-size: 7px; letter-spacing: 2px;
      color: #b0b8d0; text-shadow: 0 1px 0 #05050a;
    }
    @keyframes tapPulse {
      0%, 100% { opacity: 0.55; transform: scale(0.97); }
      50%      { opacity: 1;    transform: scale(1.03); }
    }

    /* ── Master mute toggle (same look as room 1's; sits under the HUD line) ── */
    #mute-toggle {
      position: fixed;
      top: 32px; right: 8px;
      width: 24px; height: 24px;
      background: rgba(5,5,10,0.72);
      border: 1px solid #f9c74f;
      color: #f9c74f;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      cursor: pointer;
      z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 0; outline: none;
      box-shadow: 0 0 10px rgba(249,199,79,0.20);
    }
    #mute-toggle:hover { background: rgba(249,199,79,0.18); }
    #mute-toggle.muted { color: #555; border-color: #333; box-shadow: none; }
    #mute-toggle.muted span { text-decoration: line-through; }
  </style>
</head>
<body>

<div id="game-container">

  <div id="rotate-screen">
    <div id="rotate-icon">⟳</div>
    <div id="rotate-msg">ROTATE DEVICE</div>
    <div id="rotate-sub">this game is landscape only</div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <canvas id="transitionCanvas"></canvas>

</div>

<div id="touch-ui">
  <div id="joystick-zone"></div>
  <div id="joystick-rest"></div>
  <div id="joystick-base"><div id="joystick-knob"></div></div>
  <div id="aim-ring"><div id="aim-knob"></div></div>
  <div id="buy-btn">BUY</div>
  <div id="fire-btn">⊕</div>
  <!-- Bottom weapon row: after the joystick zone in the DOM and z-indexed above it, so touches that start
       here never reach the movement joystick or the aim stick. -->
  <div id="weapon-row">
    <div id="wr-switch" class="wr-el wr-btn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 5h11M10 2l3 3-3 3M14 11H3M6 8l-3 3 3 3"/></svg>
      <span>SWITCH</span>
    </div>
    <div id="wr-ammo" class="wr-el">
      <span id="wr-label">[PISTOL]</span>
      <span id="wr-count">12/12</span>
      <span id="wr-tank"><i></i><u></u></span>
    </div>
    <div id="wr-reload" class="wr-el wr-btn">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M16 10a6 6 0 1 1-2-4.5M16 3v4h-4"/></svg>
      <span>RELOAD</span>
    </div>
  </div>
</div>

<button id="mute-toggle" type="button" aria-label="Mute all sound" title="Mute all sound (M)"><span>♪</span></button>

<div id="tap-prompt">
  <div id="tap-prompt-main">TAP TO FIGHT</div>
  <div id="tap-prompt-sub">SOUND ON</div>
</div>

<div id="gameover-overlay">
  <div id="gameover-box">
    <div id="gameover-title">GAME OVER</div>
    <div id="gameover-stats">
      <span id="go-gross-row">SCORE: <b id="go-gross">0</b><br></span>
      <span id="go-spent-row" style="display:none">SPENT: <b id="go-spent" style="color:#e94560">0</b><br></span>
      <span id="go-bonus-row" style="display:none">NO-HEAL BONUS: <b id="go-bonus" style="color:#4ecca3">0</b><br></span>
      FINAL: <b id="go-score">0</b><br>
      WAVE REACHED: <b id="go-wave">1</b>
    </div>

    <div id="go-name-wrap" style="display:none">
      <input id="go-name-input" maxlength="12" placeholder="YOUR NAME" autocomplete="off">
    </div>
    <div id="go-name-static" style="display:none"></div>

    <button id="go-submit-btn">SUBMIT SCORE</button>
    <div id="go-submit-status"></div>

<script>
// ─────────────────────────────────────────────────────────
//  ZOMBIE STREET — Room 2 foundation
//  Same vanilla Canvas architecture as index.html (room 1): world size
//  auto-derived from the background image, fixed camera-window
//  resolution panned across it, sceneObjects + wouldCollide() for
//  static geometry, Y-sorted rendering, responsive resizeGame().
//
//  No zombies, combat, or wave logic yet — this pass only builds the
//  walkable street and gets the player moving around in it.
// ─────────────────────────────────────────────────────────

// These get overwritten by bgImg.onload — do not change manually
let WORLD_W = 3200;   // placeholder — replaced once plt2.png loads
let WORLD_H = 1600;   // placeholder

// Fixed camera-window resolution — IDENTICAL to index.html's VIEW_W/VIEW_H.
// The camera pans this same fixed window across the much larger world
// instead of scaling the window up.
const VIEW_W = 1537;
const VIEW_H = 768;

let SCREEN_W = VIEW_W;
let SCREEN_H = VIEW_H;

// ── Player geometry — hardcoded to the actual on-screen pixel size
//    index.html renders the player at (NOT a % of this room's much
//    taller background, which would render ~2x too large). ──
const PW          = 92;
const PH          = 123;
const FEET_OY     = Math.round(PH * 0.77);   // 95
const FEET_H      = Math.round(PH * 0.23);   // 28
const FEET_MARGIN = Math.round(PW * 0.28);   // 26
const SPEED       = 4.5;
const JOY_SPEED    = 4.5;

// World-bounds margin — keeps the player from walking off the map edge.
// (Room 1 uses ROOM_L/R + FLOOR_TOP/BTM for an interior floor plan; this
// is the open-street equivalent — the walkable area is the whole map
// minus a small edge margin, with buildings as the actual obstacles.)
const WORLD_MARGIN = 20;

// ── Night tint — shared helper, reused later for zombies + weapon sheets.
//    Composites a translucent navy multiply-tint over a sprite's own
//    silhouette so day-lit art reads as night-lit without new art. ──
const NIGHT_TINT_COLOR    = '#141c3a';
const NIGHT_TINT_STRENGTH = 0.5;   // 0..1

// ─────────────────────────────────────────────────────────
//  ZOMBIE TIERS — plain constants, hand-tune freely.
//  A is weakest/slowest, C is strongest/fastest. Contact damage isn't
//  applied yet (no player HP this pass) but is defined now so combat
//  can read it directly later.
// ─────────────────────────────────────────────────────────
const ZOMBIE_TIERS = {
  A: { hp: 20, speed: 1.5, damage: 5,  color: '#3a4a34', sheet: 'assets/zombieA.png' },
  B: { hp: 45, speed: 2.0, damage: 10, color: '#4a3a52', sheet: 'assets/zombieB.png' },
  C: { hp: 90, speed: 2.6, damage: 18, color: '#5c2020', sheet: 'assets/zombieC.png' },
};

// Wave at which each tougher tier first becomes eligible to spawn.
const WAVE_TIER_B_START = 3;
const WAVE_TIER_C_START = 6;

// Once unlocked, a tier's share of spawns grows this much per wave
// beyond its unlock wave, capped so tier A never fully disappears.
const TIER_WEIGHT_GROWTH = 0.15;
const TIER_WEIGHT_MAX    = 0.6;

// ── Difficulty scaling — formula-driven, not a hand-written table. ──
const ZOMBIE_COUNT_BASE    = 4;   // zombies in wave 1
const ZOMBIE_COUNT_GROWTH  = 2;   // additional zombies per wave
const ZOMBIE_COUNT_MAX     = 40;  // hard cap regardless of wave number

const ZOMBIE_HP_MULT_GROWTH    = 0.08;  // +8% HP per wave beyond 1
const ZOMBIE_HP_MULT_MAX       = 2.5;
const ZOMBIE_SPEED_MULT_GROWTH = 0.02;  // +2% speed per wave beyond 1
const ZOMBIE_SPEED_MULT_MAX    = 1.6;

// Hand overrides for the first few waves — anything not listed here
// falls through to the ZOMBIE_COUNT_* formula above.
const WAVE_COUNT_OVERRIDES = {
  1: 4,
  2: 6,
};

const SPAWN_INTERVAL = 900;   // ms between individual zombie spawns during a wave

const WAVE_INTRO_DURATION = 2200; // ms the "WAVE N" banner is shown
const WAVE_CLEAR_DURATION = 2500; // ms countdown after the last zombie is gone

// Extra settle time after the intro pixelation transition finishes, before
// the wave/spawn system (and its banner) actually begins — gives any
// still-loading player/zombie/weapon art a moment to arrive. The player
// can still move around freely during this buffer; only waves are held.
const GAME_START_BUFFER_MS = 2000;
// wave_start.mp3's big hit sits this far into the file — it's scheduled so
// the hit lands exactly when the wave starts spawning (see scheduleWaveStartSfx).
const WAVE_START_HIT_SEC = 4.75;

// Anti-stuck: if a zombie has barely moved for this long despite trying,
// it's wedged in a concave corner the axis-slide alone can't escape —
// give it a small perpendicular shove to break free.
const STUCK_CHECK_INTERVAL = 2000; // ms window to judge "hasn't moved"
const STUCK_MIN_DISTANCE   = 6;    // px moved within the window to NOT be stuck
const STUCK_NUDGE          = 14;   // px, perpendicular shove magnitude

// A knocked-back zombie (see applyZombieKnockback) is "staggered" for this
// long — its push velocity drives movement instead of the normal
// chase-toward-player logic, decaying linearly to zero across the window.
const KNOCKBACK_STAGGER_DURATION = 380; // ms

// ─────────────────────────────────────────────────────────
//  WEAPONS — plain per-weapon constants, hand-tune freely.
//  coneDeg is the FULL angle of the hitscan cone (centered on the aim
//  angle). With 8 aim directions 45° apart, a single-target weapon's
//  cone must stay well under 45° or two adjacent directions would hit
//  the same target — the shotgun is the deliberate exception: it's
//  wide enough to overlap neighboring directions and can multi-hit.
// ─────────────────────────────────────────────────────────
const WEAPON_ORDER = ['pistol', 'uzi', 'shotgun', 'draco', 'hose']; // unlock progression order (hose comes from the secret hydrant, not a wave)

// ─────────────────────────────────────────────────────────
//  SECRET HYDRANT — hydrant_2 can be shot to pieces; it then spouts a
//  water jet and drops the WATER HOSE pickup (once per run).
// ─────────────────────────────────────────────────────────
const SECRET_HP            = 2000;
const SECRET_FLASH_MS      = 70;     // white flash on hit
const SECRET_SHAKE_PX      = 2;      // draw-position shake, decays (visual only)
const SECRET_SHAKE_MS      = 120;
const SECRET_BAR_W         = 36;     // tiny hp bar above it
const SECRET_BAR_H         = 3;
const SECRET_BAR_HOLD_MS   = 1200;   // fully visible this long after the last hit...
const SECRET_BAR_FADE_MS   = 300;    // ...then fades out over this
const SECRET_HIT_RADIUS    = 30;     // px — how "fat" the hydrant is for the aim cone
const SECRET_PICKUP_OFFSET = { x: 85, y: -12 }; // hose pickup, from the hydrant's ground point
const SECRET_PICKUP_RADIUS = 46;     // px from the player's feet to grab it
// The broken hydrant's water jet. Starts near the BOTTOM of the sprite
// (originFromBottom px above its ground point) and is a thick column.
const SECRET_JET           = {
  everyMs: 20,              // spawn tick
  perTick: 3,               // particles per tick (≈150/s)
  speed: [0.28, 0.48],      // px/ms, mostly upward
  life: [450, 850],
  gravity: 0.0005,
  spread: 0.22,             // rad, fan around straight up
  originFromBottom: 26,     // px above the sprite's bottom edge
  originJitter: 7,          // px of random sideways offset (column thickness)
  size: [3, 6],             // px squares (blood/hose particles use 2–4)
};
const SECRET_BURST_COUNT   = 50;     // water burst when it breaks

// ─────────────────────────────────────────────────────────
//  HOSE — the water hose weapon. Hold fire to spray; every zombie in the
//  cone is pushed (continuous force) and damaged (every HOSE_TICK_MS).
// ─────────────────────────────────────────────────────────
const HOSE_CONE_DEG        = 50;    // as wide as the shotgun
const HOSE_RANGE           = 650;   // about twice the shotgun's reach
const HOSE_TICK_MS         = 150;   // damage/push applied every tick while held
const HOSE_DAMAGE_NEAR     = 2;     // max damage per tick, close range
const HOSE_DAMAGE_FAR      = 1;     // damage per tick in the far half of the range
const HOSE_PUSH_NEAR       = 18;    // px per frame push at point-blank (was 7 — ~2.6x stronger)
const HOSE_PUSH_MIN_FRAC   = 0.15;  // push at max range = 15% of near push
const HOSE_TANK_MAX        = 100;
const HOSE_DRAIN_PER_SEC   = 22;    // ~4.5 s of continuous spray from full
const HOSE_REFILL_PER_SEC  = 12;    // refills only while not spraying
const HOSE_REFILL_DELAY_MS = 600;   // pause after spraying before refill starts
// extras
const HOSE_SPUTTER_RECOVER = 25;    // after running dry, can't spray again until the tank is above this
const HOSE_RESIST          = { A: 1.0, B: 0.95, C: 0.9 }; // per-tier push resistance (nearly equal: the chase slowdown below does the rest)
const HOSE_HOLD_LINGER_MS  = 150;   // a zombie stays "held" this long after it last left the cone
const HOSE_HOLD_CHASE_MULT = 0.2;   // ...and its own chase movement is multiplied by this, so the push isn't fighting its walk
const HOSE_BEAM_FADE_MS    = 100;   // beam fades in/out over this
const HOSE_BEAM_ALPHA_NEAR = 0.38;  // beam opacity at the nozzle (fades to 0 at the end)
const HOSE_BAND_SPACING    = 90;    // px between the flowing bands
const HOSE_FLOW_SPEED      = 0.45;  // px/ms the bands travel outward
const HOSE_NOZZLE_PER_FRAME = 3;    // water particles spawned at the tip per 60fps frame
const HOSE_NOZZLE_SPEED    = [0.8, 1.3];  // px/ms
const HOSE_NOZZLE_LIFE     = [350, 600];  // ms
const HOSE_SPLASH_PER_TICK = 3;     // splash particles per zombie in the cone, per tick
const HOSE_WATER_COLORS    = ['#d6f0ff', '#8fd0ff', '#ffffff', '#4aa3ff'];

// ╔═══════════════════════════════════════════════════════════════════╗
// ║  ★★★  TWEAK ZONE — SHOTGUN DAMAGE + KNOCKBACK  ★★★                ║
// ║  Edit the numbers in this box; everything else reads from here.   ║
// ╚═══════════════════════════════════════════════════════════════════╝
//
// SHOTGUN DAMAGE — per pellet-cone hit, scaled by distance to each zombie:
//   damage = lerp(NEAR, FAR, dist / range)   (range is the shotgun's 320 px)
// Knockback below is scaled by the same falloff, so a far hit also shoves
// less (at the cone's edge: FAR / NEAR of the number you set).
const SHOTGUN_DAMAGE_NEAR = 34;   // point-blank
const SHOTGUN_DAMAGE_FAR  = 14;   // at the edge of the range
const SHOTGUN_FALLOFF_MIN = SHOTGUN_DAMAGE_FAR / SHOTGUN_DAMAGE_NEAR; // (derived — don't edit)

// KNOCKBACK — approx total px a zombie is pushed per hit, by zombie tier.
// Bigger = shoved further. (Duration of the push: KNOCKBACK_STAGGER_DURATION.)
const PISTOL_KNOCKBACK  = { A: 40,  B: 30,  C: 10 };
const UZI_KNOCKBACK     = { A: 1,   B: 1,   C: 1  };  // was 18/12/4 — now barely a nudge
const SHOTGUN_KNOCKBACK = { A: 260, B: 80, C: 280 };  // was 140/120/30 — now much stronger
const DRACO_KNOCKBACK   = { A: 55,  B: 9,  C: 35 };

// Uzi/draco hits ADD to a zombie's existing push (so sustained fire drives it
// back). This caps the total pile-up, in the same px units as above.
const KNOCKBACK_STACK_CAP = 90;
// ═══════════════════════════ end tweak zone ═══════════════════════════

// Per-tier knockback is the approximate total px a zombie travels over
// KNOCKBACK_STAGGER_DURATION (see applyZombieKnockback) — A/B (weakest/mid)
// get shoved the most, C (toughest) barely budges.
//   knockbackStack: true  → a new hit ADDS to the zombie's existing push
//                          (capped by KNOCKBACK_STACK_CAP) instead of
//                          resetting it, so sustained full-auto fire drives
//                          a zombie visibly back.
//   range: the pistol/uzi/draco use WORLD_W (a getter, since WORLD_W is only
//   known once the background image loads) so shots cover the whole map
//   width; they still only ever hit the nearest zombie in the cone.
//   spriteFallback: weapon whose sheet is used while this weapon's own
//   skin{A,B,C}{File}.png is missing.
const WEAPONS = {
  pistol:  { label: 'PISTOL',  short: 'PST', damage: 14, fireRate: 380, get range() { return WORLD_W; }, coneDeg: 18, multiHit: false,
    knockback: PISTOL_KNOCKBACK },
  uzi:     { label: 'UZI',     short: 'UZI', damage: 6,  fireRate: 90,  get range() { return WORLD_W; }, coneDeg: 22, multiHit: false,
    knockback: UZI_KNOCKBACK, knockbackStack: true },
  shotgun: { label: 'SHOTGUN', short: 'SG',  damage: SHOTGUN_DAMAGE_NEAR, fireRate: 750, range: 320, coneDeg: 50, multiHit: true,
    knockback: SHOTGUN_KNOCKBACK, distFalloffMin: SHOTGUN_FALLOFF_MIN },
  draco:   { label: 'DRACO',   short: 'DRC', damage: 13, fireRate: 140, get range() { return WORLD_W; }, coneDeg: 22, multiHit: false,
    knockback: DRACO_KNOCKBACK, knockbackStack: true, spriteFallback: 'uzi' },
  // Continuous weapon — handled by updateHose(), not fireWeapon()/tryFire().
  hose:    { label: 'WATER HOSE', short: 'HOSE', damage: HOSE_DAMAGE_NEAR, fireRate: HOSE_TICK_MS, range: HOSE_RANGE, coneDeg: HOSE_CONE_DEG,
    multiHit: true, continuous: true, spriteFallback: 'pistol' },
};

// Wave-clear events that unlock each later weapon (pistol is available
// from the start). Sits next to the wave-scaling constants above since
// both drive off the same wave-clear progression.
const WEAPON_UNLOCK_WAVE = {
  uzi:     4,
  shotgun: 8,
  draco:   11,
};

const WEAPON_UNLOCK_NOTICE_DURATION = 2400; // ms the "WEAPON UNLOCKED" banner shows

// ─────────────────────────────────────────────────────────
//  RELOAD — magazines. Ammo is UNLIMITED in total; only the magazine is
//  limited. The water hose has no magazine and never reloads. Hand-tune freely.
//    mode 'mag'   — the whole magazine refills after reloadMs (no firing meanwhile)
//    mode 'shell' — one shell goes in every shellMs until full; firing with
//                   1+ shells loaded interrupts the reload
// ─────────────────────────────────────────────────────────
const MAGS = {
  pistol:  { size: 12, mode: 'mag',   reloadMs: 2000 },
  uzi:     { size: 32, mode: 'mag',   reloadMs: 1500 },
  draco:   { size: 40, mode: 'mag',   reloadMs: 1500 },
  shotgun: { size: 12, mode: 'shell', shellMs: 500 },
};
const DRY_FIRE_GAP_MS = 250;  // max one 'dry_fire' per this many ms
const SHOTGUN_PUMP_DELAY_MS = 180; // the pump plays this long after every shotgun blast (fireRate 750 lets it finish first)
const AMMO_LOW_FRAC   = 0.25; // HUD count turns red + pulses at/below this fraction
// Reload ring above the player's head (same look as the vending ring).
const RELOAD_RING = { dy: -38, r: 11, lineW: 4, color: '#f9c74f', stackDy: -30 /* extra lift while the vending ring is up */ };
const SHELL_PIP   = { w: 3, h: 4, gap: 1.5, loaded: '#f9c74f', empty: 'rgba(249,199,79,0.25)' };
// Ejected junk (visual only). Motion units: px and ms. `drop` = px it falls from the
// muzzle to the ground; one bounce (bounce × impact speed), then it rests restMs and
// fades over fadeMs. `max` = alive at once (oldest removed first).
const MAG_DROP = { w: 6, h: 10, fill: '#22252b', edge: '#0e0f12',
  speed: 0.07, kick: 0.12, drop: 20, gravity: 0.0009, bounce: 0.35, spin: 0.012,
  restMs: 5000, fadeMs: 600, max: 20 };
const SHELL_CASING = { w: 3, h: 6, body: '#c4302b', brass: '#d4a63a',
  speed: 0.08, kick: 0.14, drop: 20, gravity: 0.0009, bounce: 0.35, spin: 0.016,
  restMs: 4000, fadeMs: 600, max: 20 };

// Transient combat FX durations (procedural, no art assets).
const TRACER_FX_DURATION = 110; // ms a shot's tracer/muzzle-flash is visible
const DEATH_FX_DURATION  = 420; // ms a zombie's death burst plays

// ─────────────────────────────────────────────────────────
//  HIT_FX — combat "juice" (VISUAL ONLY: nothing here touches damage,
//  hitboxes or movement). Every value for the blood / flash / numbers /
//  hp-bar / hitstop / shake / muzzle / recoil pass lives in this block.
//  Times are ms, distances are world px, speeds are px per ms.
// ─────────────────────────────────────────────────────────
const HIT_FX = {
  // Blood particles — small pixel squares spraying along the bullet's
  // direction (± particleSpreadDeg). Each hit spawns its own set.
  particleCount:      [5, 8],       // per non-lethal hit (min, max)
  particleCountKill:  [5, 8],       // per killing blow (the death burst is drawn on top of these)
  particleSize:       [2, 4],       // px square
  particleSpreadDeg:  35,
  particleSpeed:      [0.10, 0.26], // px/ms
  particleGravity:    0.0003,       // px/ms² (+y, "slight")
  particleLife:       [300, 500],
  particleJitter:     8,            // px random offset of the spawn point
  particleColors:     ['#8a1c1c', '#a82424', '#6b1414', '#c43030'],
  particleMax:        700,          // alive cap, oldest dropped first

  // Ground decals — under all entities, fade out, oldest removed first.
  decalFadeMs:        6000,
  decalMax:           80,
  decalColor:         '88,10,14',   // rgb
  decalAlpha:         0.8,
  decalOffset:        16,           // px random offset from the zombie's feet
  decalHit:           { blobs: [2, 3], size: [3, 6] },    // blob count / blob px size
  decalKill:          { blobs: [7, 10], size: [4, 9] },
  decalKillSpread:    14,           // px radius the kill splat's blobs scatter over
  decalHitSpread:     6,

  // Zombie hit reaction
  flashMs:            70,
  flashColor:         'rgba(255,205,195,0.85)', // white-red, clipped to the sprite silhouette
  spriteShakeMs:      120,
  spriteShakeAmp:     3,            // px, decays to 0 — draw position only

  // Damage numbers
  numRiseMs:          550,          // rise + fade duration
  numRisePx:          18,
  numMergeMs:         300,          // same zombie hit again within this → add to its number
  numPop:             0.3,          // extra scale on a merge
  numPopMs:           120,
  numColor:           '#ffd9c9',
  numKillColor:       '#fff04d',
  numFont:            '8px "Press Start 2P"',
  numKillFont:        '10px "Press Start 2P"',
  numYOffset:         -12,          // px above the sprite's top edge (hp bar sits just under it)

  // Zombie HP bar — only after being damaged
  hpBarW:             40,
  hpBarH:             4,
  hpBarYOffset:       -5,           // px above the sprite's top edge
  hpBarHoldMs:        1500,         // fully visible this long after the last hit...
  hpBarFadeMs:        300,          // ...then fades out over this
  hpBarBg:            'rgba(20,5,10,0.75)',
  hpBarFill:          '#e94560',

  // Weight
  hitstopMs:          35,           // game updates freeze on a kill (rendering continues)
  hitstopMinGapMs:    150,          // at most once per this
  shotShake:          { shotgun: { amp: 3, ms: 90 }, draco: { amp: 3, ms: 90 } },
  killShake:          { amp: 1, ms: 60 },
  muzzleMs:           60,           // muzzle flash sprite lifetime
  muzzleLen:          24,           // px, flash length along the aim
  muzzleScaleMulti:   1.5,          // × for multi-hit weapons (shotgun)
  recoilPx:           2,            // player sprite nudged this far opposite the aim...
  recoilMs:           60,           // ...for this long
  vibrateMs:          12,           // navigator.vibrate on kills (Android)
};



// Purely visual — where the tracer/muzzle-flash is drawn FROM, as a
// fraction of PW (x) / PH (y) from the player's top-left corner, per
// facing direction. Separate from originX/originY in fireWeapon(),
// which stay feet-anchored for hit detection — this just moves the
// drawn ray to roughly where the gun sits in each pose.
const TRACER_VISUAL_ORIGIN = {
  down:  { x: 0.40, y: 0.75 },
  up:    { x: 0.60, y: 0.40 },
  left:  { x: 0.05, y: 0.55 },
  right: { x: 0.95, y: 0.55 },
};

// Single-target tracer: a hit draws muzzle → middle of the hit zombie's
// sprite (this fraction of PH down from its top), behind that zombie.
const TRACER_HIT_TARGET_Y = 0.5;

// Shotgun: instead of rays, one soft light wedge matching coneDeg and range
// (radial gradient from this alpha at the muzzle to 0 at the edge), fading
// out over TRACER_FX_DURATION, plus a slightly larger muzzle flash.
const SHOTGUN_CONE_ALPHA  = 0.35;
const SHOTGUN_CONE_COLOR  = '255,244,214'; // rgb of the warm white
const MUZZLE_FLASH_RADIUS = 10;            // px, base flash size
const SHOTGUN_FLASH_SCALE = 1.5;           // × MUZZLE_FLASH_RADIUS for the shotgun

// ─────────────────────────────────────────────────────────
//  PLAYER HP / SCORING — plain constants, hand-tune freely.
// ─────────────────────────────────────────────────────────
const PLAYER_MAX_HP          = 100;
const PLAYER_INVULN_DURATION = 700; // ms of i-frames after taking a hit
const PLAYER_KNOCKBACK       = 34;  // px shoved away from the zombie on hit

const SCORE_PER_KILL = { A: 10, B: 25, C: 60 }; // more points for tougher tiers
const SCORE_WAVE_CLEAR_BONUS = 50;              // flat bonus per wave cleared

// ─────────────────────────────────────────────────────────
//  VENDING — the ONLY way to restore health (no drops, ever). Buying
//  spends SCORE; there is no separate currency. Hand-tune freely.
// ─────────────────────────────────────────────────────────
const VEND_HEAL_AMOUNT        = 40;    // HP per potion, capped at max HP
const VEND_MIN_PRICE          = 150;   // floor, keeps it expensive early
const VEND_INCOME_FRACTION    = 0.7;   // price = 70% of score earned last wave
const VEND_REPEAT_SURCHARGE   = 0.10;  // +10% per potion already bought this run (compounding)
const VEND_BUY_TIME           = 500;   // ms player is frozen while buying
const VEND_RANGE              = 90;    // px from the machine's front
const NO_HEAL_BONUS_FRACTION  = 0.10;  // +10% final score if never bought

// Machine art / footprint (ground-anchored, same idea as the hydrants).
const VENDING_W = 104, VENDING_H = 165;
const VENDING_COLLISION = { offsetX: 6, offsetY: 99, w: 92, h: 66 }; // bottom ~40%

// Visuals
const VEND_GLOW_RGB     = '120,220,255'; // ground glow in front of the machine
const VEND_GLOW_ALPHA   = 0.22;          // peak alpha of the pulse
const VEND_GLOW_RX      = 130;           // px
const VEND_GLOW_RY      = 55;            // px
const VEND_GLOW_OFFSET_Y = 34;           // px in front of (below) the ground point
const VEND_GLOW_PULSE_MS = 2200;
const VEND_ERR_FLASH_MS = 350;           // label flashes red this long on a refused buy
const VEND_FLOAT_MS     = 1000;          // "-price" / "+HP" floating text lifetime

// ── Sprite sheet layout — same grid as index.html ──
//  rows = directions, cols = frames
const FRAME_W  = 256;
const FRAME_H  = 256;
const DIR_ROW  = { down:0, up:1, left:2, right:3 };

// ── 8-way aim directions — independent of the 4-way walk-facing above.
//    Index order matches a clockwise sweep starting at "right" so
//    Math.round(angle / 45°) maps directly onto it (see angleToAimDir). ──
const AIM_DIRS = [
  { dx: 1, dy: 0 }, { dx: 1, dy: 1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 1 },
  { dx: -1, dy: 0 }, { dx: -1, dy: -1 }, { dx: 0, dy: -1 }, { dx: 1, dy: -1 },
].map(d => {
  const len = Math.hypot(d.dx, d.dy);
  return { dx: d.dx / len, dy: d.dy / len };
});

function angleToAimDir(ix, iy) {
  const angle = Math.atan2(iy, ix);
  let idx = Math.round(angle / (Math.PI / 4));
  return ((idx % 8) + 8) % 8;
}

// ─────────────────────────────────────────────────────────
//  AIM_STICK — dual-stick / mouse aim tuning. Hand-tune freely.
// ─────────────────────────────────────────────────────────
const AIM_DEADZONE          = 0.25;  // fraction of AIM_JOY_MAX before the stick aims
const AIM_JOY_MAX           = 55;    // px the right knob can travel
const FIRE_MOVE_SPEED_MULT  = 0.7;   // movement speed while firing
const AIM_RELEASE_HOLD_MS   = 350;   // after releasing fire, aim stays put this long
const AIM_EASE_BACK_MS      = 180;   // then rotates back to movement direction over this
const AIM_LINE_LENGTH       = 140;   // px, faint aim indicator
const MOUSE_AIM_IDLE_MS     = 2500;  // mouse aim counts as active if moved within this

// Live aim-input state (the constants above are the only tunables).
const aim = {
  // right stick (touch)
  tid: null,            // touch identifier driving the stick, null when idle
  originX: 0, originY: 0, // client coords where the thumb landed — the stick's zero point
  stickPast: false,     // thumb is beyond the dead zone
  stickAngle: 0,        // stick angle (radians), valid while stickPast
  releaseAt: -1e9,      // performance.now() when the stick was released
  // mouse (desktop)
  mouseViewX: 0, mouseViewY: 0, // cursor in canvas view coords (VIEW_W × VIEW_H space)
  mouseOver: false,     // cursor is inside the canvas rect
  mouseMoveAt: -1e9,    // last time the cursor moved over the canvas
  mouseDown: false,     // left button held (keeps mouse aim alive while shooting)
  lastTouchAt: -1e9,    // ignore the compatibility mouse events a touch generates
  // derived each update()
  active: false,        // aiming override in effect (stick / mouse / release window)
  mode: null,           // 'stick' | 'mouse' | 'release' | null
  wasActive: false,
};

// 4-way sprite-row direction for an angle (0 = right, +y down) — the same
// rule the movement facing uses: horizontal wins ties, so a pure diagonal
// reads as left/right. The epsilon absorbs cos/sin float noise at 45°.
function angleToFacing(angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  if (Math.abs(c) >= Math.abs(s) - 1e-9) return c > 0 ? 'right' : 'left';
  return s > 0 ? 'down' : 'up';
}

//  VENDING MACHINE — pricing, buying, floating feedback

let scoreEarnedLastWave   = 0; // snapshot of the above when a wave was cleared (0 before wave 1 clears)
let potionsBoughtThisRun  = 0;
let totalSpent            = 0;

// price = round-to-10( max(MIN, FRACTION * earnedLastWave) * (1 + SURCHARGE)^potions )
function recalcVendPrice() {
  const base = Math.max(VEND_MIN_PRICE, VEND_INCOME_FRACTION * scoreEarnedLastWave);
  vendPrice = Math.round(base * Math.pow(1 + VEND_REPEAT_SURCHARGE, potionsBoughtThisRun) / 10) * 10;
}
